/* ─── Grupo Minero aggregation for Análisis Costo ─── */
function sumSeries(a, b) {
  if (!a && !b) return {vals:[], mes:null, ytd:null};
  if (!a) return b; if (!b) return a;
  const ss = (x, y) => x != null && y != null ? x + y : (x ?? y);
  return {
    vals: a.vals.map((v, i) => ss(v, b.vals[i])),
    mes: ss(a.mes, b.mes),
    ytd: ss(a.ytd, b.ytd),
  };
}
function sumSection(a, b) {
  const keys = new Set([...Object.keys(a||{}), ...Object.keys(b||{})]);
  const res = {};
  for (const k of keys) res[k] = sumSeries(a?.[k], b?.[k]);
  return res;
}

/* Aggregate waterfall panels from multiple company explicaciones responses */
function aggregateExpResults(results) {
  if (!results || results.length === 0) return null;
  const ss = (a, b) => (a != null && b != null) ? a + b : (a ?? b);
  const merged = {company: 'Grupo Minero', año: results[0].año, mes: results[0].mes, data: {}};
  for (const panel of ['mes', 'ytd']) {
    const panels = results.map(r => r.data?.[panel]).filter(Boolean);
    if (!panels.length) continue;
    const wf = {};
    const WF_KEYS = ['c1_b','c1_r','aj_tc','aj_ipc','aj_cpi',
      'pr_energia','pr_combustible','pr_acido','pr_bolas','pr_explosivos',
      'ley_conc','ley_hidro','act_mina_kus','act_conc_kus',
      'da_trat_conc','da_trat_hidro','da_rec_conc','da_rec_hidro','varinv',
      'rend_energia_conc','rend_energia_hidro','rend_combustible','rend_acido','rend_bolas','rend_explosivos',
      'dev_mina','tcrc_kus','comer_kus'];
    for (const key of WF_KEYS) wf[key] = panels.reduce((acc, p) => ss(acc, p.waterfall?.[key]), null);

    // Agrega arrays por posición sumando solo los efectos (real/ppto son tasas, no se suman)
    const mergeRows = (key, effKey) => {
      const first = panels[0]?.[key];
      if (!first) return [];
      return first.map((row, i) => ({
        ...row,
        real: null, ppto: null,
        [effKey]: panels.reduce((acc, p) => ss(acc, p[key]?.[i]?.[effKey]), null),
      }));
    };

    const mmObj = key => ({
      real:       panels.reduce((a,p) => ss(a, p[key]?.real),       null),
      ppto:       panels.reduce((a,p) => ss(a, p[key]?.ppto),       null),
      efecto_kus: panels.reduce((a,p) => ss(a, p[key]?.efecto_kus), null),
    });

    merged.data[panel] = {
      cu_prod_real:   panels.reduce((a,p) => ss(a, p.cu_prod_real),   null),
      cu_prod_budget: panels.reduce((a,p) => ss(a, p.cu_prod_budget), null),
      waterfall: wf,
      ajuste_monetario: mergeRows('ajuste_monetario', 'efecto_kus'),
      precio_insumos:   mergeRows('precio_insumos',   'efecto_kus'),
      rendimiento:      mergeRows('rendimiento',       'efecto_kus'),
      produccion:       mergeRows('produccion',        'efecto_ktcuf'),
      mov_mina:         mmObj('mov_mina'),
      desarrollo_mina: {
        ...mmObj('desarrollo_mina'),
        tonelaje_real:       panels.reduce((a,p) => ss(a, p.desarrollo_mina?.tonelaje_real),       null),
        tonelaje_ppto:       panels.reduce((a,p) => ss(a, p.desarrollo_mina?.tonelaje_ppto),       null),
        tonelaje_efecto_kus: panels.reduce((a,p) => ss(a, p.desarrollo_mina?.tonelaje_efecto_kus), null),
        cu_real: null, cu_ppto: null, cu_efecto_kus: null,
      },
    };
  }
  return merged;
}

/* Build ordered waterfall rows from panel data */
const B_CLB = 2204.62;
function toClb(kus, ktu) { return (ktu && ktu > 0) ? kus * 100 / (ktu * B_CLB) : null; }

function buildWaterfall(expData, panel, tipo2) {
  const d = expData?.data?.[panel];
  const wf = d?.waterfall || {};
  const t2 = tipo2 ? tipo2.charAt(0).toUpperCase() + tipo2.slice(1) : 'Ppto';

  let ktu = d?.cu_prod_budget ?? null;
  let kus = null;
  const rows = [];
  let baseClb = null;

  const clbOf = (k, t) => (k != null && t != null && t > 0) ? k * 100 / (t * B_CLB) : null;

  // Azul oscuro — muestra el kus acumulado actual
  const pushMain = (id, label) => {
    const clb = clbOf(kus, ktu);
    rows.push({id, label, type:'main', kus, ktu, clb, dclb: null});
    baseClb = clb;
  };

  // Gris claro — muestra abs_kus (null → "—"); solo actualiza kus si abs_kus != null
  const snapGroup = (id, label, abs_kus) => {
    const prev = baseClb;
    if (abs_kus != null) kus = abs_kus;
    const clb = abs_kus != null ? clbOf(abs_kus, ktu) : null;
    rows.push({id, label, type:'group',
      kus: abs_kus, ktu: abs_kus != null ? ktu : null, clb,
      dclb: clb != null && prev != null ? clb - prev : null});
    if (abs_kus != null) baseClb = clb;
  };

  // Azul oscuro — muestra abs_kus (null → "—"); solo actualiza kus si abs_kus != null
  const snapMain = (id, label, abs_kus) => {
    if (abs_kus != null) kus = abs_kus;
    const clb = abs_kus != null ? clbOf(abs_kus, ktu) : null;
    rows.push({id, label, type:'main',
      kus: abs_kus, ktu: abs_kus != null ? ktu : null, clb, dclb: null});
    if (abs_kus != null) baseClb = clb;
  };

  // Gris claro — aplica delta; dclb=null si ambos deltas son null
  const applyGroup = (id, label, dkus, dktu) => {
    const prev = baseClb;
    if (kus != null && dkus != null) kus += dkus;
    if (ktu != null && dktu != null) ktu += dktu;
    const clb = clbOf(kus, ktu);
    const hasD = dkus != null || dktu != null;
    rows.push({id, label, type:'group', kus, ktu, clb,
      dclb: hasD && clb != null && prev != null ? clb - prev : null});
    baseClb = clb;
  };

  // Suma null-safe: null cuando TODOS los valores son null
  const nsum = (...vals) => {
    const nn = vals.filter(v => v != null);
    return nn.length ? nn.reduce((a, b) => a + b, 0) : null;
  };

  // Grupo primero, luego sub-filas usando el estado PRE-grupo
  const groupThenSubs = (gid, glabel, gdkus, gdktu, subfn) => {
    const preKus = kus, preKtu = ktu, preClb = baseClb;
    applyGroup(gid, glabel, gdkus, gdktu);
    const sub = (id, label, dkus, dktu) => {
      const nk = preKus != null && dkus != null ? preKus + dkus : null;
      const np = preKtu != null && dktu != null ? preKtu + dktu : null;
      const clb = clbOf(nk, np);
      rows.push({id, label, type:'sub', kus:nk, ktu:np, clb,
        dclb: clb != null && preClb != null ? clb - preClb : null, dkus, dktu});
    };
    subfn(sub);
  };

  // ── PREÁMBULO PRESUPUESTO ──
  if      (wf.c3_b     != null) kus = wf.c3_b;
  else if (wf.c2_b     != null) kus = wf.c2_b;
  else if (wf.c1_abs_b != null) kus = wf.c1_abs_b + (wf.da_b || 0);
  else if (wf.c1_b     != null) kus = wf.c1_b;
  baseClb = clbOf(kus, ktu);

  snapMain('c3',          `C3 ${t2}`,                   wf.c3_b);
  snapMain('c2',          `C2 ${t2}`,                   wf.c2_b);
  applyGroup('da',        'Depreciación / Amortización', wf.da_b      != null ? -wf.da_b      : null, 0);
  snapMain('c1p',         `C1 ${t2}`,                   wf.c1_abs_b);
  applyGroup('subprod',   'Subproductos',               wf.subprod_b != null ? -wf.subprod_b : null, 0);
  pushMain('precredit',   `Pre-credit ${t2}`);
  applyGroup('tcrc_pre',  'TC/RC',                      wf.tcrc_b_total  != null ? -wf.tcrc_b_total  : null, 0);
  applyGroup('comer_pre', 'Comercialización',            wf.comer_b_total != null ? -wf.comer_b_total : null, 0);

  if (wf.c1_b != null) { kus = wf.c1_b; baseClb = clbOf(kus, ktu); }
  pushMain('onsite', `Costo Onsite ${t2}`);

  // ── EFECTOS (grupo siempre primero, sub-filas después) ──

  const aj_sum = nsum(wf.aj_tc, wf.aj_ipc, wf.aj_cpi);
  applyGroup('aj_mon', 'Efecto Ajuste Monetario', aj_sum ?? wf.aj_total_ca, 0);

  groupThenSubs('pr_ins', 'Efecto precio insumos',
    nsum(wf.pr_energia, wf.pr_combustible, wf.pr_acido, wf.pr_bolas, wf.pr_explosivos), 0,
    sub => {
      sub('pr_en', 'Energía',     wf.pr_energia,     0);
      sub('pr_cb', 'Combustible', wf.pr_combustible, 0);
      sub('pr_ac', 'Ácido',       wf.pr_acido,       0);
      sub('pr_bo', 'Bolas',       wf.pr_bolas,       0);
      sub('pr_ex', 'Explosivos',  wf.pr_explosivos,  0);
    });

  applyGroup('ley', 'Efecto ley', 0, nsum(wf.ley_conc, wf.ley_hidro));

  groupThenSubs('act', 'Efecto actividad', nsum(wf.act_mina_kus, wf.act_conc_kus), 0, sub => {
    sub('ac_mn', 'Mina',        wf.act_mina_kus, 0);
    sub('ac_cn', 'Tratamiento', wf.act_conc_kus, 0);
  });

  groupThenSubs('prod_cu', 'Efecto Producción Cu', 0, nsum(wf.da_trat_conc, wf.da_rec_conc, wf.varinv), sub => {
    sub('cu_tr', 'Tratamiento', 0, wf.da_trat_conc);
    sub('cu_rc', 'Recuperación',0, wf.da_rec_conc);
    sub('cu_iv', 'Inventario',  0, wf.varinv);
  });

  groupThenSubs('rend', 'Efecto rendimiento insumos',
    nsum(wf.rend_energia_conc, wf.rend_energia_hidro, wf.rend_combustible, wf.rend_acido, wf.rend_bolas, wf.rend_explosivos), 0,
    sub => {
      sub('rn_ec', 'Energía Conc',  wf.rend_energia_conc,  0);
      sub('rn_eh', 'Energía Hidro', wf.rend_energia_hidro, 0);
      sub('rn_cb', 'Combustible',   wf.rend_combustible,   0);
      sub('rn_ac', 'Ácido',         wf.rend_acido,         0);
      sub('rn_bo', 'Bolas',         wf.rend_bolas,         0);
      sub('rn_ex', 'Explosivos',    wf.rend_explosivos,    0);
    });

  groupThenSubs('dev', 'Desarrollo Mina', wf.dev_mina, 0, sub => {
    sub('dev_p', 'Efecto P', wf.dev_mina_cu,  0);
    sub('dev_q', 'Efecto Q', wf.dev_mina_ton, 0);
  });

  applyGroup('inv', 'Efecto inventarios', wf.vi_inv_kus, 0);

  applyGroup('ifrs16', 'IFRS16', wf.ifrs16_kus, 0);

  const efic = wf.c1_r != null && kus != null ? wf.c1_r - kus : null;
  applyGroup('efic', 'Eficiencia / desfases', efic, 0);

  pushMain('onsite_r', 'On Site Real');

  // ── CIERRE REAL ──
  applyGroup('tcrc_r',    'TC/RC',                      wf.tcrc_r_total  != null ? -wf.tcrc_r_total  : null, 0);
  applyGroup('comer_r',   'Comercialización',            wf.comer_r_total != null ? -wf.comer_r_total : null, 0);
  if (wf.precredit_r_costo != null) snapMain('precredit_r', 'Pre-credit Real', wf.precredit_r_costo);
  else pushMain('precredit_r', 'Pre-credit Real');
  applyGroup('subprod_r', 'Subproductos',               wf.subprod_r,    0);
  if (wf.c1_r_costo != null) snapMain('c1_real', 'C1 Real', wf.c1_r_costo);
  else pushMain('c1_real', 'C1 Real');
  applyGroup('da_r_row',  'Depreciación / Amortización', wf.da_r,         0);
  if (wf.c2_r != null) snapMain('c2_real', 'C2 Real', wf.c2_r);
  else pushMain('c2_real', 'C2 Real');
  applyGroup('otros_fin',     'Otros Items Financieros',        wf.otros_fin_r,     0);
  applyGroup('dif_cambio',    'Diferencias de cambio',          wf.dif_cambio_r,    0);
  applyGroup('donaciones',    'Donaciones',                     wf.donaciones_r,    0);
  applyGroup('gasto_expl',    'Gastos Exploraciones',           wf.gasto_expl_r,    0);
  applyGroup('ing_gasto_fin', 'Ingresos y Gastos Financieros',  wf.ing_gasto_fin_r, 0);
  applyGroup('ing_no_op',     'Ingresos No Operacionales',      wf.ing_no_op_r,     0);
  applyGroup('otros_egr',     'Otros egresos operacionales',    wf.otros_egr_op_r,  0);
  if (wf.c3_r != null) snapMain('c3_real', 'C3 Real', wf.c3_r);
  else pushMain('c3_real', 'C3 Real');

  return rows;
}

/* Waterfall table component */
const AC_N = (v, dec=0) => v == null ? <span style={{color:'#ccc'}}>—</span>
  : v.toLocaleString('es-CL', {minimumFractionDigits:dec, maximumFractionDigits:dec});
const AC_DCLB = (v) => {
  if (v == null) return <span style={{color:'#ccc'}}>—</span>;
  const col = v < -0.005 ? '#059669' : v > 0.005 ? 'var(--red)' : '#888';
  return <span style={{color:col}}>{v >= 0 ? '+' : ''}{v.toFixed(2)}</span>;
};

function WaterfallTable({rows}) {
  const thS = {background:'#1A3A4A', color:'white', padding:'6px 10px', fontSize:'.74rem', fontWeight:600, textAlign:'right', whiteSpace:'nowrap'};
  const thL = {...thS, textAlign:'left', minWidth:'200px'};
  const tdR = {padding:'3px 10px', textAlign:'right', fontSize:'.78rem', whiteSpace:'nowrap'};
  const tdL = {padding:'3px 10px', fontSize:'.79rem', whiteSpace:'nowrap'};

  return (
    <div className="tbl-wrap">
      <table style={{width:'100%', borderCollapse:'collapse', tableLayout:'fixed'}}>
        <colgroup>
          <col style={{width:'220px'}}/>
          <col style={{width:'110px'}}/>
          <col style={{width:'75px'}}/>
          <col style={{width:'90px'}}/>
          <col style={{width:'90px'}}/>
        </colgroup>
        <thead>
          <tr>
            <th style={thL}>Concepto</th>
            <th style={thS}>US$k</th>
            <th style={thS}>ktCuf</th>
            <th style={thS}>c/lb</th>
            <th style={thS}>Δ c/lb</th>
          </tr>
        </thead>
        <tbody>
          {rows.map(r => {
            const isMain  = r.type === 'main';
            const isGroup = r.type === 'group';
            const isSub   = r.type === 'sub';
            const bg = isMain ? '#1A3A4A' : isGroup ? '#d4e8ee' : 'white';
            const fg = isMain ? 'white' : '#1A3A4A';
            const fw = (isMain || isGroup) ? 700 : 400;
            const indent = isSub ? '20px' : '0';
            const rowBorderTop = isMain ? '2px solid #1A3A4A' : isGroup ? '1px solid #9ac8d8' : '1px solid #f0f0f0';
            return (
              <tr key={r.id} style={{background:bg, borderTop:rowBorderTop}}>
                <td style={{...tdL, color:fg, fontWeight:fw, paddingLeft:indent}}>{r.label}</td>
                <td style={{...tdR, color:fg, fontWeight:fw}}>{AC_N(r.kus, 0)}</td>
                <td style={{...tdR, color:fg, fontWeight:fw}}>{r.ktu != null ? r.ktu.toFixed(2) : '—'}</td>
                <td style={{...tdR, color:fg, fontWeight:fw}}>{r.clb != null ? r.clb.toFixed(2) : '—'}</td>
                <td style={{...tdR}}>{isMain ? null : AC_DCLB(r.dclb)}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

/* ─── Callout metadata (compartido con GraficosTab) ─── */
const CALLOUT_META = {
  act:  {label:'Actividad',     yOffset:  0, rows:[{id:'ac_mn', lbl:'Mov. Mina'}, {id:'ac_cn', lbl:'Planta'}]},
  prod: {label:'Prod. Cu',      yOffset: 44, rows:[{id:'cu_tr', lbl:'Cu Trat.'}, {id:'cu_rc', lbl:'Cu Rec.'}, {id:'cu_iv', lbl:'Cu Inv.'}]},
  vi:   {label:'Var.Inv./IFRIC',yOffset:  0, rows:[{id:'inv',  lbl:'Var. Inv.'}, {id:'ifrs16', lbl:'IFRIC 20'}]},
};

/* ─── Gráfico Waterfall SVG ─── */
function WaterfallSvgChart({rows, title, hiddenCallouts = new Set()}) {
  if (!rows || !rows.length) return null;

  const byId = {};
  for (const r of rows) byId[r.id] = r;

  const ns = (...ids) => {
    const vs = ids.map(id => byId[id]?.dclb).filter(v => v != null);
    return vs.length ? vs.reduce((a,b)=>a+b,0) : null;
  };
  const fv = (v) => v == null ? '—' : (v > 0 ? '+' : '') + v.toFixed(1);

  // Barras principales
  const bars = [
    {id:'c1_b',  labels:['C1','Ppto'],        type:'split',
      clb_net: byId.c1p?.clb,  clb_pre: byId.precredit?.clb},
    {id:'pre_b', labels:['Pre-créd.','Ppto'],  type:'anchor', clb: byId.precredit?.clb,   style:'pre'},
    {id:'aj',    labels:['Aj.','Monetario'],   type:'delta',  dclb: byId.aj_mon?.dclb},
    {id:'pr',    labels:['Precio','Insumos'],  type:'delta',  dclb: byId.pr_ins?.dclb},
    {id:'rend',  labels:['Rendim.','Insumos'], type:'delta',  dclb: byId.rend?.dclb},
    {id:'ley',   labels:['Leyes'],             type:'delta',  dclb: byId.ley?.dclb},
    {id:'act',   labels:['Actividad'],         type:'delta',  dclb: byId.act?.dclb,       callout:'act'},
    {id:'prod',  labels:['Prod.','Cu'],        type:'delta',  dclb: byId.prod_cu?.dclb,   callout:'prod'},
    {id:'vi',    labels:['Var.Inv.','& IFRIC'],type:'delta',  dclb: ns('inv','ifrs16'),   callout:'vi'},
    {id:'tcrc',  labels:['TC/RC &','Comerc.'], type:'delta',  dclb: ns('tcrc_pre','comer_pre','tcrc_r','comer_r')},
    {id:'otros', labels:['Otros'],             type:'delta',  dclb: ns('dev','efic')},
    {id:'pre_r', labels:['Pre-créd.','Real'],  type:'anchor', clb: byId.precredit_r?.clb, style:'pre'},
    {id:'c1_r',  labels:['C1','Real'],         type:'split',
      clb_net: byId.c1_real?.clb, clb_pre: byId.precredit_r?.clb},
  ];

  // Running total (pivot = Pre-crédito Ppto)
  let running = byId.precredit?.clb ?? null;
  const computed = bars.map(b => {
    if (b.type === 'anchor') {
      if (b.clb != null) running = b.clb;
      return {...b, isNull: b.clb == null};
    }
    if (b.type === 'split') {
      return {...b, isNull: b.clb_pre == null || b.clb_net == null};
    }
    const base = running;
    const d = b.dclb;
    if (running != null && d != null) running = running + d;
    return {...b, base, isNull: d == null};
  });

  // Layout — eje Y siempre desde 0; cajitas de callout dentro del área de gráfico
  const W = 880, H = 380;
  const ML = 46, MR = 10, MT = title ? 62 : 16, MB_LBL = 40;
  const MB = MB_LBL;
  const cH = H - MT - MB;
  const cW = W - ML - MR;
  const n = bars.length;
  const bGap = cW / n;
  const bW = bGap * 0.56;
  const bx = i => ML + i * bGap + (bGap - bW) / 2;
  const bcx = i => bx(i) + bW / 2;   // centro X de barra i

  // Escala Y: siempre desde 0
  const allTops = computed.flatMap(b => {
    if (b.isNull) return [];
    if (b.type === 'split')  return [b.clb_pre];
    if (b.type === 'anchor') return [b.clb];
    const d = b.dclb ?? 0, base = b.base ?? 0;
    return [base, base + d];
  }).filter(v => v != null && isFinite(v));

  if (!allTops.length) return <p style={{color:'#aaa', textAlign:'center', padding:'24px'}}>Sin datos</p>;

  const yMax = Math.max(...allTops) * 1.08;
  const sy = v => MT + cH - (v / yMax) * cH;
  const yBase = MT + cH;   // = sy(0)

  // Ticks Y
  const rawStep = yMax / 5;
  const texp = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const tickStep = Math.ceil(rawStep / texp) * texp;
  const ticks = [];
  for (let t = 0; t <= yMax + 0.001; t = Math.round((t + tickStep) * 1e6) / 1e6) ticks.push(t);

  const FILL = {c1:'#1A3A4A', pre:'#1A7080'};
  const CELESTE = '#4EC3C3';
  const GRN = '#059669', RED = '#dc2626', NEU = '#aaa';

  // Posiciones de barras Pre-crédito para el bracket
  const preBIdx  = computed.findIndex(b => b.id === 'pre_b');
  const preRIdx  = computed.findIndex(b => b.id === 'pre_r');
  const preBClb  = byId.precredit?.clb;
  const preRClb  = byId.precredit_r?.clb;
  const bracketY = MT - 16;  // entre título y área de barras
  const deltaPre = (preBClb != null && preRClb != null) ? preRClb - preBClb : null;
  const pctPre   = (deltaPre != null && preBClb) ? (deltaPre / preBClb * 100) : null;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:'block', fontFamily:'-apple-system,sans-serif'}}>
      {title && <text x={W/2} y={20} textAnchor="middle" fontSize={11} fontWeight={700} fill="#1A3A4A">{title}</text>}

      {/* Grid + eje Y */}
      {ticks.map((t,i) => (
        <g key={i}>
          <line x1={ML} y1={sy(t)} x2={ML+cW} y2={sy(t)} stroke="#ebebeb" strokeWidth={1}/>
          <text x={ML-4} y={sy(t)+3.5} textAnchor="end" fontSize={8} fill="#999">{t.toFixed(0)}</text>
        </g>
      ))}
      <text x={11} y={MT+cH/2} textAnchor="middle" fontSize={8} fill="#aaa"
        transform={`rotate(-90 11 ${MT+cH/2})`}>c/lb</text>
      <line x1={ML} y1={yBase} x2={ML+cW} y2={yBase} stroke="#bbb" strokeWidth={1}/>

      {/* ── Bracket superior Pre-créd Ppto → Pre-créd Real ── */}
      {deltaPre != null && preBIdx >= 0 && preRIdx >= 0 && (() => {
        const x1 = bcx(preBIdx), x2 = bcx(preRIdx);
        const by = bracketY;
        const col = deltaPre > 0.01 ? RED : deltaPre < -0.01 ? GRN : NEU;
        const lbl = `${deltaPre >= 0 ? '+' : ''}${deltaPre.toFixed(1)}${pctPre != null ? ` (${pctPre >= 0 ? '+' : ''}${pctPre.toFixed(0)}%)` : ''}`;
        return (
          <g>
            {/* línea horizontal + bajadas */}
            <line x1={x1} y1={by} x2={x2} y2={by} stroke={col} strokeWidth={1.2}/>
            <line x1={x1} y1={by} x2={x1} y2={sy(preBClb)-2} stroke={col} strokeWidth={1.2}/>
            {/* flecha bajando en x2 */}
            <line x1={x2} y1={by} x2={x2} y2={sy(preRClb)-2} stroke={col} strokeWidth={1.2}/>
            <polygon points={`${x2-4},${sy(preRClb)-2} ${x2+4},${sy(preRClb)-2} ${x2},${sy(preRClb)+5}`} fill={col}/>
            {/* etiqueta */}
            <text x={(x1+x2)/2} y={by-4} textAnchor="middle" fontSize={9} fontWeight={700} fill={col}>{lbl}</text>
          </g>
        );
      })()}

      {/* Conectores dashed entre barras delta consecutivas */}
      {computed.map((b, i) => {
        if (b.type !== 'delta' || b.isNull) return null;
        const nxt = computed[i+1];
        if (!nxt || nxt.type !== 'delta' || nxt.isNull) return null;
        const afterY = sy((b.base ?? 0) + (b.dclb ?? 0));
        return <line key={`c${i}`} x1={bx(i)+bW} y1={afterY} x2={bx(i+1)} y2={afterY}
          stroke="#ccc" strokeWidth={0.8} strokeDasharray="4,2"/>;
      })}

      {/* ── Barras ── */}
      {computed.map((b, i) => {
        if (b.isNull) return (
          <g key={b.id}>
            {b.labels.map((l,li) => <text key={li} x={bcx(i)} y={yBase+14+li*11}
              textAnchor="middle" fontSize={8} fill="#ccc">{l}</text>)}
          </g>
        );

        if (b.type === 'split') {
          // Celeste ABAJO (subproductos) + navy ARRIBA (C1 neto)
          // subVal = clb_pre − clb_net ocupa el segmento inferior (0 → subVal en eje)
          const subVal  = b.clb_pre - b.clb_net;
          const ySplit  = sy(subVal);           // frontera en pantalla
          const yTop    = sy(b.clb_pre);        // tope barra
          const hCelest = Math.max(yBase - ySplit, 1);
          const hNavy   = Math.max(ySplit - yTop, 1);
          return (
            <g key={b.id}>
              {/* Celeste: subproductos (abajo) */}
              <rect x={bx(i)} y={ySplit} width={bW} height={hCelest} fill={CELESTE} rx={0}/>
              {/* Navy: C1 neto (arriba) */}
              <rect x={bx(i)} y={yTop} width={bW} height={hNavy+1} fill="#1A3A4A" rx={2}/>
              {/* Valor C1 neto dentro del segmento navy */}
              {hNavy > 12 && <text x={bcx(i)} y={yTop + hNavy/2 + 3}
                textAnchor="middle" fontSize={8} fontWeight={700} fill="white">{b.clb_net.toFixed(1)}</text>}
              {/* Valor subproductos dentro del segmento celeste */}
              {hCelest > 12 && <text x={bcx(i)} y={ySplit + hCelest/2 + 3}
                textAnchor="middle" fontSize={8} fontWeight={700} fill="white">{subVal.toFixed(1)}</text>}
              {/* Etiqueta total encima (C1 neto + subproductos = nivel Pre-créd) */}
              <text x={bcx(i)} y={yTop-3} textAnchor="middle" fontSize={8.5} fontWeight={700} fill="#1A3A4A">
                {b.clb_pre.toFixed(1)}
              </text>
              {b.labels.map((l,li) => <text key={li} x={bcx(i)} y={yBase+14+li*11}
                textAnchor="middle" fontSize={8} fill="#333" fontWeight={600}>{l}</text>)}
            </g>
          );
        }

        if (b.type === 'anchor') {
          const yTop = sy(b.clb);
          const barH = Math.max(yBase - yTop, 1);
          const fill = FILL[b.style] ?? FILL.c1;
          return (
            <g key={b.id}>
              <rect x={bx(i)} y={yTop} width={bW} height={barH} fill={fill} rx={2}/>
              {barH > 12 && <text x={bcx(i)} y={yTop + barH/2 + 3}
                textAnchor="middle" fontSize={8} fontWeight={700} fill="white">{b.clb.toFixed(1)}</text>}
              <text x={bcx(i)} y={yTop-3} textAnchor="middle" fontSize={8.5} fontWeight={700} fill={fill}>
                {b.clb.toFixed(1)}
              </text>
              {b.labels.map((l,li) => <text key={li} x={bcx(i)} y={yBase+14+li*11}
                textAnchor="middle" fontSize={8} fill="#333" fontWeight={600}>{l}</text>)}
            </g>
          );
        }

        // Barra delta
        const d = b.dclb ?? 0;
        const base = b.base ?? 0;
        const yTop = sy(Math.max(base, base+d));
        const yBot = sy(Math.min(base, base+d));
        const barH = Math.max(yBot - yTop, 1.5);
        const col = d < -0.01 ? GRN : d > 0.01 ? RED : NEU;

        // Callout: dentro del área del gráfico, debajo de las barras delta
        const calloutMeta = b.callout ? CALLOUT_META[b.callout] : null;
        const showCallout = calloutMeta && !hiddenCallouts.has(b.callout);
        const calloutRows = calloutMeta?.rows ?? [];
        const callBoxW = 72;
        const callBoxH = calloutRows.length * 13 + 6;
        // Posición: 62% del área de barras desde arriba (debajo del nivel de running total)
        const callBoxY = MT + cH * 0.62 + (calloutMeta?.yOffset ?? 0);
        const callBoxX = bcx(i) - callBoxW / 2;

        return (
          <g key={b.id}>
            <rect x={bx(i)} y={yTop} width={bW} height={barH} fill={col} rx={1}/>
            <text x={bcx(i)} y={yTop-3} textAnchor="middle" fontSize={8} fontWeight={700} fill={col}>
              {fv(d)}
            </text>
            {b.labels.map((l,li) => <text key={li} x={bcx(i)} y={yBase+14+li*11}
              textAnchor="middle" fontSize={8} fill="#444">{l}</text>)}

            {/* Callout box con desglose */}
            {showCallout && (() => {
              const hasAny = calloutRows.some(s => byId[s.id]?.dclb != null);
              if (!hasAny) return null;
              const barBottomY = Math.max(yTop, yBot);
              return (
                <g>
                  {/* línea vertical de conexión desde base de barra hasta caja */}
                  <line x1={bcx(i)} y1={barBottomY + 2} x2={bcx(i)} y2={callBoxY}
                    stroke="#bbb" strokeWidth={0.8} strokeDasharray="3,2"/>
                  {/* fondo semitransparente */}
                  <rect x={callBoxX-1} y={callBoxY-1} width={callBoxW+2} height={callBoxH+2}
                    fill="white" stroke="#ccc" strokeWidth={0.8} rx={3}
                    style={{filter:'drop-shadow(0 1px 2px rgba(0,0,0,0.08))'}}/>
                  {calloutRows.map((s, si) => {
                    const sv = byId[s.id]?.dclb;
                    const sc = sv == null ? '#bbb' : sv < -0.01 ? GRN : sv > 0.01 ? RED : '#888';
                    return (
                      <g key={s.id}>
                        <text x={callBoxX+4} y={callBoxY + 10 + si*13}
                          fontSize={7} fill="#555">{s.lbl}</text>
                        <text x={callBoxX+callBoxW-3} y={callBoxY + 10 + si*13}
                          textAnchor="end" fontSize={7} fontWeight={700} fill={sc}>{fv(sv)}</text>
                      </g>
                    );
                  })}
                </g>
              );
            })()}
          </g>
        );
      })}
    </svg>
  );
}

/* Agrega totales de costos-ajustados para usarlos en el waterfall */
function aggregateCaForWaterfall(caResults) {
  if (!caResults || !caResults.length) return null;
  const ss = (a, b) => (a != null && b != null) ? a + b : (a ?? b);
  const addPeriod = (a, b) => {
    if (!a && !b) return null;
    return {
      real:        ss(a?.real,        b?.real),
      ppto:        ss(a?.ppto,        b?.ppto),
      ppto_aj_tot: ss(a?.ppto_aj_tot, b?.ppto_aj_tot),
      dif:         ss(a?.dif,         b?.dif),
    };
  };
  const merged = { totales: {}, summary: {} };
  for (const ca of caResults) {
    for (const tKey of ['costo_onsite','pre_credito','c1','c2','c3']) {
      const existing = merged.totales[tKey] || {};
      const incoming = ca.totales?.[tKey] || {};
      merged.totales[tKey] = {
        mes: addPeriod(existing.mes, incoming.mes),
        ytd: addPeriod(existing.ytd, incoming.ytd),
      };
    }
    for (const sr of (ca.summary || [])) {
      const existing = merged.summary[sr.key] || {key: sr.key, label: sr.label};
      merged.summary[sr.key] = {
        ...existing,
        mes: addPeriod(existing.mes, sr.mes),
        ytd: addPeriod(existing.ytd, sr.ytd),
      };
    }
  }
  merged.summary = Object.values(merged.summary);
  return merged;
}

/* Rellena campos faltantes del waterfall con datos de costos-ajustados */
function mergeCaIntoExp(expData, caAgg) {
  if (!expData || !caAgg) return expData;
  const smryMap = {};
  for (const s of (caAgg.summary || [])) smryMap[s.key] = s;
  for (const panel of ['mes', 'ytd']) {
    if (!expData.data?.[panel]) { if (!expData.data) expData.data = {}; expData.data[panel] = {waterfall: {}}; }
    if (!expData.data[panel].waterfall) expData.data[panel].waterfall = {};
    const wf  = expData.data[panel].waterfall;
    const tot = caAgg.totales || {};
    const pv  = obj => obj?.[panel];
    const ovr = (key, val) => { if (wf[key] == null && val != null) wf[key] = val; };
    const onsite = pv(tot.costo_onsite);
    ovr('c1_b',     onsite?.ppto);
    ovr('c1_r',     onsite?.real);
    wf['aj_total_ca'] = (onsite?.ppto_aj_tot != null && onsite?.ppto != null)
      ? onsite.ppto_aj_tot - onsite.ppto : null;
    const c1 = pv(tot.c1);
    ovr('c1_abs_b',       c1?.ppto);
    ovr('c1_r_costo',     c1?.real);
    const pre = pv(tot.pre_credito);
    ovr('precredit_b_costo',  pre?.ppto);
    ovr('precredit_r_costo',  pre?.real);
    const c2 = pv(tot.c2);
    ovr('c2_b', c2?.ppto);
    ovr('c2_r', c2?.real);
    const c3 = pv(tot.c3);
    ovr('c3_b', c3?.ppto);
    ovr('c3_r', c3?.real);
    ovr('da_b',            pv(smryMap.da)?.ppto);
    ovr('da_r',            pv(smryMap.da)?.real);
    ovr('subprod_b',       pv(smryMap.credito_subp)?.ppto);
    ovr('subprod_r',       pv(smryMap.credito_subp)?.real);
    ovr('tcrc_b_total',    pv(smryMap.tcrc)?.ppto);
    ovr('tcrc_r_total',    pv(smryMap.tcrc)?.real);
    ovr('comer_b_total',   pv(smryMap.comer)?.ppto);
    ovr('comer_r_total',   pv(smryMap.comer)?.real);
    ovr('otros_fin_r',     pv(smryMap.otros_fin)?.real);
    ovr('dif_cambio_r',    pv(smryMap.dif_cambio)?.real);

  }

}

function CostSummaryTable({wf, cu_r, cu_b, t2}) {
  const n2 = v => v == null ? null : Math.round(v);
  const clb = (kus, ktu) => (kus != null && ktu != null && ktu > 0)
    ? (kus * 100 / (ktu * B_CLB)) : null;
  const fK  = v => v == null ? <span style={{color:'#ccc'}}>—</span>
    : v.toLocaleString('es-CL', {minimumFractionDigits:0, maximumFractionDigits:0});
  const fC  = v => v == null ? <span style={{color:'#ccc'}}>—</span> : v.toFixed(2);
  const fT  = v => v == null ? <span style={{color:'#ccc'}}>—</span>
    : v.toLocaleString('es-CL', {minimumFractionDigits:2, maximumFractionDigits:2});
  const fVar = (r, b) => {
    if (r == null || b == null) return <span style={{color:'#ccc'}}>—</span>;
    const d = r - b; const col = d < -0.5 ? '#059669' : d > 0.5 ? 'var(--red)' : '#888';
    return <span style={{color:col}}>{d >= 0 ? '+' : ''}{d.toLocaleString('es-CL', {minimumFractionDigits:0, maximumFractionDigits:0})}</span>;
  };
  const fVarC = (r, b) => {
    if (r == null || b == null) return <span style={{color:'#ccc'}}>—</span>;
    const d = r - b; const col = d < -0.005 ? '#059669' : d > 0.005 ? 'var(--red)' : '#888';
    return <span style={{color:col}}>{d >= 0 ? '+' : ''}{d.toFixed(2)}</span>;
  };

  const c3Bridge_r = wf.c3_r != null && wf.c2_r != null ? wf.c3_r - wf.c2_r : null;
  const c3Bridge_b = wf.c3_b != null && wf.c2_b != null ? wf.c3_b - wf.c2_b : null;

  const rows = [
    { label:'C3 Total',          r:n2(wf.c3_r),    b:n2(wf.c3_b),    indent:0, bold:true,  bg:'#1A3A4A', fg:'white' },
    { label:'  Otros / Financ.', r:n2(c3Bridge_r), b:n2(c3Bridge_b), indent:1, bold:false, bg:'white',   fg:'#374151' },
    { label:'C2',                r:n2(wf.c2_r),    b:n2(wf.c2_b),    indent:0, bold:true,  bg:'#d4e8ee', fg:'#1A3A4A' },
    { label:'  D&A',             r:n2(wf.da_r),    b:n2(wf.da_b),    indent:1, bold:false, bg:'white',   fg:'#374151' },
    { label:'C1',                r:n2(wf.c1_r_costo), b:n2(wf.c1_abs_b), indent:0, bold:true, bg:'#d4e8ee', fg:'#1A3A4A' },
    { label:'  TC/RC',    r:n2(wf.tcrc_r_total),b:n2(wf.tcrc_b_total),indent:1, bold:false,bg:'white',  fg:'#374151' },
    { label:'  Comercialización',r:n2(wf.comer_r_total),b:n2(wf.comer_b_total),indent:1,bold:false,bg:'white',fg:'#374151'},
    { label:'Pre-credit', r: n2(wf.precredit_r_costo ?? (wf.c1_r_costo != null && wf.subprod_r != null ? wf.c1_r_costo - wf.subprod_r : null)),
                          b: n2(wf.precredit_b_costo ?? (wf.c1_abs_b != null && wf.subprod_b != null ? wf.c1_abs_b - wf.subprod_b : null)),
                          indent:1, bold:false, bg:'white', fg:'#374151' },
    { label:'  Subprod.', r:n2(wf.subprod_r),  b:n2(wf.subprod_b),  indent:2, bold:false, bg:'white',   fg:'#374151' },
    { label:'Costo Onsite',r:n2(wf.c1_r),      b:n2(wf.c1_b),       indent:0, bold:true,  bg:'#d4e8ee', fg:'#1A3A4A' },
  ];

  const thS = {background:'#1A3A4A',color:'white',padding:'5px 8px',fontSize:'.73rem',fontWeight:600,textAlign:'right',whiteSpace:'nowrap'};
  const thL = {...thS, textAlign:'left', minWidth:'160px'};
  const td  = (bg,fg,bold,indent) => ({
    padding:'4px 8px', fontSize:'.79rem', whiteSpace:'nowrap',
    background:bg, color:fg, fontWeight:bold?700:400,
    paddingLeft: indent > 0 ? `${8 + indent*14}px` : '8px',
  });
  const tdR = (bg,fg,bold) => ({padding:'4px 8px',textAlign:'right',fontSize:'.79rem',whiteSpace:'nowrap',background:bg,color:fg,fontWeight:bold?700:400});

  return (
    <div className="tbl-wrap" style={{marginBottom:'24px'}}>
      <table style={{width:'100%', borderCollapse:'collapse'}}>
        <thead>
          <tr>
            <th style={thL} rowSpan={2}>Concepto</th>
            <th colSpan={3} style={{...thS, borderLeft:'2px solid #3a6a7a', textAlign:'center'}}>US$k</th>
            <th colSpan={3} style={{...thS, borderLeft:'2px solid #F5A800', textAlign:'center'}}>c/lb Cu</th>
          </tr>
          <tr>
            <th style={{...thS, borderLeft:'2px solid #3a6a7a'}}>Real</th>
            <th style={thS}>{t2||'Ppto'}</th>
            <th style={thS}>Var.</th>
            <th style={{...thS, borderLeft:'2px solid #F5A800'}}>Real</th>
            <th style={thS}>{t2||'Ppto'}</th>
            <th style={thS}>Var.</th>
          </tr>
        </thead>
        <tbody>
          <tr style={{borderBottom:'1px solid #ddd'}}>
            <td style={{...td('#f3f9fb','#555',false,0), fontStyle:'italic', fontSize:'.75rem'}}>Producción</td>
            <td style={{...tdR('#f3f9fb','#555',false), borderLeft:'2px solid #3a6a7a'}}>{fT(cu_r)}</td>
            <td style={tdR('#f3f9fb','#555',false)}>{fT(cu_b)}</td>
            <td style={tdR('#f3f9fb','#555',false)}>{cu_r != null && cu_b != null ? <span style={{color: cu_r-cu_b < 0 ? 'var(--red)':'#059669'}}>{(cu_r-cu_b >= 0 ? '+':'')+((cu_r-cu_b).toFixed(2))}</span> : <span style={{color:'#ccc'}}>—</span>}</td>
            <td colSpan={3} style={{...tdR('#f3f9fb','#888',false), textAlign:'center', borderLeft:'2px solid #F5A800', fontStyle:'italic', fontSize:'.74rem'}}>ktCuf</td>
          </tr>
          {rows.map((row, i) => {
            const clbR = clb(row.r, cu_r);
            const clbB = clb(row.b, cu_b);
            return (
              <tr key={i} style={{borderTop: row.bold && row.bg !== 'white' ? '2px solid #1A3A4A' : '1px solid #eee'}}>
                <td style={td(row.bg, row.fg, row.bold, row.indent)}>{row.label}</td>
                <td style={{...tdR(row.bg, row.fg, row.bold), borderLeft:'2px solid #3a6a7a'}}>{fK(row.r)}</td>
                <td style={tdR(row.bg, row.fg, row.bold)}>{fK(row.b)}</td>
                <td style={tdR(row.bg, row.fg, row.bold)}>{fVar(row.r, row.b)}</td>
                <td style={{...tdR(row.bg, row.fg, row.bold), borderLeft:'2px solid #F5A800'}}>{fC(clbR)}</td>
                <td style={tdR(row.bg, row.fg, row.bold)}>{fC(clbB)}</td>
                <td style={tdR(row.bg, row.fg, row.bold)}>{fVarC(clbR, clbB)}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

const PARAM_ROWS = [
  { kpi:'Dólar', realField:'dolar_real', budgetField:'dolar_budget' },
  { kpi:'IPC',   realField:'ipc_real',   budgetField:'ipc_budget'   },

function ParamsTab({period}) {
  const {tipo1, a1ini, m1ini, a1fin, m1fin, tipo2, a2ini, m2ini, a2fin, m2fin} = period;
  const [params,    setParams]    = useState(null);
  const [fp,        setFp]        = useState(null);
  const [saving,    setSaving]    = useState(false);
  const [saved,     setSaved]     = useState(false);
  const [fvCompany, setFvCompany] = useState('MLP');

  React.useEffect(() => {
    apiGet('/api/params').then(d => setParams(d)).catch(()=>{});
    apiGet('/api/calculos/formula-params').then(d => setFp(d)).catch(()=>{});
  }, []);

  const cols1 = useMemo(() => buildColumns(a1ini, m1ini, a1fin, m1fin), [a1ini, m1ini, a1fin, m1fin]);
  const cols2 = useMemo(() => buildColumns(a2ini, m2ini, a2fin, m2fin), [a2ini, m2ini, a2fin, m2fin]);

  if (!params) return <div style={{padding:'32px'}} className="hint">Cargando...</div>;

  const getVal = (field, year, month) => {
    const v = params.kpis?.[year]?.[month]?.[field];
    return v == null ? '' : v;
  };

  const setVal = (field, year, month, raw) => {
    const val = raw === '' ? null : parseFloat(raw);
    setParams(p => ({
      ...p,
      kpis: {
        ...p.kpis,
        [year]: {
          ...(p.kpis?.[year] || {}),
          [month]: {
            ...(p.kpis?.[year]?.[month] || {}),
            [field]: isNaN(val) ? null : val,
          }
        }
      }
    }));
    setSaved(false);
  };

  const setExpTc = (company, raw) => {
    const val = raw === '' ? null : parseFloat(raw);
    setParams(p => ({
      ...p,
      exp_tc: { ...p.exp_tc, [company]: isNaN(val) ? null : val }
    }));
    setSaved(false);
  };

  const setFijoVar = (idx, raw) => {
    const val = raw === '' ? null : Math.min(1, Math.max(0, parseFloat(raw) / 100));
    setParams(p => {
      const arr = [...(p.costos_fijo_var?.[fvCompany] || [])];
      arr[idx] = { ...arr[idx], fijo: isNaN(val) ? arr[idx].fijo : val };
      return { ...p, costos_fijo_var: { ...(p.costos_fijo_var || {}), [fvCompany]: arr } };
    });
    setSaved(false);
  };

  const setKpiKey = (key, val) => {
    setFp(f => ({...f, kpi_keys: {...(f?.kpi_keys || {}), [key]: val}}));
    setSaved(false);
  };

  // Paste from Excel: TSV data fills consecutive cells right → down
  function handlePaste(ri, isReal, startCi, e) {
    const text = e.clipboardData.getData('text');
    if (!text.includes('\t') && !text.split('\n').filter(Boolean).length > 1) return;
    e.preventDefault();
    const pasteRows = text.replace(/\r/g, '').trim().split('\n').map(r => r.split('\t'));
    pasteRows.forEach((pasteRow, pr) => {
      const absRow   = 2 * ri + (isReal ? 0 : 1) + pr;
      const targetRi = Math.floor(absRow / 2);
      const targetIsReal = absRow % 2 === 0;
      if (targetRi >= PARAM_ROWS.length) return;
      const { realField, budgetField } = PARAM_ROWS[targetRi];
      const field = targetIsReal ? realField : budgetField;
      const targetCols = targetIsReal ? cols1 : cols2;
      pasteRow.forEach((cell, pc) => {
        const ci = startCi + pc;
        if (ci >= targetCols.length) return;
        const { year, month } = targetCols[ci];
        // Normalize decimal separator from Excel locale variants
        // "1.881,96" → "1881.96" | "881,96" → "881.96" | "881.96" → "881.96"
        const raw = cell.trim();
        const hasDot   = raw.includes('.');
        const hasComma = raw.includes(',');
        const val = (hasDot && hasComma)
          ? raw.replace(/\./g, '').replace(',', '.')   // dot=thousands, comma=decimal
          : hasComma
            ? raw.replace(',', '.')                    // comma=decimal
            : raw;                                     // standard or integer
        setVal(field, year, month, val);
      });
    });
    setSaved(false);
  }

  const handleSave = () => {
    setSaving(true);
    const saves = [apiPost('/api/params', params)];
    if (fp) saves.push(apiPut('/api/calculos/formula-params', fp));
    Promise.all(saves)
      .then(() => { setSaved(true); })
      .catch(() => alert('Error al guardar'))
      .finally(() => setSaving(false));
  };

  return (
    <div className="main">
      <div className="card">
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'20px'}}>
        <div className="card-title" style={{margin:0}}>Parámetros Económicos</div>
        <button onClick={handleSave} disabled={saving} className="btn btn-primary" style={{fontSize:'.88rem'}}>
          {saving ? 'Guardando...' : saved ? '✓ Guardado' : 'Guardar'}
        </button>
      </div>

      <div className="tbl-wrap" style={{marginBottom:'28px'}}>
        <table>
          <thead>
            <tr>
              <th rowSpan={2} style={{verticalAlign:'middle', minWidth:'70px'}}>KPI</th>
              <th className="tbl-th-c1" style={{textAlign:'center', borderLeft:'2px solid #4EC3C3'}}>{tipo1||'Comp 1'}</th>
              {cols1.map((c,i)=><th key={i} className="tbl-th-c1" style={{textAlign:'center'}}>{c.label}</th>)}
            </tr>
            <tr>
              <th className="tbl-th-c2" style={{textAlign:'center', borderLeft:'2px solid #F5A800'}}>{tipo2||'Comp 2'}</th>
              {cols2.map((c,i)=><th key={i} className="tbl-th-c2" style={{textAlign:'center'}}>{c.label}</th>)}
            </tr>
          </thead>
          <tbody>
            {PARAM_ROWS.map(({kpi, realField, budgetField}, ri) => (
              <React.Fragment key={kpi}>
                <tr style={{background: ri%2===0?'white':'#f8fafb'}}>
                  <td rowSpan={2} className="params-td" style={{fontWeight:700, verticalAlign:'middle', borderRight:'2px solid #e0e0e0'}}>{kpi}</td>
                  <td className="viz-tag1" style={{fontWeight:600, fontSize:'.78rem'}}>{tipo1||'Comp 1'}</td>
                  {cols1.map((c,i)=>(
                    <td key={i} className="params-td">
                      <input type="number" className="params-inp" value={getVal(realField, c.year, c.month)}
                        onChange={e=>setVal(realField, c.year, c.month, e.target.value)}

/* ─── Explicaciones: module-level helpers (stable references across renders) ─── */
const EXP_TBL = {width:'100%', borderCollapse:'collapse', fontSize:'.8rem', tableLayout:'fixed'};
const EXP_CKpi  = {padding:'4px 8px', fontWeight:500, fontSize:'.8rem'};
const EXP_CUnit = {padding:'3px 6px', color:'#888', textAlign:'center', fontSize:'.73rem', whiteSpace:'nowrap'};
const EXP_CVal  = {padding:'3px 8px', textAlign:'right', fontSize:'.79rem', whiteSpace:'nowrap'};
const EXP_CEf   = {padding:'3px 8px', textAlign:'right', fontSize:'.79rem', whiteSpace:'nowrap', width:'90px'};

function expFmtN(v) {
  if (v == null) return <span style={{color:'#bbb'}}>—</span>;
  return Number(v).toLocaleString('es-CL', {maximumFractionDigits:3});
}

function ExpTblHead({title}) {
  const thSt = {padding:'5px 8px', fontSize:'.72rem', color:'white', background:'#2d5a6e', fontWeight:700, whiteSpace:'nowrap'};
  return (
    <thead>
      <tr>
        <th style={{...thSt, textAlign:'left', minWidth:'140px', fontSize:'.8rem', background:'#1A3A4A', padding:'7px 10px', letterSpacing:'.03em'}}>{title}</th>
        <th style={{...thSt, textAlign:'center', width:'64px'}}>Ud.</th>
        <th style={{...thSt, textAlign:'right', width:'88px'}}>Real</th>
        <th style={{...thSt, textAlign:'right', width:'88px'}}>Ppto</th>
        <th style={{...thSt, textAlign:'right', width:'90px'}}>Efecto</th>
      </tr>
    </thead>
  );
}

function ExpSecHd({label, total, cols=5}) {
  return (
    <tr>
      <td colSpan={cols} style={{
        background:'#1A3A4A', color:'white', fontWeight:700,
        padding:'5px 8px 5px 10px', fontSize:'.72rem',
        letterSpacing:'.05em', textTransform:'uppercase',
      }}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
          <span>{label}</span>
          {total != null && <span style={{fontWeight:700, fontSize:'.79rem', textTransform:'none', letterSpacing:0}}>{total}</span>}
        </div>
      </td>
