                {pd.ajuste_monetario.map((r,i)=>(
                  <ExpRow key={i} alt={i%2!==0} label={r.label} unit={r.unit} real={r.real} ppto={r.ppto} colDec={colDec}
                    efNode={wrap(fC(toC(r.efecto_kus)), {label:r.label, unit:r.unit, real:r.real, ppto:r.ppto, kus:r.efecto_kus, clb:toC(r.efecto_kus), calc:r.calc})}/>
                ))}
                <ExpSecHd label="Precio Insumos" total={fC(piTot)} tone={toneOf(piTot)}/>
                {pd.precio_insumos.map((r,i)=>(
                  <ExpRow key={i} alt={i%2!==0} label={r.label} unit={r.unit} real={r.real} ppto={r.ppto} colDec={colDec}
                    efNode={wrap(fC(toC(r.efecto_kus)), {label:r.label, unit:r.unit, real:r.real, ppto:r.ppto, kus:r.efecto_kus, clb:toC(r.efecto_kus), calc:r.calc})}/>
                ))}
                <ExpSecHd label="Rendimiento" total={fC(rendTot)} tone={toneOf(rendTot)}/>
                {pd.rendimiento.map((r,i)=>(
                  <ExpRow key={i} alt={i%2!==0} label={r.label} unit={r.unit} real={r.real} ppto={r.ppto} colDec={colDec}
                    efNode={wrap(fC(toC(r.efecto_kus)), {label:r.label, unit:r.unit, real:r.real, ppto:r.ppto, kus:r.efecto_kus, clb:toC(r.efecto_kus), calc:r.calc})}/>
                ))}
              </tbody>
            </table>
            <table style={EXP_TBL}>
              <ExpTblHead title="Actividad" colDec={colDec} setColDec={setColDec}/>
              <tbody>
                <ExpSecHd label="Producción" total={fK(prodTot)} tone={toneOf(prodTot)}/>
                {pd.produccion.filter(r => r.real!=null || r.ppto!=null || r.efecto_ktcuf!=null || r.efecto_kus!=null).map((r,i)=>(
                  <ExpRow key={i} alt={i%2!==0} label={r.label} unit={r.unit} real={r.real} ppto={r.ppto} colDec={colDec}
                    efNode={r.efecto_kus!=null
                      ? wrap(fC(toC(r.efecto_kus)), {label:r.label, unit:r.unit, real:r.real, ppto:r.ppto, kus:r.efecto_kus, clb:toC(r.efecto_kus)})
                      : wrap(fK(r.efecto_ktcuf),    {label:r.label, unit:r.unit, real:r.real, ppto:r.ppto, ktcuf:r.efecto_ktcuf})}/>
                ))}
                <ExpSecHd label="Movimiento Mina" total={fC(toC(pd.mov_mina.efecto_kus))} tone={toneOf(toC(pd.mov_mina.efecto_kus))}/>
                <ExpRow label="Movimiento total Mina" unit="kt" real={pd.mov_mina.real} ppto={pd.mov_mina.ppto} colDec={colDec}
                  efNode={wrap(fC(toC(pd.mov_mina.efecto_kus)), {label:'Movimiento total Mina', unit:'kt', real:pd.mov_mina.real, ppto:pd.mov_mina.ppto, kus:pd.mov_mina.efecto_kus, clb:toC(pd.mov_mina.efecto_kus)})}/>
                <ExpSecHd label="Desarrollo Mina" total={fC(toC(pd.desarrollo_mina.efecto_kus))} tone={toneOf(toC(pd.desarrollo_mina.efecto_kus))}/>
                <ExpRow label="Tonelaje" unit="kt" real={pd.desarrollo_mina.tonelaje_real} ppto={pd.desarrollo_mina.tonelaje_ppto} colDec={colDec}
                  efNode={wrap(fC(toC(pd.desarrollo_mina.tonelaje_efecto_kus)), {label:'Tonelaje Desarrollo Mina', unit:'kt', real:pd.desarrollo_mina.tonelaje_real, ppto:pd.desarrollo_mina.tonelaje_ppto, kus:pd.desarrollo_mina.tonelaje_efecto_kus, clb:toC(pd.desarrollo_mina.tonelaje_efecto_kus)})}/>
                <ExpRow label="Costo unitario" unit="US$/t" real={pd.desarrollo_mina.cu_real} ppto={pd.desarrollo_mina.cu_ppto} colDec={colDec}
                  efNode={wrap(fC(toC(pd.desarrollo_mina.cu_efecto_kus)), {label:'Costo Unitario Desarrollo Mina', unit:'US$/t', real:pd.desarrollo_mina.cu_real, ppto:pd.desarrollo_mina.cu_ppto, kus:pd.desarrollo_mina.cu_efecto_kus, clb:toC(pd.desarrollo_mina.cu_efecto_kus)})}/>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    );
  }

  const pd = data?._todas ? null : data?.data?.[panel];

  return (
    <>
      <EfPopover pop={efPop} onClose={() => setEfPop(null)}/>
      {error && <p className="err">{error}</p>}

      {/* Skeleton loading */}
      {loading && (
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'16px'}}>
          {[0,1].map(i => (
            <div key={i} className="card" style={{padding:'18px'}}>
              <div className="skeleton-line" style={{height:18, width:'40%', marginBottom:14}}/>
              {[...Array(10)].map((_,j) => (
                <div key={j} style={{display:'flex', gap:8, marginBottom:8, alignItems:'center'}}>
                  <div className="skeleton-line" style={{height:12, flex:2}}/>
                  <div className="skeleton-line" style={{height:12, width:40}}/>
                  <div className="skeleton-line" style={{height:12, width:56}}/>
                  <div className="skeleton-line" style={{height:12, width:56}}/>
                  <div className="skeleton-line" style={{height:12, width:50}}/>
                </div>
              ))}
            </div>
          ))}
        </div>
      )}

      {!loading && (data?._todas
        ? COMPANIES.map(co => renderPanel(data.byCompany[co]?.data?.[panel], EXP_CO_LABELS[co] || co))
        : pd && renderPanel(pd, null)
      )}
      {!loading && (data?._todas ? true : !!pd) && (
        <div style={{padding:'11px 16px', background:'var(--teal-pale)', border:'1px dashed var(--teal-lt)',
          borderRadius:'var(--radius-sm)', display:'flex', alignItems:'center', gap:10, fontSize:'.78rem', color:'var(--teal)'}}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <span><b>Tips:</b> Clic en el valor de <b>Efecto</b> para ver cómo se calcula. Clic en una fila con drill-down (ej. <b>Explosivos</b>) para ver drivers, evolución y narrativa.</span>
        </div>
      )}
    </>
  );
}

/* ─── Tab: Costos Ajustados ─── */
function CostosAjustadosTab({period, company, setCompany}) {
  const {tipo1, a1fin, m1fin, tipo2} = period;
  const effectiveCompany = COMPANIES.includes(company) ? company : COMPANIES[0];
  const [data, setData]       = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError]           = useState('');
  const [expandedGroups, setExpandedGroups] = useState(null);

  function toggleGroup(key) {
    setExpandedGroups(p => { const n = new Set(p || []); n.has(key) ? n.delete(key) : n.add(key); return n; });
  }

  useEffect(() => {
    if (!a1fin || !m1fin) return;
    setLoading(true); setError(''); setData(null);
    apiGet(`/api/costos-ajustados/${effectiveCompany}?año=${a1fin}&mes=${m1fin}`)
      .then(d => setData(d))
      .catch(e => setError(e.message || 'Error'))
      .finally(() => setLoading(false));
  }, [effectiveCompany, a1fin, m1fin]);

  // Auto-expand groups that have at least one mapped subarea; collapse all-NA groups
  useEffect(() => {
    if (!data) return;
    setExpandedGroups(new Set(
      (data.grupos || [])
        .filter(grp => (grp.subareas || []).some(sa => sa.mapped))
        .map(grp => grp.key)
    ));
  }, [data]);

  const fmtV = v => {
    if (v == null) return <span style={{color:'#ccc'}}>—</span>;
    const n = Number(v) / 1000;
    if (isNaN(n)) return '—';
    return n.toLocaleString('es-CL', {minimumFractionDigits:1, maximumFractionDigits:1});
  };
  const fmtD = v => {
    if (v == null) return <span style={{color:'#ccc'}}>—</span>;
    const n = Number(v) / 1000;
    if (isNaN(n)) return '—';
    const color = n < 0 ? '#059669' : n > 0 ? '#dc2626' : '#555';
    return <span style={{color, fontWeight:'700'}}>{n.toLocaleString('es-CL', {minimumFractionDigits:1, maximumFractionDigits:1})}</span>;
  };

  const TH  = {background:'var(--navy)', color:'white', padding:'6px 8px', textAlign:'right', fontSize:'.75rem', whiteSpace:'nowrap', fontWeight:'600'};
  const TD  = {padding:'4px 8px', textAlign:'right', fontSize:'.8rem', whiteSpace:'nowrap', borderLeft:'1px solid #f0f0f0'};
  const SEP = {borderRight:'3px solid #9ca3af'};

  function sumCA(sas) {
    const mapped = (sas || []).filter(sa => sa.mapped);
    if (!mapped.length) return null;
    function ss(vals) { const v = vals.filter(x => x != null); return v.length ? v.reduce((a,b)=>a+b,0) : null; }
    const KEYS = ['real','ppto','ppto_aj_tot','dif'];
    const mes = {}; const ytd = {};
    for (const k of KEYS) {
      mes[k] = ss(mapped.map(sa => sa.mes?.[k]));
      ytd[k] = ss(mapped.map(sa => sa.ytd?.[k]));
    }
    return {mes, ytd};
  }

  function Cells({m, y, bold=false, bg, fg}) {
    const s = bold ? {...TD, fontWeight:'700'} : TD;
    const bs = bg ? {...s, background:bg, ...(fg ? {color:fg} : {})} : s;
    return <>
      <td style={bs}>{fmtV(m?.real)}</td>
      <td style={bs}>{fmtV(m?.ppto)}</td>
      <td style={{...bs, fontWeight: bold ? '800' : '600'}}>{fmtV(m?.ppto_aj_tot)}</td>
      <td style={{...bs, ...SEP}}>{fmtD(m?.dif)}</td>
      <td style={bs}>{fmtV(y?.real)}</td>
      <td style={bs}>{fmtV(y?.ppto)}</td>
      <td style={{...bs, fontWeight: bold ? '800' : '600'}}>{fmtV(y?.ppto_aj_tot)}</td>
      <td style={bs}>{fmtD(y?.dif)}</td>
    </>;
  }

  return (
    <div className="main">
      <div className="card">
        <div className="card-title">Costos Ajustados por FX / IPC</div>
        <p style={{fontSize:'.78rem', color:'#888', marginBottom:'12px'}}>
          <strong>{MESES[data?.mes ?? m1fin]} {a1fin}</strong> · adj_factor = (FX_r/FX_b)×(IPC_r/IPC_b) · {tipo2}AjTot = {tipo2}×%F×adj + {tipo2}×%V · Dif = {tipo2}AjTot − {tipo2} · <em>US$m</em>
        </p>

        {loading && <p style={{color:'#aaa'}}><span className="spin"/>Calculando…</p>}
        {error   && <p className="err">{error}</p>}

        {!loading && !error && data && (
          <div className="tbl-wrap">
            <table style={{fontSize:'.8rem', borderCollapse:'collapse'}}>
              <thead>
                <tr>
                  <th style={{...TH, textAlign:'left', position:'sticky', left:0, zIndex:2, minWidth:'230px', background:'var(--navy)', borderRight:'1px solid #2a4a5a'}} rowSpan={2}>Sub-área</th>
                  <th style={{...TH, textAlign:'center', background:'#1A5F6E'}} colSpan={4}>Mes {MESES[data.mes ?? m1fin]} {a1fin}</th>
                  <th style={{...TH, textAlign:'center', background:'#1A4E5A'}} colSpan={4}>YTD {a1fin}</th>
                </tr>
                <tr>
                  {[tipo1, tipo2, `${tipo2} Aj Tot`,'Dif.',tipo1, tipo2, `${tipo2} Aj Tot`,'Dif.'].map((h,i)=>(
                    <th key={i} style={{...TH, background: i<4 ? '#1A5F6E' : '#1A4E5A', ...(i===3?SEP:{})}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {(data.grupos || []).map(grp => {
                  const sas = grp.subareas || [];
                  const isLeaf   = sas.length <= 1;
                  const isExp    = expandedGroups ? expandedGroups.has(grp.key) : sas.some(sa => sa.mapped);
                  // Usa el total pre-calculado por el backend (puede ser mapeo directo o suma de subareas)
                  const grpTotal = grp.total ?? (isLeaf && sas[0]?.mapped ? {mes: sas[0].mes, ytd: sas[0].ytd} : null);
                  return (
                  <React.Fragment key={grp.key}>
                    <tr>
                      <td style={{background:'#1A3A4A', color:'white', fontWeight:'700', padding:'6px 10px', position:'sticky', left:0, zIndex:1, borderRight:'1px solid #2a4a5a', fontSize:'.82rem'}}>
                        {!isLeaf && (
                          <button onClick={() => toggleGroup(grp.key)} style={{
                            marginRight:'6px', background:'none', border:'1px solid rgba(255,255,255,0.4)',
                            borderRadius:'3px', color:'white', cursor:'pointer', fontSize:'.7rem',
                            padding:'0 4px', lineHeight:'1.4', verticalAlign:'middle',
                          }}>{isExp ? '−' : '+'}</button>
                        )}
                        {grp.label}
                      </td>
                      <Cells m={grpTotal?.mes} y={grpTotal?.ytd} bold={true} bg='#1A3A4A' fg='white'/>
                    </tr>
                    {!isLeaf && isExp && sas.map(sa => {
                      const dim = !sa.mapped;
                      const lblSt = {padding:'4px 10px 4px 24px', fontSize:'.8rem', position:'sticky', left:0, zIndex:1,
                        background:'white', borderRight:'1px solid #eee',
                        color: dim ? '#bbb' : '#374151', fontStyle: dim ? 'italic' : 'normal', whiteSpace:'nowrap'};
                      const tdSt = dim ? {...TD, color:'#ccc'} : TD;
                      return (
                        <tr key={sa.key}>
                          <td style={lblSt}>{sa.label}</td>
                          <td style={tdSt}>{fmtV(sa.mes?.real)}</td>
                          <td style={tdSt}>{fmtV(sa.mes?.ppto)}</td>
                          <td style={{...tdSt, fontWeight:'600'}}>{fmtV(sa.mes?.ppto_aj_tot)}</td>
                          <td style={{...tdSt, ...SEP}}>{fmtD(sa.mes?.dif)}</td>
                          <td style={tdSt}>{fmtV(sa.ytd?.real)}</td>
                          <td style={tdSt}>{fmtV(sa.ytd?.ppto)}</td>
                          <td style={{...tdSt, fontWeight:'600'}}>{fmtV(sa.ytd?.ppto_aj_tot)}</td>
                          <td style={tdSt}>{fmtD(sa.ytd?.dif)}</td>
                        </tr>
                      );
                    })}
                  </React.Fragment>
                  );
                })}

                {/* Costo On Site */}
                <tr style={{borderTop:'2px solid #e5e7eb'}}>
                  <td style={{padding:'6px 10px', fontWeight:'700', position:'sticky', left:0, zIndex:1, background:'#dbeafe', borderRight:'1px solid #eee', fontSize:'.82rem'}}>
                    Costo On Site
                  </td>
                  <Cells m={data.totales?.costo_onsite?.mes} y={data.totales?.costo_onsite?.ytd} bold={true} bg='#dbeafe'/>
                </tr>

                {/* Summary rows + subtotales intercalados */}
                {(() => {
                  const sm = {};
                  (data.summary || []).forEach(sr => { sm[sr.key] = sr; });
                  const tot = data.totales || {};
                  const SUBrow = (key, label, bg) => {
                    const m = tot[key]?.mes, y = tot[key]?.ytd;
                    return (
                      <tr key={key} style={{borderTop:'1px solid #e5e7eb'}}>
                        <td style={{padding:'6px 10px', fontWeight:'700', position:'sticky', left:0, zIndex:1, background:bg, borderRight:'1px solid #eee', fontSize:'.82rem'}}>{label}</td>
                        <Cells m={m} y={y} bold={true} bg={bg}/>
                      </tr>
                    );
                  };
                  const SMrow = (key) => {
                    const sr = sm[key];
                    if (!sr) return null;
                    const dim = !sr.mapped;
                    const lblSt = {padding:'4px 10px', fontSize:'.8rem', position:'sticky', left:0, zIndex:1,
                      background:'#fffbf0', borderRight:'1px solid #eee',
                      color: dim ? '#bbb' : '#374151', fontStyle: dim ? 'italic' : 'normal', whiteSpace:'nowrap'};
                    const tdSt = {...TD, background:'#fffbf0', ...(dim ? {color:'#ccc'} : {})};
                    return (
                      <tr key={key}>
                        <td style={lblSt}>{sr.label}</td>
                        <td style={tdSt}>{fmtV(sr.mes?.real)}</td>
                        <td style={tdSt}>{fmtV(sr.mes?.ppto)}</td>
                        <td style={{...tdSt, fontWeight:'600'}}>{fmtV(sr.mes?.ppto_aj_tot)}</td>
                        <td style={{...tdSt, ...SEP}}>{fmtD(sr.mes?.dif)}</td>
                        <td style={tdSt}>{fmtV(sr.ytd?.real)}</td>
                        <td style={tdSt}>{fmtV(sr.ytd?.ppto)}</td>
                        <td style={{...tdSt, fontWeight:'600'}}>{fmtV(sr.ytd?.ppto_aj_tot)}</td>
                        <td style={tdSt}>{fmtD(sr.ytd?.dif)}</td>
                      </tr>
                    );
                  };
                  return [
                    <tr key="otros_hdr">
                      <td colSpan={9} style={{background:'#f3f4f6', padding:'4px 10px', fontWeight:'600', fontSize:'.72rem', color:'#6b7280', borderTop:'2px solid #e5e7eb', letterSpacing:'.04em', textTransform:'uppercase'}}>
                        Otros conceptos
                      </td>
                    </tr>,
                    SMrow('tcrc'),
                    SMrow('comer'),
                    SUBrow('pre_credito', 'Costo Pre-crédito', '#f8fafc'),
                    SMrow('credito_subp'),
                    SUBrow('c1', 'Costo C1', '#f0f9f9'),
                    SMrow('da'),
                    SUBrow('c2', 'Costo C2', '#ecfdf5'),
                    SMrow('otros_fin'),
                    SMrow('dif_cambio'),
                    SMrow('donaciones'),
                    SMrow('gasto_expl'),
                    SMrow('ing_gasto_fin'),
                    SMrow('ing_no_op'),
                    SMrow('otros_egr_op'),
                    SUBrow('c3', 'Costo C3', '#d1fae5'),
                  ].filter(Boolean);
                })()}
              </tbody>
            </table>
          </div>
        )}

        {!loading && !error && !data && (
          <p style={{color:'#aaa', fontSize:'.9rem'}}>Selecciona período para calcular.</p>
        )}
      </div>
    </div>
  );
}

/* ─── Tab: Costos Ajustados Mes (CM) ─── */
function CostosAjMesTab({period, company, setCompany}) {
  const {a1fin, m1fin} = period;
  const effectiveCompany = COMPANIES.includes(company) ? company : COMPANIES[0];
  const [data,     setData]     = useState(null);
  const [loading,  setLoading]  = useState(false);
  const [error,    setError]    = useState('');
  const [showSec,  setShowSec]  = useState({ppto:true, tc:true, ipc:false, cpi:false});
  const [showSub,  setShowSub]  = useState(true);
  const [expandedGroups, setExpandedGroups] = useState(null);
  const scrollRef = useRef(null);

  function toggleGroup(key) {
    setExpandedGroups(p => { const n = new Set(p || []); n.has(key) ? n.delete(key) : n.add(key); return n; });
  }

  useEffect(() => {
    if (!a1fin || !m1fin) return;
    setLoading(true); setError(''); setData(null);
    apiGet(`/api/costos-ajustados/${effectiveCompany}/monthly?año=${a1fin}&mes_cierre=${m1fin}`)
      .then(d => setData(d))
      .catch(e => setError(e.message || 'Error'))
      .finally(() => setLoading(false));
  }, [effectiveCompany, a1fin, m1fin]);

  useEffect(() => {
    if (!data) return;
    setExpandedGroups(new Set(
      (data.grupos || [])
        .filter(grp => (grp.subareas || []).some(sa => sa.mapped))
        .map(grp => grp.key)
    ));
  }, [data]);

  const MO_S = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const FS   = '.68rem';

  const fmtV = v => {
    if (v == null) return <span style={{color:'#ccc'}}>—</span>;
    const n = Number(v) / 1000;
    return isNaN(n) ? '—' : n.toLocaleString('es-CL', {minimumFractionDigits:2, maximumFractionDigits:2});
  };
  const fmtE = v => {
    if (v == null) return <span style={{color:'#ccc'}}>—</span>;
    const n = Number(v) / 1000;
    if (isNaN(n)) return '—';
    const c = n < 0 ? '#059669' : n > 0 ? '#dc2626' : '#555';
    return <span style={{color:c, fontWeight:'700'}}>{n.toLocaleString('es-CL', {minimumFractionDigits:2, maximumFractionDigits:2})}</span>;
  };
  const fmtPct = v => v == null ? '' : `${Math.round((v || 0) * 100)}%`;

  const TDB = {padding:'2px 4px', textAlign:'right', whiteSpace:'nowrap', fontSize:FS, borderLeft:'1px solid #f0f0f0'};
  const THB = {padding:'3px 5px', textAlign:'right', whiteSpace:'nowrap', fontWeight:'600', fontSize:FS, color:'white'};
  const BDR = {borderRight:'2px solid #9ca3af'};

  const C_PPTO = '#1A3A4A'; const C_TC = '#1A5F6E'; const C_IPC = '#3d5a80'; const C_CPI = '#6b4c99';

  // Dynamic column count: 2(%F/%V) + visible sections
  const dataCols = 2 + (showSec.ppto?14:0) + (showSec.tc?16:0) + (showSec.ipc?16:0) + (showSec.cpi?16:0);

  function toggleSec(k) { setShowSec(p => ({...p, [k]: !p[k]})); }

  // Scroll the table wrapper to a named section anchor
  function scrollToSec(id) {
    const el = document.getElementById(id);
    if (el && scrollRef.current) {
      scrollRef.current.scrollLeft = el.offsetLeft - 210;
    }
  }

  function RowData({row, fijo, bold=false, bg}) {
    const isDark = bg === '#1A3A4A';
    const darkTxt = isDark ? {color:'white'} : {};
    const lightTxt = isDark ? {color:'#1A3A4A'} : {};
    const bs = bold
      ? {...TDB, fontWeight:'700', background:bg, ...darkTxt}
      : (bg ? {...TDB, background:bg, ...darkTxt} : TDB);
    const mc1 = m1fin - 1;
    if (!row || !row.mapped) {
      const span = dataCols - 2;
      return <>
        <td style={{...TDB, background:'#f9fafb'}}></td>
        <td style={{...TDB, background:'#f9fafb', ...BDR}}></td>
        {span > 0 && <td colSpan={span} style={{...TDB, color:'#ccc', textAlign:'center', fontStyle:'italic'}}>—</td>}
      </>;
    }
    const p   = row.ppto   || Array(12).fill(null);
    const atc = row.aj_tc  || Array(12).fill(null);
    const ai  = row.aj_ipc || Array(12).fill(null);
    const ac  = row.aj_cpi || Array(12).fill(null);
    const lastVisible = showSec.cpi ? 'cpi' : showSec.ipc ? 'ipc' : showSec.tc ? 'tc' : 'ppto';

    return <>
      <td style={{...bs, textAlign:'center', background:(bg||'#f9fafb'), ...lightTxt}}>{fmtPct(fijo)}</td>
      <td style={{...bs, textAlign:'center', background:(bg||'#f9fafb'), ...lightTxt, ...(lastVisible==='ppto'&&!showSec.ppto?BDR:{borderRight:'1px solid #ddd'})}}>{fmtPct(fijo == null ? null : 1 - fijo)}</td>

      {showSec.ppto && <>
        {p.map((v,i) => <td key={`p${i}`} style={{...bs, ...(i===mc1?{background:'#d4e8ee',...lightTxt}:{})}}>{fmtV(v)}</td>)}
        <td style={{...bs, background:'#c8e0e8', fontWeight:'700', ...lightTxt}}>{fmtV(row.ppto_mes)}</td>
        <td style={{...bs, background:'#c8e0e8', fontWeight:'700', ...lightTxt, ...(lastVisible==='ppto'?BDR:{})}}>{fmtV(row.ppto_acum)}</td>
      </>}

      {showSec.tc && <>
        {atc.map((v,i) => <td key={`tc${i}`} style={{...bs, ...(i===mc1?{background:'#d4ede8',...lightTxt}:{})}}>{fmtV(v)}</td>)}
        <td style={{...bs, background:'#b8dfd8', fontWeight:'700', ...lightTxt}}>{fmtV(row.aj_tc_mes)}</td>
        <td style={{...bs, background:'#b8dfd8', fontWeight:'700', ...lightTxt}}>{fmtV(row.aj_tc_acum)}</td>
        <td style={bs}>{fmtE(row.ef_tc_mes)}</td>
        <td style={{...bs, ...(lastVisible==='tc'?BDR:{})}}>{fmtE(row.ef_tc_acum)}</td>
      </>}

      {showSec.ipc && <>
        {ai.map((v,i) => <td key={`ipc${i}`} style={{...bs, ...(i===mc1?{background:'#dce8f5',...lightTxt}:{})}}>{fmtV(v)}</td>)}
        <td style={{...bs, background:'#c8daf0', fontWeight:'700', ...lightTxt}}>{fmtV(row.aj_ipc_mes)}</td>
        <td style={{...bs, background:'#c8daf0', fontWeight:'700', ...lightTxt}}>{fmtV(row.aj_ipc_acum)}</td>
        <td style={bs}>{fmtE(row.ef_ipc_mes)}</td>
        <td style={{...bs, ...(lastVisible==='ipc'?BDR:{})}}>{fmtE(row.ef_ipc_acum)}</td>
      </>}

      {showSec.cpi && <>
        {ac.map((v,i) => <td key={`cpi${i}`} style={{...bs, ...(i===mc1?{background:'#ece5f8',...lightTxt}:{})}}>{fmtV(v)}</td>)}
        <td style={{...bs, background:'#ddd0f0', fontWeight:'700', ...lightTxt}}>{fmtV(row.aj_cpi_mes)}</td>
        <td style={{...bs, background:'#ddd0f0', fontWeight:'700', ...lightTxt}}>{fmtV(row.aj_cpi_acum)}</td>
        <td style={bs}>{fmtE(row.ef_cpi_mes)}</td>
        <td style={{...bs, ...BDR}}>{fmtE(row.ef_cpi_acum)}</td>
      </>}
    </>;
  }

  const SECS = [
    {k:'ppto', label:'PPTO',    color:C_PPTO},
    {k:'tc',   label:'Aj TC',   color:C_TC},
    {k:'ipc',  label:'Aj IPC',  color:C_IPC},
    {k:'cpi',  label:'Aj CPI',  color:C_CPI},
  ];

  return (
    <div className="main">
      <div className="card" style={{overflow:'hidden'}}>
        {/* Header row */}
        <div style={{display:'flex', alignItems:'center', gap:'12px', marginBottom:'10px', flexWrap:'wrap'}}>
          <div className="card-title" style={{margin:0}}>Costos Ajustados Mes (CM)</div>
          <CtrlBar companies={COMPANIES} company={effectiveCompany} setCompany={setCompany}/>
          {/* Section toggles */}
          <div style={{display:'flex', gap:'5px', marginLeft:'auto', flexWrap:'wrap', alignItems:'center'}}>
            <button onClick={()=>setShowSub(p=>!p)} style={{
              padding:'4px 11px', border:'2px solid', borderRadius:'5px', cursor:'pointer',
              fontSize:'.78rem', fontWeight:'600', transition:'all .15s',
              background: showSub ? '#f0fdf4' : '#f3f4f6',
              borderColor: showSub ? '#059669' : '#d1d5db',
              color: showSub ? '#059669' : '#9ca3af',
            }}>{showSub ? '▾ Sub-áreas' : '▸ Sub-áreas'}</button>
            <span style={{width:'1px', height:'20px', background:'#e5e7eb', margin:'0 2px'}}></span>
            <span style={{fontSize:'.72rem', color:'#888', alignSelf:'center', marginRight:'2px'}}>Secciones:</span>
            {SECS.map(({k, label, color}) => (
              <button key={k} onClick={()=>toggleSec(k)} style={{
                padding:'4px 11px', border:'none', borderRadius:'5px', cursor:'pointer',
                fontSize:'.78rem', fontWeight:'600',
                background: showSec[k] ? color : '#e5e7eb',
                color: showSec[k] ? 'white' : '#6b7280',
                transition:'all .15s',
              }}>{label}</button>
            ))}
          </div>
        </div>

        <p style={{fontSize:'.72rem', color:'#888', marginBottom:'8px'}}>
          PPTO {a1fin} ajustado · mes cierre: <strong>{MESES[m1fin]}</strong> · <em>US$m</em> ·
          <span style={{marginLeft:'8px', color:'#d4e8ee', background:'#1A3A4A', padding:'1px 6px', borderRadius:'3px', fontSize:'.68rem'}}>
            col {MO_S[m1fin-1]} resaltada
          </span>
        </p>

        {loading && <p style={{color:'#aaa'}}><span className="spin"/>Calculando…</p>}
        {error   && <p className="err">{error}</p>}

        {!loading && !error && data && (() => {
          const LBL = {padding:'3px 8px', fontWeight:'600', position:'sticky', left:0, zIndex:1,
                       background:'white', borderRight:'1px solid #eee', whiteSpace:'nowrap', fontSize:FS};
          const GRP = {padding:'4px 8px', fontWeight:'700', position:'sticky', left:0, zIndex:1,
                       color:'white', background:C_PPTO, borderRight:'1px solid #2a4a5a', whiteSpace:'nowrap', fontSize:FS};
          const TOT = {padding:'4px 8px', fontWeight:'700', position:'sticky', left:0, zIndex:1,
                       borderRight:'1px solid #eee', whiteSpace:'nowrap', fontSize:FS};
          const TH_STICKY = {position:'sticky', top:0, zIndex:2};

          // Frontend sum: adds monthly arrays element-wise from mapped rows
          function sumMR(rows) {
            const mapped = (rows||[]).filter(r => r && r.mapped);
            if (!mapped.length) return null;
            const ARR = ['ppto','aj_tc','aj_ipc','aj_cpi','ef_tc','ef_ipc','ef_cpi'];
            const SC  = ['ppto_mes','ppto_acum','aj_tc_mes','aj_tc_acum','aj_ipc_mes','aj_ipc_acum',
                         'aj_cpi_mes','aj_cpi_acum','ef_tc_mes','ef_tc_acum','ef_ipc_mes','ef_ipc_acum',
                         'ef_cpi_mes','ef_cpi_acum'];
            const res = {mapped: true};
            for (const k of ARR) {
              res[k] = Array.from({length:12}, (_, i) => {
                const vals = mapped.map(r => (r[k]||[])[i]).filter(v => v != null);
                return vals.length ? vals.reduce((a,b) => a+b, 0) : null;
              });
            }
            for (const k of SC) {
              const vals = mapped.map(r => r[k]).filter(v => v != null);
              res[k] = vals.length ? vals.reduce((a,b) => a+b, 0) : null;
            }
            return res;
          }

          // Pre-compute all group totals and section totals client-side
          // Usa total del backend si existe (puede ser mapeo directo); fallback a suma cliente
          const grpTotals = (data.grupos||[]).map(grp =>
            grp.total?.mapped ? grp.total : sumMR(grp.subareas||[]));
          const onsiteTotal = sumMR(grpTotals);
          const sumMap = {};
          (data.summary||[]).forEach(sr => { if (sr.mapped) sumMap[sr.key] = sr; });
          const preCredito = sumMR([onsiteTotal, sumMap['tcrc'], sumMap['comer']].filter(Boolean));
          const c1Total    = sumMR([preCredito,  sumMap['credito_subp']].filter(Boolean));
          const c2Total    = sumMR([c1Total,      sumMap['da']].filter(Boolean));
          const c3Total    = sumMR([c2Total, sumMap['otros_fin'], sumMap['dif_cambio'],
            sumMap['donaciones'], sumMap['gasto_expl'], sumMap['ing_gasto_fin'],
            sumMap['ing_no_op'], sumMap['otros_egr_op']].filter(Boolean));

          return (
            <div ref={scrollRef} style={{overflowX:'auto', maxHeight:'70vh', overflowY:'auto'}}>
              <table style={{fontSize:FS, borderCollapse:'collapse'}}>
                <thead style={{position:'sticky', top:0, zIndex:4}}>
                  <tr>
                    <th rowSpan={2} style={{...THB, ...TH_STICKY, textAlign:'left', left:0, zIndex:5,
                      background:C_PPTO, minWidth:'200px', padding:'4px 8px', borderRight:'1px solid #2a4a5a'}}>
                      Sub-área
                    </th>
                    <th colSpan={2} style={{...THB, ...TH_STICKY, background:'#374151', textAlign:'center', borderRight:'1px solid #555'}}>%</th>
                    {showSec.ppto && <th colSpan={14} style={{...THB, ...TH_STICKY, background:C_PPTO, textAlign:'center', ...(showSec.tc||showSec.ipc||showSec.cpi?BDR:{})}}>
                      <span id="sec-ppto">PPTO {a1fin}</span>
                    </th>}
                    {showSec.tc  && <th colSpan={16} style={{...THB, ...TH_STICKY, background:C_TC,  textAlign:'center', ...(showSec.ipc||showSec.cpi?BDR:{})}}>
                      <span id="sec-tc">Ajustado TC + Efecto TC</span>
                    </th>}
                    {showSec.ipc && <th colSpan={16} style={{...THB, ...TH_STICKY, background:C_IPC, textAlign:'center', ...(showSec.cpi?BDR:{})}}>
                      <span id="sec-ipc">Ajustado IPC + Efecto IPC</span>
                    </th>}
                    {showSec.cpi && <th colSpan={16} style={{...THB, ...TH_STICKY, background:C_CPI, textAlign:'center', ...BDR}}>
                      <span id="sec-cpi">Ajustado CPI + Efecto CPI</span>
                    </th>}
                  </tr>
                  <tr>
                    <th style={{...THB, ...TH_STICKY, background:'#374151', textAlign:'center'}}>Fijo</th>
                    <th style={{...THB, ...TH_STICKY, background:'#374151', textAlign:'center', borderRight:'1px solid #555'}}>Var</th>
                    {showSec.ppto && <>
                      {MO_S.map((m,i)=><th key={`hp${i}`} style={{...THB,...TH_STICKY, background:i===m1fin-1?'#27687a':C_PPTO}}>{m}</th>)}
                      <th style={{...THB,...TH_STICKY, background:'#1A5080'}}>Mes</th>
                      <th style={{...THB,...TH_STICKY, background:'#1A5080', ...(showSec.tc||showSec.ipc||showSec.cpi?BDR:{})}}>Acum</th>
                    </>}
                    {showSec.tc && <>
                      {MO_S.map((m,i)=><th key={`htc${i}`} style={{...THB,...TH_STICKY, background:i===m1fin-1?'#2e8090':C_TC}}>{m}</th>)}
                      <th style={{...THB,...TH_STICKY, background:'#0d5060'}}>Mes</th>
                      <th style={{...THB,...TH_STICKY, background:'#0d5060'}}>Acum</th>
                      <th style={{...THB,...TH_STICKY, background:'#0a4050'}}>Ef Mes</th>
                      <th style={{...THB,...TH_STICKY, background:'#0a4050', ...(showSec.ipc||showSec.cpi?BDR:{})}}>Ef Acum</th>
                    </>}
                    {showSec.ipc && <>
                      {MO_S.map((m,i)=><th key={`hipc${i}`} style={{...THB,...TH_STICKY, background:i===m1fin-1?'#4a6a90':C_IPC}}>{m}</th>)}
                      <th style={{...THB,...TH_STICKY, background:'#2d4a70'}}>Mes</th>
                      <th style={{...THB,...TH_STICKY, background:'#2d4a70'}}>Acum</th>
                      <th style={{...THB,...TH_STICKY, background:'#1d3a60'}}>Ef Mes</th>
                      <th style={{...THB,...TH_STICKY, background:'#1d3a60', ...(showSec.cpi?BDR:{})}}>Ef Acum</th>
                    </>}
                    {showSec.cpi && <>
                      {MO_S.map((m,i)=><th key={`hcpi${i}`} style={{...THB,...TH_STICKY, background:i===m1fin-1?'#7a5ca9':C_CPI}}>{m}</th>)}
                      <th style={{...THB,...TH_STICKY, background:'#5a3c80'}}>Mes</th>
                      <th style={{...THB,...TH_STICKY, background:'#5a3c80'}}>Acum</th>
                      <th style={{...THB,...TH_STICKY, background:'#4a2c70'}}>Ef Mes</th>
                      <th style={{...THB,...TH_STICKY, background:'#4a2c70', ...BDR}}>Ef Acum</th>
                    </>}
                  </tr>
                </thead>
                <tbody>
                  {(data.grupos || []).map((grp, gi) => {
                    const sas    = grp.subareas || [];
                    const isLeaf = sas.length <= 1;
                    const isExp  = expandedGroups ? expandedGroups.has(grp.key) : sas.some(sa => sa.mapped);
                    return (
                      <React.Fragment key={grp.key}>
                        <tr>
                          <td style={GRP}>
                            {!isLeaf && (
                              <button onClick={() => toggleGroup(grp.key)} style={{
                                marginRight:'6px', background:'none', border:'1px solid rgba(255,255,255,0.4)',
                                borderRadius:'3px', color:'white', cursor:'pointer', fontSize:'.65rem',
                                padding:'0 3px', lineHeight:'1.4', verticalAlign:'middle',
                              }}>{isExp ? '−' : '+'}</button>
                            )}
                            {grp.label}
                          </td>
                          <RowData row={grpTotals[gi]} fijo={null} bold={true} bg='#1A3A4A'/>
                        </tr>
                        {showSub && !isLeaf && isExp && sas.map(sa => {
                          const dim = !sa.mapped;
                          return (
                            <tr key={sa.key}>
                              <td style={{...LBL, paddingLeft:'18px', color:dim?'#bbb':'#374151', fontStyle:dim?'italic':'normal'}}>
                                {sa.label}
                              </td>
                              <RowData row={sa} fijo={sa.fijo}/>
                            </tr>
                          );
                        })}
                      </React.Fragment>
                    );
                  })}

                  <tr style={{borderTop:'2px solid #e5e7eb'}}>
                    <td style={{...TOT, background:'#dbeafe'}}>Costo On Site</td>
                    <RowData row={onsiteTotal} fijo={null} bold={true} bg='#dbeafe'/>
                  </tr>

                  <tr>
                    <td colSpan={dataCols+1} style={{background:'#f3f4f6', padding:'2px 8px', fontSize:'.65rem',
                      fontWeight:'600', color:'#6b7280', borderTop:'2px solid #e5e7eb',
                      letterSpacing:'.04em', textTransform:'uppercase'}}>Otros conceptos</td>
                  </tr>

                  {(() => {
                    const SUBrow = (row, label, bg) => row ? (
                      <tr key={label} style={{borderTop:'1px solid #e5e7eb'}}>
                        <td style={{...TOT, background:bg}}>{label}</td>
                        <RowData row={row} fijo={null} bold={true} bg={bg}/>
                      </tr>
                    ) : null;
                    const SMrow = (key) => {
                      const sr = sumMap[key] || (data.summary||[]).find(s => s.key === key);
                      if (!sr) return null;
                      const dim = !sr.mapped;
                      return (
                        <tr key={key}>
                          <td style={{...LBL, background:'#fffbf0', color:dim?'#bbb':'#374151', fontStyle:dim?'italic':'normal'}}>
                            {sr.label}
                          </td>
                          <RowData row={sr} fijo={sr.fijo} bg='#fffbf0'/>
                        </tr>
                      );
                    };
                    return [
                      SMrow('tcrc'),
                      SMrow('comer'),
                      SUBrow(preCredito, 'Costo Pre-crédito', '#f8fafc'),
                      SMrow('credito_subp'),
                      SUBrow(c1Total, 'Costo C1', '#f0f9f9'),
                      SMrow('da'),
                      SUBrow(c2Total, 'Costo C2', '#ecfdf5'),
                      SMrow('otros_fin'),
                      SMrow('dif_cambio'),
                      SMrow('donaciones'),
                      SMrow('gasto_expl'),
                      SMrow('ing_gasto_fin'),
                      SMrow('ing_no_op'),
                      SMrow('otros_egr_op'),
                      SUBrow(c3Total, 'Costo C3', '#d1fae5'),
                    ].filter(Boolean);
                  })()}
                </tbody>
              </table>
            </div>
          );
        })()}

        {!loading && !error && !data && (
          <p style={{color:'#aaa', fontSize:'.9rem'}}>Selecciona período para calcular.</p>
        )}
      </div>
    </div>
  );
}

/* ─── Tab: Flash Producciones ─── */
function FlashProduccionesTab({period}) {
  const {a1fin, m1fin, tipo1, tipo2} = period;
  const [data,    setData]    = useState(null);
  const [loading, setLoading] = useState(false);
  const [error,   setError]   = useState('');
  const [tracePop, setTracePop] = useState(null);  // {label, col, trace, x, y}
  useEffect(() => {
    if (!tracePop) return;
    const h = e => { if (!e.target.closest('[data-trace-pop]')) setTracePop(null); };
    document.addEventListener('click', h);
    return () => document.removeEventListener('click', h);
  }, [tracePop]);

  const reload = useCallback(() => {
    if (!a1fin || !m1fin) return;
    setLoading(true); setError(''); setData(null);
    apiGet(`/api/flash-producciones?año=${a1fin}&mes=${m1fin}&tipo_r=${encodeURIComponent(tipo1)}&tipo_b=${encodeURIComponent(tipo2)}`)
      .then(setData).catch(e => setError(e.message || 'Error')).finally(() => setLoading(false));
  }, [a1fin, m1fin, tipo1, tipo2]);
  useEffect(() => { reload(); }, [reload]);

  const COMPANIES = ['MLP','CEN_CC','CEN_CAT','ANT','CMZ','GM'];
  const LABELS    = {MLP:'Los Pelambres', CEN_CC:'Centinela CuCons', CEN_CAT:'Centinela Cátodos',
                     ANT:'Antucoya', CMZ:'Zaldívar (50%)', GM:'Grupo Minero'};
  const MES_NAMES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  function fmtV(v, unit) {
    if (v == null) return '—';
    if (unit === '%') return v.toFixed(2) + '%';
    if (unit === 'Mt') return v.toFixed(1);
    if (unit === 'koz' && Math.abs(v) >= 100) return Math.round(v).toString();
    return v.toFixed(1);
  }
  // Efecto: viene pre-calculado del backend (descomposición ktCuf o Real−Ppto).
  // Siempre se muestra como NÚMERO con 1 decimal (nunca %).
  function fmtEf(ef) {
    if (ef == null) return '—';
    const abs = Math.abs(ef).toFixed(1);
    return ef < 0 ? `(${abs})` : abs;
  }
  function efColor(ef) {
    if (ef == null) return undefined;
    return ef < 0 ? '#c0392b' : '#000';
  }

  async function downloadExcel() {
    const url = `/api/flash-producciones/excel?año=${a1fin}&mes=${m1fin}&tipo_r=${encodeURIComponent(tipo1)}&tipo_b=${encodeURIComponent(tipo2)}`;
    const resp = await fetch(url);
    if (!resp.ok) return;
    const blob = await resp.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = `Flash_Producciones_${a1fin}_${String(m1fin).padStart(2,'0')}.xlsx`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(blobUrl);
  }
  function downloadJpg() {
    const el = document.getElementById('flash-print-area');
    if (!el) return;
    html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true }).then(canvas => {
      const a = document.createElement('a');
      a.download = `Flash_Producciones_${a1fin}_${String(m1fin).padStart(2,'0')}.jpg`;
      a.href = canvas.toDataURL('image/jpeg', 0.95);
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    });
  }

  const TH = {background:'#1A3A4A', color:'white', padding:'5px 8px', fontWeight:'700', fontSize:'.72rem', whiteSpace:'nowrap', textAlign:'center'};
  const TH2 = {background:'#1E6F7E', color:'white', padding:'4px 7px', fontWeight:'600', fontSize:'.68rem', textAlign:'center'};
  const TD  = {padding:'3px 8px', fontSize:'.78rem', textAlign:'right', borderBottom:'1px solid #eee', whiteSpace:'nowrap'};
  const TDLBL = {padding:'3px 8px', fontSize:'.78rem', fontWeight:'400', position:'sticky', left:0, background:'white', zIndex:1, borderRight:'1px solid #ddd', whiteSpace:'nowrap'};

  function Section({label, rk, bk}) {
    if (!data) return null;
    return (
      <div style={{marginBottom:'24px'}}>
        <div style={{background:'#1A3A4A', color:'white', fontWeight:'700', fontSize:'.8rem', padding:'6px 10px', borderRadius:'4px 4px 0 0'}}>{label}</div>
        <div style={{overflowX:'auto'}}>
          <table style={{borderCollapse:'collapse', fontSize:'.78rem', width:'100%'}}>
            <thead>
              <tr>
                <th style={{...TH, textAlign:'left', position:'sticky', left:0, zIndex:2, minWidth:'160px'}}>KPI</th>
                <th style={{...TH, minWidth:'40px'}}>Und.</th>
                {COMPANIES.map(co => (
                  <th key={co} style={{...TH2, borderLeft:'2px solid #0f3040'}} colSpan={3}>{LABELS[co]}</th>
                ))}
              </tr>
              <tr>
                <th style={{...TH, position:'sticky', left:0, zIndex:2}}></th>
                <th style={{...TH}}></th>
                {COMPANIES.map(co => ['Real','Ppto','Efecto'].map(s => (
                  <th key={co+s} style={{...TH, background: s==='Efecto'?'#2a5a6a':'#1A4E5A', fontSize:'.65rem', borderLeft: s==='Real'?'2px solid #0f3040':'none'}}>
                    {s}
                  </th>
                )))}
              </tr>
            </thead>
            <tbody>
              {data.rows.map((row, ri) => {
                const bold = row.bold;
                const bg = bold ? '#d1fae5' : undefined;
                return (
                  <React.Fragment key={row.key}>
                    {row.sep && <tr><td colSpan={2 + COMPANIES.length * 3} style={{padding:'4px', background:'#f9fafb'}}></td></tr>}
                    <tr style={{background: bg, borderTop: bold ? '2px solid #6ee7b7' : undefined}}>
                      <td style={{...TDLBL, fontWeight: bold ? '700' : '400', background: bg || 'white'}}>{row.label}</td>
                      <td style={{...TD, textAlign:'center', color:'#888', background: bg || undefined}}>{row.unit}</td>
                      {COMPANIES.map(co => {
                        const cv = row.companies[co] || {};
                        const rv = cv[rk]; const bv = cv[bk];
                        const panel = rk.slice(2);  // "r_mes" → "mes"
                        const ef = cv['ef_' + panel];
                        const tr = cv.trace;
                        const clickable = tr && !tr.agregado;
                        const openTrace = which => e => {
                          if (!clickable) return;
                          e.stopPropagation();
                          const rc = e.currentTarget.getBoundingClientRect();
                          setTracePop({ label: row.label, unit: row.unit, col: co, rowkey: row.key,
                            which, colLabel: LABELS[co], trace: tr, cellCfg: cv.cell_cfg || {},
                            x: rc.left, y: rc.bottom });
                        };
                        const cellSt = clickable ? {cursor:'pointer'} : {};
                        return [
                          <td key={co+'r'} onClick={openTrace('real')} title={clickable?'Configurar fuente Real':undefined}
                            style={{...TD, ...cellSt, borderLeft:'2px solid #ddd', background: bg}}>{fmtV(rv, row.unit)}</td>,
                          <td key={co+'b'} onClick={openTrace('ppto')} title={clickable?'Configurar fuente Ppto':undefined}
                            style={{...TD, ...cellSt, background: bg}}>{fmtV(bv, row.unit)}</td>,
                          <td key={co+'e'} onClick={openTrace('efecto')} title={clickable?'Configurar fuente Efecto':undefined}
                            style={{...TD, ...cellSt, background: bg, color: efColor(ef), fontWeight:'600'}}>{fmtEf(ef)}</td>,
                        ];
                      })}
                    </tr>
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    );
  }

  const mesNombre = data ? MES_NAMES[data.mes - 1] : (MES_NAMES[m1fin - 1] || '');

  return (
    <div style={{padding:'16px', maxWidth:'1400px', margin:'0 auto'}}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'12px'}}>
        <h2 style={{margin:0, fontSize:'1rem', fontWeight:'700', color:'var(--navy)'}}>Flash Producciones — {mesNombre} {a1fin}</h2>
        <div style={{display:'flex', gap:'8px'}}>
          <button onClick={downloadJpg} style={{padding:'6px 14px', background:'#6b7280', color:'white', border:'none', borderRadius:'6px', cursor:'pointer', fontSize:'.8rem'}}>
            ↓ JPG
          </button>
          <button onClick={downloadExcel} style={{padding:'6px 14px', background:'#059669', color:'white', border:'none', borderRadius:'6px', cursor:'pointer', fontSize:'.8rem'}}>
            ↓ Excel
          </button>
        </div>
      </div>

      {loading && <p style={{color:'#aaa'}}><span className="spin"/>Calculando…</p>}
      {error   && <p className="err">{error}</p>}

      {!loading && !error && data && (
        <div id="flash-print-area">
          <Section label={`MES ${mesNombre} ${a1fin}`}       rk="r_mes" bk="b_mes"/>
          <Section label={`Acumulado Ene–${mesNombre} ${a1fin}`} rk="r_ytd" bk="b_ytd"/>
        </div>
      )}

      {tracePop && <FlashTracePopover pop={tracePop} onClose={() => setTracePop(null)}
        onSaved={() => { setTracePop(null); reload(); }}/>}
    </div>
  );
}

/* ─── Popover de trazabilidad de una celda del Flash ─── */
function FlashTracePopover({pop, onClose, onSaved}) {
  const {label, unit, colLabel, trace, x, y} = pop;
  const [edits, setEdits] = useState({});   // lk → nuevo src
  const [saving, setSaving] = useState(false);
  const [sources, setSources] = useState(null);   // {descomposicion:[], visualizar:[]}
  const [slots, setSlots] = useState(() => pop.cellCfg || {});  // {real,ppto,efecto:{source,kpi}}
  const [savingCfg, setSavingCfg] = useState(false);
  const W = 380;
  const left = Math.min(x, window.innerWidth - W - 16);
  const top = Math.min(y + 6, window.innerHeight - 420);
  const company = trace.company;

  // Cargar KPIs seleccionables de la columna (Visualizar + Descomposición)
  useEffect(() => {
    if (trace.agregado) return;
    apiGet(`/api/flash-producciones/sources?col=${encodeURIComponent(pop.col)}`)
      .then(setSources).catch(() => setSources({descomposicion:[], visualizar:[]}));
  }, [pop.col]);

  function setSlot(which, patch) {
    setSlots(p => ({...p, [which]: {...(p[which]||{}), ...patch}}));
  }
  async function saveCfg() {
    setSavingCfg(true);
    try {
      await apiPut('/api/flash-producciones/cell-config',
        {col: pop.col, rowkey: pop.rowkey, slots});
      showToast('Fuente de celda actualizada', 'ok');
      onSaved && onSaved();
    } catch(e) { showToast(e.message || 'Error al guardar'); }
    finally { setSavingCfg(false); }
  }

  const tipoLabel = m => ({
    directo: 'Directo', suma: 'Suma', escalar: 'Escalar', formula: 'Fórmula',
    real_ppto: 'Real/Ppto', sin_mapear: 'Sin mapear', otro: 'Otro',
  }[m.tipo] || m.tipo);

  async function handleSave() {
    setSaving(true);
    try {
      const all = await apiGet('/api/setup/mappings');
      const cmap = {...(all[company] || {})};
      for (const [lk, src] of Object.entries(edits)) {
        cmap[lk] = src;   // edición de fuente directa
      }
      await apiPost('/api/setup/mappings', {...all, [company]: cmap});
      showToast('Mapeo actualizado', 'ok');
      onSaved && onSaved();
    } catch(e) {
      showToast(e.message || 'Error al guardar');
    } finally { setSaving(false); }
  }

  const hasEdits = Object.keys(edits).length > 0;

  return (
    <div data-trace-pop style={{
      position:'fixed', left, top, width:W, maxHeight:'320px', overflowY:'auto',
      background:'white', border:'1px solid #d0d8e0', borderRadius:'8px',
      boxShadow:'0 6px 24px rgba(0,0,0,.18)', padding:'12px 14px', zIndex:9999,
      fontSize:'.78rem', lineHeight:1.5,
    }} onClick={e => e.stopPropagation()}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center',
        fontWeight:700, marginBottom:8, borderBottom:'1px solid #eee', paddingBottom:6}}>
        <span>{label} · {colLabel}</span>
        <span style={{cursor:'pointer', color:'#aaa'}} onClick={onClose}>✕</span>
      </div>

      {trace.agregado ? (
        <p style={{color:'#888', margin:0}}>Columna agregada (Grupo Minero): suma/promedio de las demás columnas. No tiene mapeo directo.</p>
      ) : trace.derivado ? (
        <div>
          <div style={{display:'flex', gap:6, alignItems:'center', marginBottom:6}}>
            <span style={{fontSize:'.66rem', fontWeight:700, color:'#7c3aed',
              background:'#ede9fe', borderRadius:4, padding:'1px 6px'}}>Fórmula</span>
            <span style={{fontSize:'.7rem', color:'#888'}}>Compañía: <b>{trace.company}</b></span>
          </div>
          <div style={{fontFamily:'monospace', fontSize:'.78rem', color:'#374151',
            background:'#f8fafc', borderRadius:5, padding:'7px 9px', marginBottom:8}}>
            {trace.formula}
          </div>
          <p style={{color:'#666', margin:0, fontSize:'.74rem'}}>{trace.detalle}</p>
        </div>
      ) : (trace.lks || []).length === 0 ? (
        <p style={{color:'#888', margin:0}}>Sin KPIs vinculados para esta celda.</p>
      ) : (
        <>
          <div style={{fontSize:'.7rem', color:'#888', marginBottom:6}}>
            Compañía origen: <b>{company}</b>
          </div>
          {trace.lks.map((e, i) => {
            const m = e.mapping;
            const editableSrc = (m.tipo === 'directo' || m.tipo === 'escalar');
            const curSrc = e.lk in edits ? edits[e.lk] : (m.src || '');
            return (
              <div key={i} style={{marginBottom:10, paddingBottom:8,
                borderBottom: i < trace.lks.length-1 ? '1px dashed #eee' : 'none'}}>
                <div style={{display:'flex', gap:6, alignItems:'center', marginBottom:3}}>
                  <span style={{fontSize:'.66rem', fontWeight:700, color:'#0369a1',
                    background:'#e0f2fe', borderRadius:4, padding:'1px 6px'}}>{tipoLabel(m)}</span>
                  {e.es_total && <span style={{fontSize:'.64rem', color:'#b45309'}}>(total)</span>}
                  <span style={{fontWeight:600}}>{e.lk.split('||').pop()}</span>
                </div>
                {m.tipo === 'formula' ? (
                  <div style={{fontFamily:'monospace', fontSize:'.72rem', color:'#555'}}>
                    {(m.a||'?')} {m.op} {(m.b||'?')}
                  </div>
                ) : m.tipo === 'real_ppto' ? (
                  <div style={{fontSize:'.72rem', color:'#555'}}>
                    Real: {m.real||'—'} · Ppto: {m.budget||'—'}
                  </div>
                ) : editableSrc ? (
                  <>
                    <input value={curSrc}
                      onChange={ev => setEdits(p => ({...p, [e.lk]: ev.target.value}))}
                      placeholder="Fuente en parquet…"
                      style={{width:'100%', padding:'5px 8px', border:'1.5px solid var(--gray)',
                        borderRadius:5, fontSize:'.74rem', outline:'none',
                        borderColor: e.lk in edits ? '#10b981' : 'var(--gray)'}}/>
                    {m.tipo === 'escalar' && (
                      <div style={{fontSize:'.66rem', color:'#b45309', marginTop:2}}>
                        × escalar: {m.op} {m.scalar}
                      </div>
                    )}
                  </>
                ) : (
                  <div style={{fontSize:'.72rem', color: m.tipo==='sin_mapear'?'#dc2626':'#555'}}>
                    {m.tipo === 'sin_mapear' ? 'No aplica / sin mapear'
                      : Array.isArray(m.src) ? m.src.join(' + ') : (m.src || '—')}
                  </div>
                )}
              </div>
            );
          })}
          <div style={{display:'flex', gap:8, justifyContent:'flex-end', marginTop:4}}>
            <button onClick={onClose} style={{padding:'5px 12px', border:'1px solid var(--border)',
              background:'var(--gray-soft)', borderRadius:5, cursor:'pointer', fontSize:'.76rem'}}>Cerrar</button>
            <button onClick={handleSave} disabled={!hasEdits || saving}
              style={{padding:'5px 14px', border:'none', borderRadius:5, fontSize:'.76rem',
                background: hasEdits ? 'var(--teal)' : '#cbd5e1', color:'white',
                cursor: hasEdits ? 'pointer' : 'default', fontWeight:700}}>
              {saving ? 'Guardando…' : 'Guardar'}
            </button>
          </div>
          <div style={{fontSize:'.66rem', color:'#999', marginTop:6}}>
            Para editar escalares/fórmulas en detalle, usa <b>Configuración</b>.
          </div>
        </>
      )}

      {/* ── Configurar fuente SOLO de la parte clicada (Real, Ppto o Efecto) ── */}
      {!trace.agregado && (() => {
        const which = pop.which || 'efecto';
        const whichLabel = {real:'Real', ppto:'Ppto', efecto:'Efecto'}[which];
        const slot = slots[which] || {};
        const opts = slot.source === 'visualizar' ? (sources?.visualizar || [])
          : slot.source === 'descomposicion' ? (sources?.descomposicion || []) : [];
        const selSt = {padding:'5px 7px', border:'1.5px solid var(--gray)', borderRadius:5,
          fontSize:'.74rem', outline:'none', background:'white'};
        return (
          <div style={{marginTop:12, borderTop:'2px solid #eef2f5', paddingTop:10}}>
            <div style={{fontWeight:700, fontSize:'.74rem', color:'var(--navy)', marginBottom:6}}>
              Fuente de <span style={{color:'var(--teal)'}}>{whichLabel}</span> · {colLabel}
            </div>
            {!sources ? (
              <p style={{color:'#aaa', fontSize:'.72rem', margin:0}}><span className="spin"/>Cargando KPIs…</p>
            ) : (
              <>
                <div style={{display:'flex', gap:6, alignItems:'center', marginBottom:6}}>
                  <select value={slot.source||''} style={{...selSt, width:110, flexShrink:0}}
                    onChange={e => setSlot(which, {source: e.target.value || undefined, kpi: undefined})}>
                    <option value="">— Default —</option>
                    <option value="descomposicion">Descomposición</option>
                    <option value="visualizar">Visualizar</option>
                  </select>
                  {slot.source && (
                    <select value={slot.kpi||''} style={{...selSt, flex:1, minWidth:0}}
                      onChange={e => setSlot(which, {kpi: e.target.value || undefined})}>
                      <option value="">Elegir KPI…</option>
                      {opts.map(o => <option key={o.kpi} value={o.kpi}>{o.label}</option>)}
                    </select>
                  )}
                </div>
                <div style={{display:'flex', gap:8, justifyContent:'flex-end', marginTop:4}}>
                  <button onClick={() => setSlot(which, {source: undefined, kpi: undefined})}
                    style={{padding:'5px 10px', border:'1px solid var(--border)', background:'var(--gray-soft)',
                      borderRadius:5, cursor:'pointer', fontSize:'.74rem'}}>Quitar</button>
                  <button onClick={saveCfg} disabled={savingCfg}
                    style={{padding:'5px 14px', border:'none', borderRadius:5, fontSize:'.74rem',
                      background:'var(--teal)', color:'white', cursor:'pointer', fontWeight:700}}>
                    {savingCfg ? 'Guardando…' : `Guardar ${whichLabel}`}
                  </button>
                </div>
                <div style={{fontSize:'.64rem', color:'#999', marginTop:5}}>
                  Default = cálculo estándar del Flash. Elige un KPI para sobreescribir <b>{whichLabel}</b> de esta celda.
                </div>
              </>
            )}
          </div>
        );
      })()}
    </div>
  );
}

/* ─── Root App ─── */
const IcoMoon     = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>;
const IcoSun      = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>;
const IcoRefresh  = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>;
const IcoSettings = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;

function App() {
  const [tab,       setTab]       = useState('viz');
  const [company,   setCompany]   = useState('Grupo Minero');
  const [panel,     setPanel]     = useState('ytd');
  const [dark,      setDark]      = useState(false);
  const [collapsed, setCollapsed] = useState(false);
  const [tipos] = useState(['Real', 'Ppto']);
  const [lastUpdate, setLastUpdate] = useState(() => {
    const n = new Date();
    return `${n.getDate()} ${['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][n.getMonth()]} ${n.getFullYear()} · ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
  });
  /* Explicaciones ctrl-bar state hoisted so App can render it in ctrl-bar-sticky */
  const [expAño,    setExpAño]    = useState(null);
  const [expMes,    setExpMes]    = useState(null);
  const [expPanel,  setExpPanel]  = useState('ytd');
  const [expShowTodas, setExpShowTodas] = useState(false);
  const [expColDec, setExpColDec] = useState({real:1, ppto:1, efecto:1});
  const [expCargar, setExpCargar] = useState(0); // bump to trigger load
  const [tipo1, setTipo1] = useState('Real');
  const [a1ini, setA1ini] = useState(DEFAULT_YR);
  const [m1ini, setM1ini] = useState(1);
  const [a1fin, setA1fin] = useState(DEFAULT_YR);
  const [m1fin, setM1fin] = useState(DEFAULT_MO);
  const [tipo2, setTipo2] = useState('Ppto');
  const [a2ini, setA2ini] = useState(DEFAULT_YR);
  const [m2ini, setM2ini] = useState(1);

  const dur       = (a1fin - a1ini) * 12 + (m1fin - m1ini);
  const m2fin_raw = m2ini + dur;
  const a2fin     = a2ini + Math.floor((m2fin_raw - 1) / 12);
  const m2fin     = ((m2fin_raw - 1) % 12) + 1;

  const period  = { tipo1, a1ini, m1ini, a1fin, m1fin, tipo2, a2ini, m2ini, a2fin, m2fin };
  const setters = { setTipo1, setA1ini, setM1ini, setA1fin, setM1fin, setTipo2, setA2ini, setM2ini };

  const showPeriodBar = ['viz','analisis','params','costos_aj','cm','flash','graficos'].includes(tab);
  const TAB_LABELS = {
    mapeos:'Configuración', params:'Parámetros', viz:'Visualizar Input',
    analisis:'Análisis Costo', costos_aj:'Costos Ajustados', cm:'Costos Ajustados Mes (CM)',
    flash:'Flash Producciones', explicaciones:'Explicaciones', graficos:'Gráficos',
  };
  const TAB_SECTIONS = {
    mapeos:'Configuración', params:'Configuración',
    viz:'Análisis', analisis:'Análisis', costos_aj:'Análisis', cm:'Análisis',
    flash:'Reportes', explicaciones:'Reportes', graficos:'Reportes',
  };

  const CO_NAMES = {MLP:'Minera Los Pelambres', CEN:'Centinela', ANT:'Antucoya', CMZ:'Zaldívar'};

  /* Subtítulo dinámico por tab */
  function getSubtitle() {
    if (tab === 'explicaciones') {
      const efectivoCo = expShowTodas ? 'Todas' : company;
      const efectivoMes = expMes ?? m1fin;
      const efectivoAño = expAño ?? a1fin;
      const mesNom = MESES[efectivoMes] || '';
      const coLabel = efectivoCo === 'Todas' ? 'Grupo Minero'
        : CO_NAMES[efectivoCo] ? `${efectivoCo} — ${CO_NAMES[efectivoCo]}` : efectivoCo;
      return `Variaciones Real vs Presupuesto · ${coLabel}`;
    }
    if (tab === 'flash') return `Flash Producciones · ${MESES[m1fin]} ${a1fin}`;
    if (tab === 'analisis' || tab === 'costos_aj' || tab === 'cm') {
      const cName = CO_NAMES[company]; return cName ? `${company} — ${cName}` : (company || '');
    }
    return TAB_SECTIONS[tab] || '';
  }

  /* Título grande (V2) */
  function getPageTitle() {
    if (tab === 'explicaciones') {
      const efectivoMes = expMes ?? m1fin;
      const efectivoAño = expAño ?? a1fin;
      return `Explicaciones · Cierre ${MESES[efectivoMes]} ${efectivoAño}`;
    }
    if (tab === 'flash') return `Flash Producciones · ${MESES[m1fin]} ${a1fin}`;
    return TAB_LABELS[tab] || tab;
  }

  function excelUrl() {
    const enc = encodeURIComponent;
    return `/api/export/excel?tipo1=${enc(tipo1)}&año1_ini=${a1ini}&mes1_ini=${m1ini}&año1_fin=${a1fin}&mes1_fin=${m1fin}`
         + `&tipo2=${enc(tipo2)}&año2_ini=${a2ini}&mes2_ini=${m2ini}&año2_fin=${a2fin}&mes2_fin=${m2fin}`;
  }

  /* sync dark class on document element */
  useEffect(() => {
    dark ? document.documentElement.setAttribute('data-dark','') : document.documentElement.removeAttribute('data-dark');
  }, [dark]);

  /* Init exp state from period when tab switches */
  useEffect(() => {
    if (tab === 'explicaciones') {
      setExpAño(a => a ?? a1fin);
      setExpMes(m => m ?? m1fin);
    }
  }, [tab]);

  const expCtrlCompany = expShowTodas ? 'Todas' : (COMPANIES.includes(company) ? company : COMPANIES[0]);

  const initials = 'MR'; // Michelle Madrid

  return (
    <div className="app-layout">
      <Sidebar tab={tab} setTab={setTab} collapsed={collapsed} onToggleCollapse={() => setCollapsed(c => !c)}/>
      <div className="content-area">

        {/* ── Header V2: blanco, breadcrumb + título grande + acciones ── */}
        <div className="content-header">
          {/* Izquierda: breadcrumb + título + subtítulo */}
          <div className="content-header-info" style={{flex:1, minWidth:0}}>
            <div className="content-header-breadcrumb">
              <span>{TAB_SECTIONS[tab] || 'Inicio'}</span>
              <span className="sep">›</span>
              <span className="cur">{TAB_LABELS[tab] || tab}</span>
            </div>
            <div className="content-header-title">{getPageTitle()}</div>
            <div className="content-header-sub">{getSubtitle()}</div>
          </div>

          {/* Derecha: última actualización + íconos + avatar */}
          <div style={{display:'flex', gap:'8px', alignItems:'center', flexShrink:0}}>
            <div className="last-update-badge">
              <span className="last-update-dot"/>
              <span>Última actualización: {lastUpdate}</span>
            </div>
            <button className="hdr-icon-btn" title="Refrescar" onClick={() => {
              const n = new Date();
              setLastUpdate(`${n.getDate()} ${['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][n.getMonth()]} ${n.getFullYear()} · ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`);
              if (tab==='explicaciones') setExpCargar(x => x+1);
            }}>
              <IcoRefresh/>
            </button>
            <button className="hdr-icon-btn" onClick={() => setDark(d => !d)}
              title={dark ? 'Modo claro' : 'Modo oscuro'}>
              {dark ? <IcoSun/> : <IcoMoon/>}
            </button>
            <button className="hdr-icon-btn" title="Configuración"><IcoSettings/></button>
            <a href={excelUrl()} className="hdr-export-btn">
              <IcoDownload/> Exportar
            </a>
            <div className="hdr-avatar" title="Michelle Madrid">{initials}</div>
          </div>
        </div>

        {/* PeriodBar para tabs que la necesitan */}
        {showPeriodBar && (
          <div className="topbar">
            <PeriodBar period={period} setters={setters} tipos={tipos}/>
          </div>
        )}

        {/* ctrl-bar: selector empresa + otros controles según tab */}
        {(tab==='viz' || tab==='analisis' || tab==='costos_aj') && (
          <div className="ctrl-bar-sticky">
            <CtrlBar
              companies={tab==='analisis' ? ['Grupo Minero',...COMPANIES] : COMPANIES}
              company={COMPANIES.includes(company) || (tab==='analisis' && company==='Grupo Minero') ? company : COMPANIES[0]}
              setCompany={setCompany}
              panel={tab==='analisis' ? panel : undefined}
              setPanel={tab==='analisis' ? setPanel : undefined}
            />
          </div>
        )}

        {/* ctrl-bar de Explicaciones: GRUPO | MLP CEN ANT CMZ Todas | 📅 año | mes | YTD Mes | Cargar */}
        {tab==='explicaciones' && (
          <div className="ctrl-bar-sticky">
            <div style={{display:'flex', gap:'8px', alignItems:'center', flexWrap:'wrap'}}>
              {/* Label GRUPO */}
              <span style={{fontSize:'.72rem', fontWeight:700, color:'var(--text-muted)',
                textTransform:'uppercase', letterSpacing:'.08em', paddingRight:'4px',
                borderRight:'2px solid var(--border)', marginRight:'2px'}}>
                Grupo
              </span>
              {/* Selector compañía */}
              <div className="seg-ctrl">
                {['MLP','CEN','ANT','CMZ','Todas'].map(c => (
                  <button key={c} className={`seg-btn ${expCtrlCompany===c?'active':''}`}
                    onClick={()=>{ if(c==='Todas'){setExpShowTodas(true);} else {setExpShowTodas(false);setCompany(c);} }}>
                    {c}
                  </button>
                ))}
              </div>

              {/* Separador */}
              <div style={{width:'1px', height:'24px', background:'var(--border)', margin:'0 2px'}}/>

              {/* Selector Año con ícono calendario */}
              <div style={{display:'flex', alignItems:'center', gap:'4px',
                border:'1.5px solid var(--gray)', borderRadius:'6px', padding:'3px 8px',
                background:'white', cursor:'pointer'}}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <select style={{border:'none', outline:'none', fontSize:'.83rem', fontWeight:600,
                  color:'var(--navy)', background:'transparent', cursor:'pointer', padding:'0'}}
                  value={expAño ?? a1fin}
                  onChange={e=>setExpAño(Number(e.target.value))}>
                  {RANGE_YEARS.map(a=><option key={a}>{a}</option>)}
                </select>
              </div>

              {/* Selector Mes */}
              <div style={{display:'flex', alignItems:'center', gap:'4px',
                border:'1.5px solid var(--gray)', borderRadius:'6px', padding:'3px 8px',
                background:'white', cursor:'pointer'}}>
                <select style={{border:'none', outline:'none', fontSize:'.83rem', fontWeight:600,
                  color:'var(--navy)', background:'transparent', cursor:'pointer', padding:'0',
                  minWidth:'60px'}}
                  value={expMes ?? m1fin}
                  onChange={e=>setExpMes(Number(e.target.value))}>
                  {MESES.slice(1).map((m,i)=><option key={i+1} value={i+1}>{m}</option>)}
                </select>
              </div>

              {/* YTD / Mes */}
              <div className="seg-ctrl">
                {[['ytd','YTD'],['mes','Mes']].map(([k,lbl]) => (
                  <button key={k} className={`seg-btn ${expPanel===k?'active':''}`}
                    onClick={()=>setExpPanel(k)}>{lbl}</button>
                ))}
              </div>

              {/* Botón Cargar — va a la derecha */}
              <button style={{
                marginLeft:'auto', display:'flex', alignItems:'center', gap:'6px',
                padding:'7px 18px', background:'var(--navy)', color:'white', border:'none',
                borderRadius:'6px', fontWeight:700, fontSize:'.84rem', cursor:'pointer',
                boxShadow:'var(--shadow-xs)', transition:'background var(--transition)',
              }}
              onMouseEnter={e=>e.currentTarget.style.background='#234d63'}
              onMouseLeave={e=>e.currentTarget.style.background='var(--navy)'}
              onClick={() => setExpCargar(x => x+1)}>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.84"/></svg>
                Cargar
              </button>
            </div>
          </div>
        )}

        <div className="main">
          {tab==='mapeos'        && <MapeosTab company={company} setCompany={setCompany}/>}
          {tab==='viz'           && <VisualizarTab period={period} tipos={tipos} company={company} setCompany={setCompany}/>}
          {tab==='analisis'      && <AnalisisCostoTab period={period} company={company} setCompany={setCompany} panel={panel} setPanel={setPanel}/>}
          {tab==='costos_aj'     && <CostosAjustadosTab period={period} company={company} setCompany={setCompany}/>}
          {tab==='cm'            && <CostosAjMesTab period={period} company={company} setCompany={setCompany}/>}
          {tab==='params'        && <ParamsTab period={period}/>}
          {tab==='flash'         && <FlashProduccionesTab period={period}/>}
          {tab==='explicaciones' && <ExplicacionesTab
            period={period} company={expCtrlCompany}
            expAño={expAño ?? a1fin} expMes={expMes ?? m1fin}
            expPanel={expPanel} expColDec={expColDec} setExpColDec={setExpColDec}
            expCargar={expCargar}/>}
          {tab==='graficos'      && <GraficosTab period={period} company={company} setCompany={setCompany} panel={panel} setPanel={setPanel}/>}
        </div>
      </div>
    </div>
  );
}

function Root() {
  return (<><App /><ToastContainer /></>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
