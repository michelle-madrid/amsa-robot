function FormulasTab() {
  const [params,  setParams]  = useState(null);
  const [saving,  setSaving]  = useState(false);
  const [saved,   setSaved]   = useState(false);
  const [error,   setError]   = useState('');
  const [pqKpis,  setPqKpis]  = useState([]);
  const [lkMap,   setLkMap]   = useState({}); // {lk_label: parquet_kpi_name}

  useEffect(() => {
    Promise.all([
      apiGet('/api/calculos/formula-params'),
      apiGet('/api/setup/parquet-kpis/MLP'),
      apiGet('/api/setup/mappings'),
    ]).then(([fp, pq, mappings]) => {
      setParams(fp);
      setPqKpis(pq.kpis || []);
      // Build lk→parquet map (first company wins for duplicate lk keys)
      const lk = {};
      for (const cm of Object.values(mappings)) {
        for (const [k, val] of Object.entries(cm)) {
          if (lk[k]) continue;
          if (typeof val === 'string' && val !== '__NA__') lk[k] = val;
          else if (val?._s && val.src) lk[k] = val.src;
        }
      }
      setLkMap(lk);
    }).catch(e => setError(e.message || 'Error cargando parámetros'));
  }, []);

  // If the user typed/selected a Mapeos template label, resolve to parquet name
  function resolveLk(v) { return lkMap[v] !== undefined ? lkMap[v] : v; }

  function setKey(k, v) {
    setParams(p => ({ ...p, kpi_keys: { ...p.kpi_keys, [k]: resolveLk(v) } }));
    setSaved(false);
  }

  function setTronItem(idx, v) {
    setParams(p => {
      const arr = Array.isArray(p.kpi_keys.tronadura) ? [...p.kpi_keys.tronadura] : [p.kpi_keys.tronadura];
      arr[idx] = resolveLk(v);
      return { ...p, kpi_keys: { ...p.kpi_keys, tronadura: arr } };
    });
    setSaved(false);
  }

  function setSimpleItem(secKey, idx, v) {
    setParams(p => {
      const arr = [...(p[secKey] || [])];
      arr[idx] = v;
      return { ...p, [secKey]: arr };
    });
    setSaved(false);
  }

  function addSimpleItem(secKey) {
    setParams(p => ({ ...p, [secKey]: [...(p[secKey] || []), ''] }));
    setSaved(false);
  }

  function removeSimpleItem(secKey, idx) {
    setParams(p => ({ ...p, [secKey]: (p[secKey] || []).filter((_, i) => i !== idx) }));
    setSaved(false);
  }

  function setActCtx(field, v) {
    setParams(p => ({ ...p, actividad_contexto: { ...(p.actividad_contexto || {}), [field]: v } }));
    setSaved(false);
  }

  function setActCtxKpiItem(idx, v) {
    setParams(p => {
      const arr = [...(p.actividad_contexto?.mov_mina_kpis || [])];
      arr[idx] = v;
      return { ...p, actividad_contexto: { ...(p.actividad_contexto || {}), mov_mina_kpis: arr } };
    });
    setSaved(false);
  }

  function addActCtxKpiItem() {
    setParams(p => {
      const arr = [...(p.actividad_contexto?.mov_mina_kpis || []), ''];
      return { ...p, actividad_contexto: { ...(p.actividad_contexto || {}), mov_mina_kpis: arr } };
    });
    setSaved(false);
  }

  function removeActCtxKpiItem(idx) {
    setParams(p => {
      const arr = (p.actividad_contexto?.mov_mina_kpis || []).filter((_, i) => i !== idx);
      return { ...p, actividad_contexto: { ...(p.actividad_contexto || {}), mov_mina_kpis: arr } };
    });
    setSaved(false);
  }

  async function handleSave() {
    setSaving(true); setSaved(false);
    try {
      await apiPut('/api/calculos/formula-params', params);
      setSaved(true);
      setTimeout(() => setSaved(false), 3000);
    } catch(e) { setError(e.message || 'Error al guardar'); }
    finally { setSaving(false); }
  }

  if (!params) return (
    <div className="main">
      <div className="card">
        {error
          ? <p className="err">{error}</p>
          : <p className="hint"><span className="spin"/>Cargando parámetros…</p>
        }
      </div>
    </div>
  );

  return (
    <div className="main">
      <div className="card">
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'18px'}}>
          <div className="card-title" style={{margin:0}}>Fórmulas de Cálculo — Variables Configurables</div>
          <button onClick={handleSave} disabled={saving} className="btn btn-primary" style={{fontSize:'.88rem'}}>
            {saving ? 'Guardando…' : saved ? 'Guardado' : 'Guardar'}
          </button>
        </div>
        {error && <p className="err" style={{fontSize:'.85rem'}}>{error}</p>}

        <p style={{fontSize:'.83rem', color:'#666', marginBottom:'18px', lineHeight:'1.5'}}>
          Las variables de fórmula (KPIs del Parquet) se configuran en la pestaña <strong>Configurar Mapeos</strong>.
          Aquí solo se gestionan los items de Desarrollo Mina, Variación Inventario y contexto de Actividad.
        </p>

        {/* Desarrollo Mina — items configurables */}
        {(() => {
          const dmItems = params.desarrollo_mina_items || [];
          return (
            <div style={{marginBottom:'20px', border:'1px solid #e5e7eb', borderRadius:'8px', overflow:'hidden'}}>
              <div className="fm-grp-hd">Desarrollo Mina — IFRIC20 / Efecto P / Efecto Q <span style={{fontWeight:400, fontSize:'.75rem', marginLeft:'8px'}}>kUS$</span></div>
              <div style={{background:'#f8f9fa', padding:'8px 14px', fontSize:'.75rem', color:'#666',
                           borderBottom:'1px solid #e5e7eb', fontStyle:'italic'}}>
                Cada fila es la suma de sus KPIs (real − presupuesto). Configura los KPIs del parquet para IFRIC20, Efecto P y Efecto Q.
              </div>
              <table style={{width:'100%', borderCollapse:'collapse', fontSize:'.83rem'}}>
                <thead>
                  <tr style={{background:'#f3f4f6'}}>
                    <th style={{padding:'7px 14px', textAlign:'left', fontWeight:600, color:'#374151', width:'140px'}}>Fila</th>
                    <th style={{padding:'7px 14px', textAlign:'left', fontWeight:600, color:'#374151'}}>KPIs en Parquet</th>
                  </tr>
                </thead>
                <tbody>
                  {dmItems.map((item, ii) => (
                    <tr key={ii} style={{borderTop:'1px solid #f0f0f0', background: ii%2===0?'white':'#fafafa', verticalAlign:'top'}}>
                      <td style={{padding:'8px 14px', fontWeight:600, color:'#374151'}}>{item.label}</td>
                      <td style={{padding:'6px 14px'}}>
                        <div style={{display:'flex', flexDirection:'column', gap:'4px'}}>
                          {(item.kpis || []).map((kpi, ki) => (
                            <div key={ki} style={{display:'flex', gap:'6px', alignItems:'center'}}>
                              <input list="pq-all" value={kpi}
                                onChange={e => {
                                  const next = dmItems.map((it, idx) => {
                                    if (idx !== ii) return it;
                                    const kpis = [...(it.kpis || [])];
                                    kpis[ki] = e.target.value;
                                    return {...it, kpis};
                                  });
                                  setParams(p => ({...p, desarrollo_mina_items: next}));
                                  setSaved(false);
                                }}
                                className="fm-inp" placeholder="KPI en parquet…"/>
                              <button onClick={() => {
                                const next = dmItems.map((it, idx) => {
                                  if (idx !== ii) return it;
                                  return {...it, kpis: (it.kpis || []).filter((_,i)=>i!==ki)};
                                });
                                setParams(p => ({...p, desarrollo_mina_items: next}));
                                setSaved(false);
                              }} style={{background:'var(--red)',color:'white',border:'none',
                                borderRadius:'4px',width:'22px',height:'22px',cursor:'pointer',fontWeight:700}}>−</button>
                            </div>
                          ))}
                          <button onClick={() => {
                            const next = dmItems.map((it, idx) => {
                              if (idx !== ii) return it;
                              return {...it, kpis: [...(it.kpis || []), '']};
                            });
                            setParams(p => ({...p, desarrollo_mina_items: next}));
                            setSaved(false);
                          }} style={{alignSelf:'flex-start', background:'none', border:'1px dashed var(--teal)',
                            color:'var(--teal)', borderRadius:'4px', padding:'2px 8px',
                            cursor:'pointer', fontSize:'.75rem', fontWeight:700}}>+ KPI</button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          );
        })()}

        {/* Simple sections: Variación Inventario */}
        {SIMPLE_META.map((sec, si) => {
          const listEmpty = sec.required && (!(params[sec.key]||[]).length || (params[sec.key]||[]).every(x=>!x));
          return (
          <div key={si} style={{marginBottom:'20px', border:`1px solid ${listEmpty?'#f59e0b':'#e5e7eb'}`, borderRadius:'8px', overflow:'hidden'}}>
            <div className="fm-grp-hd">
              {sec.label} <span style={{fontWeight:400, fontSize:'.75rem', marginLeft:'8px'}}>{sec.unit}</span>
              {listEmpty && <span style={{marginLeft:'10px', color:'#fcd34d', fontWeight:700, fontSize:'.72rem'}}>● sin configurar</span>}
            </div>
            <div style={{background:'#f8f9fa', padding:'8px 14px', fontSize:'.75rem', color:'#666',
                         borderBottom:'1px solid #e5e7eb', fontStyle:'italic'}}>{sec.desc}</div>
            <div style={{padding:'12px 14px', display:'flex', flexDirection:'column', gap:'6px'}}>
              {(params[sec.key] || []).map((item, idx) => (
                <div key={idx} style={{display:'flex', gap:'6px', alignItems:'center'}}>
                  <input list="pq-all" value={item} onChange={e => setSimpleItem(sec.key, idx, e.target.value)}
                    className="fm-inp" placeholder="KPI en parquet…"/>
                  <button onClick={() => removeSimpleItem(sec.key, idx)}
                    style={{background:'var(--red)',color:'white',border:'none',
                            borderRadius:'4px',width:'22px',height:'22px',cursor:'pointer',fontWeight:700}}>−</button>
                </div>
              ))}
              <button onClick={() => addSimpleItem(sec.key)}
                style={{alignSelf:'flex-start', background:'none', border:'1px dashed var(--teal)',
                        color:'var(--teal)', borderRadius:'4px', padding:'3px 10px',
                        cursor:'pointer', fontSize:'.78rem', fontWeight:700}}>+ agregar KPI</button>
            </div>
          </div>
          );
        })}

        {/* Actividad Contexto */}
        {(() => {
          const ac = params.actividad_contexto || {};
          const movKpis = ac.mov_mina_kpis || [];
          return (
            <div style={{marginBottom:'20px', border:'1px solid #f59e0b', borderRadius:'8px', overflow:'hidden'}}>
              <div className="fm-amber-hd">Actividad Contexto — Mov Mina & Costos Unitarios</div>
              <div style={{background:'#fffbf0', padding:'8px 14px', fontSize:'.75rem', color:'#92400e',
                           borderBottom:'1px solid #f59e0b', fontStyle:'italic'}}>
                Act. Mina = ΔMovMina × CostoUnit_Mina × (exp_TC×TC_ppto/TC_real + (1−exp_TC)) — análogo para Concentradora
              </div>
              <div style={{padding:'14px'}}>
                {/* Mov Mina KPIs */}
                <div style={{marginBottom:'14px'}}>
                  <div style={{fontWeight:700, fontSize:'.8rem', color:'#92400e', marginBottom:'6px'}}>
                    KPIs Movimiento Mina (suma)
                  </div>
                  <div style={{display:'flex', flexDirection:'column', gap:'5px'}}>
                    {movKpis.map((item, idx) => (
                      <div key={idx} style={{display:'flex', gap:'6px', alignItems:'center'}}>
                        <input list="pq-all" value={item} onChange={e => setActCtxKpiItem(idx, e.target.value)}
                          className="fm-amber-inp" placeholder="KPI en parquet…"/>
                        {movKpis.length > 1 && (
                          <button onClick={() => removeActCtxKpiItem(idx)}
                            style={{background:'var(--red)',color:'white',border:'none',
                                    borderRadius:'4px',width:'22px',height:'22px',cursor:'pointer',fontWeight:700}}>−</button>
                        )}
                      </div>
                    ))}
                    <button onClick={addActCtxKpiItem}
                      style={{alignSelf:'flex-start', background:'none', border:'1px dashed #f59e0b',
                              color:'#92400e', borderRadius:'4px', padding:'3px 10px',
                              cursor:'pointer', fontSize:'.78rem', fontWeight:700}}>+ agregar KPI</button>
                  </div>
                </div>

                {/* Procesamiento KPI */}
                <div style={{marginBottom:'14px'}}>
                  <div style={{fontWeight:700, fontSize:'.8rem', color:'#92400e', marginBottom:'4px'}}>
                    KPI Procesamiento (base Concentradora)
                  </div>
                  <input list="pq-all" value={ac.procesamiento_kpi || ''} onChange={e => setActCtx('procesamiento_kpi', e.target.value)}
                    className="fm-amber-inp" placeholder="KPI en parquet…"/>
                </div>

                {/* Unit costs */}
                <div style={{fontWeight:700, fontSize:'.8rem', color:'#92400e', marginBottom:'8px'}}>
                  Costos Unitarios Budget (US$/kt) — ajuste TC desde Parámetros Financieros
                </div>
                <div style={{display:'flex', gap:'20px', flexWrap:'wrap'}}>
                  {[
                    ['Mina (US$/kt mov)', 'costo_unitario_mina'],
                    ['Concentradora (US$/kt proc)', 'costo_unitario_conc'],
                    ['Hidro (US$/kt)', 'costo_unitario_hidro'],
                  ].map(([lbl, field]) => (
                    <div key={field} style={{display:'flex', flexDirection:'column', gap:'3px'}}>
                      <label style={{fontSize:'.75rem', fontWeight:600, color:'#92400e'}}>{lbl}</label>
                      <input type="number" step="0.01"
                        value={ac[field] == null ? '' : ac[field]}
                        onChange={e => setActCtx(field, e.target.value === '' ? null : parseFloat(e.target.value))}
                        className="fm-num-inp" placeholder="no configurado"/>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          );
        })()}
      </div>
    </div>
  );
}

/* ─── Explicaciones: module-level helpers (stable references across renders) ─── */
const EXP_TBL = {width:'100%', borderCollapse:'collapse', fontSize:'.8rem', tableLayout:'fixed'};
const EXP_CKpi  = {padding:'4px 8px', fontWeight:500, fontSize:'.8rem'};
const EXP_CUnit = {padding:'3px 6px', color:'#888', textAlign:'center', fontSize:'.73rem', whiteSpace:'nowrap'};
const EXP_CVal  = {padding:'3px 8px', textAlign:'right', fontSize:'.79rem', whiteSpace:'nowrap'};
const EXP_CEf   = {padding:'3px 8px', textAlign:'right', fontSize:'.79rem', whiteSpace:'nowrap', width:'90px'};

function expFmtN(v) {
  if (v == null) return <span style={{color:'#bbb'}}>—</span>;
  return Number(v).toLocaleString('es-CL', {maximumFractionDigits:3});
}

function ExpTblHead({title}) {
  const thSt = {padding:'5px 8px', fontSize:'.72rem', color:'white', background:'#2d5a6e', fontWeight:700, whiteSpace:'nowrap'};
  return (
    <thead>
      <tr>
        <th style={{...thSt, textAlign:'left', minWidth:'140px', fontSize:'.8rem', background:'#1A3A4A', padding:'7px 10px', letterSpacing:'.03em'}}>{title}</th>
        <th style={{...thSt, textAlign:'center', width:'64px'}}>Ud.</th>
        <th style={{...thSt, textAlign:'right', width:'88px'}}>Real</th>
        <th style={{...thSt, textAlign:'right', width:'88px'}}>Ppto</th>
        <th style={{...thSt, textAlign:'right', width:'90px'}}>Efecto</th>
      </tr>
    </thead>
  );
}

function ExpSecHd({label, total, cols=5}) {
  return (
    <tr>
      <td colSpan={cols} style={{
        background:'#1A3A4A', color:'white', fontWeight:700,
        padding:'5px 8px 5px 10px', fontSize:'.72rem',
        letterSpacing:'.05em', textTransform:'uppercase',
      }}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
          <span>{label}</span>
          {total != null && <span style={{fontWeight:700, fontSize:'.79rem', textTransform:'none', letterSpacing:0}}>{total}</span>}
        </div>
      </td>
    </tr>
  );
}

function ExpRow({label, unit, real, ppto, efNode, alt, indent}) {
  const bg = alt ? '#f8fafb' : 'white';
  return (
    <tr style={{background:bg}}>
      <td style={{...EXP_CKpi, background:bg, paddingLeft: indent ? '28px' : undefined}}>{label}</td>
      <td style={EXP_CUnit}>{unit}</td>
      <td style={EXP_CVal}>{expFmtN(real)}</td>
      <td style={EXP_CVal}>{expFmtN(ppto)}</td>
      <td style={EXP_CEf}>{efNode}</td>
    </tr>
  );
}

/* ─── Tab: Explicaciones ─── */
function ExplicacionesTab({period}) {
  const {a1fin, m1fin} = period;
  const [company, setCompany] = useState('MLP');
  const [año, setAño] = useState(a1fin);
  const [mes, setMes] = useState(m1fin);
  const [pnl, setPnl] = useState('ytd');
  const [data, loading, error, run] = useAsyncState();

  function cargar() {
    run(apiGet(`/api/explicaciones/${company}?año=${año}&mes=${mes}`));
  }

  const pd     = data?.data?.[pnl];
  const cuProd = pd?.cu_prod_real;

  const toCLB = efKUS => {
    if (efKUS == null || cuProd == null || cuProd === 0) return null;
    return efKUS * 100 / (cuProd * 2204.62);
  };

  const sumCLB = rows => {
    let tot = null;
    for (const r of rows) {
      const v = toCLB(r.efecto_kus);
      if (v != null) tot = (tot||0) + v;
    }
    return tot;
  };
  const sumKtCuf = rows => {
    let tot = null;
    for (const r of rows) {
      if (r.efecto_ktcuf != null) tot = (tot||0) + r.efecto_ktcuf;
    }
    return tot;
  };

  const fmtCLB = v => {
    if (v == null) return <span style={{color:'#bbb'}}>—</span>;
    const color = v < 0 ? 'var(--red)' : v > 0 ? '#059669' : 'inherit';
    return <span style={{color, fontWeight:700}}>{v >= 0 ? '+' : ''}{v.toFixed(1)} c/lb</span>;
  };
  const fmtKtCuf = v => {
    if (v == null) return <span style={{color:'#bbb'}}>—</span>;
    const color = v < 0 ? 'var(--red)' : v > 0 ? '#059669' : 'inherit';
    return <span style={{color, fontWeight:700}}>{v >= 0 ? '+' : ''}{v.toFixed(1)} ktCuf</span>;
  };

  return (
    <div className="main">
      {/* Controls */}
      <div className="card">
        <div className="card-title">Explicaciones</div>
        <div className="company-tabs">
          {COMPANIES.map(c => (
            <button key={c} className={`company-tab ${company===c?'active':''}`} onClick={()=>setCompany(c)}>{c}</button>
          ))}
        </div>
        <div style={{display:'flex', gap:'12px', flexWrap:'wrap', alignItems:'flex-end', marginTop:'12px'}}>
          <div className="form-group">
            <label>Año</label>
            <select value={año} onChange={e=>setAño(Number(e.target.value))}>
              {RANGE_YEARS.map(a=><option key={a}>{a}</option>)}
            </select>
          </div>
          <div className="form-group">
            <label>Mes</label>
            <select value={mes} onChange={e=>setMes(Number(e.target.value))}>
              {MESES.slice(1).map((m,i)=><option key={i+1} value={i+1}>{m}</option>)}
            </select>
          </div>
          <button className="btn btn-primary" onClick={cargar} disabled={loading} style={{height:'38px'}}>
            {loading ? <><span className="spin"/>Cargando…</> : 'Cargar'}
          </button>
          {data && (
            <div style={{display:'flex', gap:'6px', alignSelf:'flex-end'}}>
              {[['ytd','YTD'],['mes','Mes']].map(([k,lbl]) => (
                <button key={k} onClick={()=>setPnl(k)} style={{
                  padding:'6px 18px', border:'2px solid', borderRadius:'6px',
                  cursor:'pointer', fontWeight:700, fontSize:'.86rem',
                  borderColor: pnl===k ? 'var(--teal)' : '#ddd',
                  background:  pnl===k ? 'var(--teal)' : 'white',
                  color:       pnl===k ? 'white' : '#666',
                }}>{lbl}</button>
              ))}
            </div>
          )}
        </div>
        {error && <p className="err" style={{marginTop:'12px'}}>{error}</p>}
      </div>

      {pd && (() => {
        const piTot   = sumCLB(pd.precio_insumos);
        const rendTot = sumCLB(pd.rendimiento);
        const prodTot = sumKtCuf(pd.produccion);
        return (
          <div className="card">
            <div style={{overflowX:'auto'}}>
              <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px', minWidth:'640px'}}>

                {/* ── INSUMOS ── */}
                <table style={EXP_TBL}>
                  <ExpTblHead title="Insumos"/>
                  <tbody>
                    <ExpSecHd label="Ajuste Monetario"/>
                    {pd.ajuste_monetario.map((r,i) => (
                      <ExpRow key={i} alt={i%2!==0} label={r.label} unit={r.unit}
                        real={r.real} ppto={r.ppto} efNode={fmtCLB(toCLB(r.efecto_kus))}/>
                    ))}

                    <ExpSecHd label="Precio Insumos" total={fmtCLB(piTot)}/>
                    {pd.precio_insumos.map((r,i) => (
                      <ExpRow key={i} alt={i%2!==0} label={r.label} unit={r.unit}
                        real={r.real} ppto={r.ppto} efNode={fmtCLB(toCLB(r.efecto_kus))}/>
                    ))}

                    <ExpSecHd label="Rendimiento" total={fmtCLB(rendTot)}/>
                    {pd.rendimiento.map((r,i) => (
                      <ExpRow key={i} alt={i%2!==0} label={r.label} unit={r.unit}
                        real={r.real} ppto={r.ppto} efNode={fmtCLB(toCLB(r.efecto_kus))}/>
                    ))}
                  </tbody>
                </table>

                {/* ── ACTIVIDAD ── */}
                <table style={EXP_TBL}>
                  <ExpTblHead title="Actividad"/>
                  <tbody>
                    <ExpSecHd label="Producción" total={fmtKtCuf(prodTot)}/>
                    {pd.produccion.map((r,i) => (
                      <ExpRow key={i} alt={i%2!==0} label={r.label} unit={r.unit}
                        real={r.real} ppto={r.ppto} efNode={fmtKtCuf(r.efecto_ktcuf)}/>
                    ))}

                    <ExpSecHd label="Movimiento Mina" total={fmtCLB(toCLB(pd.mov_mina.efecto_kus))}/>
                    <ExpRow label="Movimiento total Mina" unit="kt"
                      real={pd.mov_mina.real} ppto={pd.mov_mina.ppto}
                      efNode={fmtCLB(toCLB(pd.mov_mina.efecto_kus))}/>

                    <ExpSecHd label="Desarrollo Mina" total={fmtCLB(toCLB(pd.desarrollo_mina.efecto_kus))}/>
                    <ExpRow label="Tonelaje" unit="kt"
                      real={pd.desarrollo_mina.tonelaje_real} ppto={pd.desarrollo_mina.tonelaje_ppto}
                      efNode={fmtCLB(toCLB(pd.desarrollo_mina.tonelaje_efecto_kus))}/>
                    <ExpRow label="Costo unitario" unit="US$/t"
                      real={pd.desarrollo_mina.cu_real} ppto={pd.desarrollo_mina.cu_ppto}
                      efNode={fmtCLB(toCLB(pd.desarrollo_mina.cu_efecto_kus))}/>
                  </tbody>
                </table>

              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

/* ─── Tab: Costos Ajustados ─── */
function CostosAjustadosTab({period}) {
  const {a1fin, m1fin} = period;
  const [company, setCompany] = useState('MLP');
  const [data, setData]       = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError]     = useState('');

  useEffect(() => {
    if (!a1fin || !m1fin) return;
    setLoading(true); setError(''); setData(null);
    apiGet(`/api/costos-ajustados/${company}?año=${a1fin}&mes=${m1fin}`)
      .then(d => setData(d))
      .catch(e => setError(e.message || 'Error'))
      .finally(() => setLoading(false));
  }, [company, a1fin, m1fin]);

  const fmtV = v => {
    if (v == null) return <span style={{color:'#ccc'}}>—</span>;
    const n = Number(v) / 1000;
    if (isNaN(n)) return '—';
    return n.toLocaleString('es-CL', {minimumFractionDigits:1, maximumFractionDigits:1});
  };
  const fmtD = v => {
    if (v == null) return <span style={{color:'#ccc'}}>—</span>;
    const n = Number(v) / 1000;
    if (isNaN(n)) return '—';
    const color = n < 0 ? '#059669' : n > 0 ? '#dc2626' : '#555';
    return <span style={{color, fontWeight:'700'}}>{n.toLocaleString('es-CL', {minimumFractionDigits:1, maximumFractionDigits:1})}</span>;
  };

  const TH  = {background:'var(--navy)', color:'white', padding:'6px 8px', textAlign:'right', fontSize:'.75rem', whiteSpace:'nowrap', fontWeight:'600'};
  const TD  = {padding:'4px 8px', textAlign:'right', fontSize:'.8rem', whiteSpace:'nowrap', borderLeft:'1px solid #f0f0f0'};
  const SEP = {borderRight:'3px solid #9ca3af'};

  function Cells({m, y, bold=false, bg}) {
    const s = bold ? {...TD, fontWeight:'700'} : TD;
    const bs = bg ? {...s, background:bg} : s;
    return <>
      <td style={bs}>{fmtV(m?.real)}</td>
      <td style={bs}>{fmtV(m?.ppto)}</td>
      <td style={{...bs, fontWeight: bold ? '800' : '600'}}>{fmtV(m?.ppto_aj_tot)}</td>
      <td style={{...bs, ...SEP}}>{fmtD(m?.dif)}</td>
      <td style={bs}>{fmtV(y?.real)}</td>
      <td style={bs}>{fmtV(y?.ppto)}</td>
      <td style={{...bs, fontWeight: bold ? '800' : '600'}}>{fmtV(y?.ppto_aj_tot)}</td>
      <td style={bs}>{fmtD(y?.dif)}</td>
    </>;
  }

  return (
    <div className="main">
      <div className="card">
        <div style={{display:'flex', alignItems:'center', gap:'16px', marginBottom:'12px', flexWrap:'wrap'}}>
          <div className="card-title" style={{margin:0}}>Costos Ajustados por FX / IPC</div>
          <div className="company-tabs" style={{margin:0}}>
            {COMPANIES.map(c=>(
              <button key={c} className={`company-tab ${company===c?'active':''}`} onClick={()=>setCompany(c)}>{c}</button>
            ))}
          </div>
        </div>
        <p style={{fontSize:'.78rem', color:'#888', marginBottom:'12px'}}>
          <strong>{MESES[m1fin]} {a1fin}</strong> · adj_factor = (FX_r/FX_b)×(IPC_r/IPC_b) · PptoAjTot = Ppto×%F×adj + Ppto×%V · Dif = Real − PptoAjTot · <em>US$m</em>
        </p>

        {loading && <p style={{color:'#aaa'}}><span className="spin"/>Calculando…</p>}
        {error   && <p className="err">{error}</p>}

        {!loading && !error && data && (
          <div className="tbl-wrap">
            <table style={{fontSize:'.8rem', borderCollapse:'collapse'}}>
              <thead>
                <tr>
                  <th style={{...TH, textAlign:'left', position:'sticky', left:0, zIndex:2, minWidth:'230px', background:'var(--navy)', borderRight:'1px solid #2a4a5a'}} rowSpan={2}>Sub-área</th>
                  <th style={{...TH, textAlign:'center', background:'#1A5F6E'}} colSpan={4}>Mes {MESES[m1fin]} {a1fin}</th>
                  <th style={{...TH, textAlign:'center', background:'#1A4E5A'}} colSpan={4}>YTD {a1fin}</th>
                </tr>
                <tr>
                  {['Real','Ppto','Ppto Aj Tot','Dif.','Real','Ppto','Ppto Aj Tot','Dif.'].map((h,i)=>(
                    <th key={i} style={{...TH, background: i<4 ? '#1A5F6E' : '#1A4E5A', ...(i===3?SEP:{})}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {(data.grupos || []).map(grp => {
                  const sas = grp.subareas || [];
                  // Single-subarea groups (leaf nodes): show only the group row, no indent
                  const isLeaf = sas.length <= 1;
                  return (
                  <React.Fragment key={grp.key}>
                    <tr>
                      <td style={{background:'#1A3A4A', color:'white', fontWeight:'700', padding:'6px 10px', position:'sticky', left:0, zIndex:1, borderRight:'1px solid #2a4a5a', fontSize:'.82rem'}}>
                        {grp.label}
                      </td>
                      <Cells m={grp.total?.mes} y={grp.total?.ytd} bold={true} bg='#1A3A4A'/>
                    </tr>
                    {!isLeaf && sas.map(sa => {
                      const dim = !sa.mapped;
                      const lblSt = {padding:'4px 10px 4px 24px', fontSize:'.8rem', position:'sticky', left:0, zIndex:1,
                        background:'white', borderRight:'1px solid #eee',
                        color: dim ? '#bbb' : '#374151', fontStyle: dim ? 'italic' : 'normal', whiteSpace:'nowrap'};
                      const tdSt = dim ? {...TD, color:'#ccc'} : TD;
                      return (
                        <tr key={sa.key}>
                          <td style={lblSt}>{sa.label}</td>
                          <td style={tdSt}>{fmtV(sa.mes?.real)}</td>
                          <td style={tdSt}>{fmtV(sa.mes?.ppto)}</td>
                          <td style={{...tdSt, fontWeight:'600'}}>{fmtV(sa.mes?.ppto_aj_tot)}</td>
                          <td style={{...tdSt, ...SEP}}>{fmtD(sa.mes?.dif)}</td>
                          <td style={tdSt}>{fmtV(sa.ytd?.real)}</td>
                          <td style={tdSt}>{fmtV(sa.ytd?.ppto)}</td>
                          <td style={{...tdSt, fontWeight:'600'}}>{fmtV(sa.ytd?.ppto_aj_tot)}</td>
                          <td style={tdSt}>{fmtD(sa.ytd?.dif)}</td>
                        </tr>
                      );
                    })}
                  </React.Fragment>
                  );
                })}

                {/* Costo On Site */}
                <tr style={{borderTop:'2px solid #e5e7eb'}}>
                  <td style={{padding:'6px 10px', fontWeight:'700', position:'sticky', left:0, zIndex:1, background:'#dbeafe', borderRight:'1px solid #eee', fontSize:'.82rem'}}>
                    Costo On Site
                  </td>
                  <Cells m={data.totales?.costo_onsite?.mes} y={data.totales?.costo_onsite?.ytd} bold={true} bg='#dbeafe'/>
                </tr>

                {/* Summary rows */}
                <tr>
                  <td colSpan={9} style={{background:'#f3f4f6', padding:'4px 10px', fontWeight:'600', fontSize:'.72rem', color:'#6b7280', borderTop:'2px solid #e5e7eb', letterSpacing:'.04em', textTransform:'uppercase'}}>
                    Otros conceptos
                  </td>
                </tr>
                {(data.summary || []).map(sr => {
                  const dim = !sr.mapped;
                  const lblSt = {padding:'4px 10px', fontSize:'.8rem', position:'sticky', left:0, zIndex:1,
                    background:'#fffbf0', borderRight:'1px solid #eee',
                    color: dim ? '#bbb' : '#374151', fontStyle: dim ? 'italic' : 'normal', whiteSpace:'nowrap'};
                  const tdSt = {...TD, background:'#fffbf0', ...(dim ? {color:'#ccc'} : {})};
                  return (
                    <tr key={sr.key}>
                      <td style={lblSt}>{sr.label}</td>
                      <td style={tdSt}>{fmtV(sr.mes?.real)}</td>
                      <td style={tdSt}>{fmtV(sr.mes?.ppto)}</td>
                      <td style={{...tdSt, fontWeight:'600'}}>{fmtV(sr.mes?.ppto_aj_tot)}</td>
                      <td style={{...tdSt, ...SEP}}>{fmtD(sr.mes?.dif)}</td>
                      <td style={tdSt}>{fmtV(sr.ytd?.real)}</td>
                      <td style={tdSt}>{fmtV(sr.ytd?.ppto)}</td>
                      <td style={{...tdSt, fontWeight:'600'}}>{fmtV(sr.ytd?.ppto_aj_tot)}</td>
                      <td style={tdSt}>{fmtD(sr.ytd?.dif)}</td>
                    </tr>
                  );
                })}

                {/* Computed totals */}
                <tr><td colSpan={9} style={{padding:'2px', borderTop:'2px solid #e5e7eb'}}></td></tr>
                {[
                  {key:'pre_credito', label:'On Site + TC/RC + Comercialización', bg:'#f8fafc'},
                  {key:'c1',          label:'C1 (Pre-crédito − Subproductos)',    bg:'#f0f9f9'},
                  {key:'c2',          label:'C2 (C1 + D&A)',                      bg:'#ecfdf5'},
                  {key:'c3',          label:'C3 (C2 + Otros Fin.)',               bg:'#d1fae5'},
                ].map(({key, label, bg}) => (
                  <tr key={key}>
                    <td style={{padding:'6px 10px', fontWeight:'700', position:'sticky', left:0, zIndex:1, background:bg, borderRight:'1px solid #eee', fontSize:'.82rem'}}>
                      {label}
                    </td>
                    <Cells m={data.totales?.[key]?.mes} y={data.totales?.[key]?.ytd} bold={true} bg={bg}/>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}

        {!loading && !error && !data && (
          <p style={{color:'#aaa', fontSize:'.9rem'}}>Selecciona período para calcular.</p>
        )}
      </div>
    </div>
  );
}

/* ─── Tab: Costos Ajustados Mes (CM) ─── */
function CostosAjMesTab({period}) {
  const {a1fin, m1fin} = period;
  const [company, setCompany] = useState('MLP');
  const [data, setData]       = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError]     = useState('');

  useEffect(() => {
    if (!a1fin || !m1fin) return;
    setLoading(true); setError(''); setData(null);
    apiGet(`/api/costos-ajustados/${company}/monthly?año=${a1fin}&mes_cierre=${m1fin}`)
      .then(d => setData(d))
      .catch(e => setError(e.message || 'Error'))
      .finally(() => setLoading(false));
  }, [company, a1fin, m1fin]);

  const MO_S = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const FS   = '.68rem';

  const fmtV = v => {
    if (v == null) return <span style={{color:'#ccc'}}>—</span>;
    const n = Number(v) / 1000;
    return isNaN(n) ? '—' : n.toLocaleString('es-CL', {minimumFractionDigits:1, maximumFractionDigits:1});
  };
  const fmtE = v => {
    if (v == null) return <span style={{color:'#ccc'}}>—</span>;
    const n = Number(v) / 1000;
    if (isNaN(n)) return '—';
    const c = n < 0 ? '#059669' : n > 0 ? '#dc2626' : '#555';
    return <span style={{color:c, fontWeight:'700'}}>{n.toLocaleString('es-CL', {minimumFractionDigits:1, maximumFractionDigits:1})}</span>;
  };
  const fmtPct = v => v == null ? '' : `${Math.round((v || 0) * 100)}%`;

  const TDB = {padding:'2px 4px', textAlign:'right', whiteSpace:'nowrap', fontSize:FS, borderLeft:'1px solid #f0f0f0'};
  const THB = {padding:'3px 5px', textAlign:'right', whiteSpace:'nowrap', fontWeight:'600', fontSize:FS, color:'white'};
  const BDR = {borderRight:'2px solid #9ca3af'};

  const C_PPTO = '#1A3A4A'; const C_TC = '#1A5F6E'; const C_IPC = '#3d5a80'; const C_CPI = '#6b4c99';

  // 2(%F/%V) + 14(PPTO) + 16(TC) + 16(IPC) + 16(CPI) = 64 data cols
  const DATA_COLS = 64;

  function RowData({row, fijo, bold=false, bg}) {
    const bs = bold ? {...TDB, fontWeight:'700', background:bg} : (bg ? {...TDB, background:bg} : TDB);
    if (!row || !row.mapped) {
      return <>
        <td style={{...TDB, background:'#f9fafb'}}></td>
        <td style={{...TDB, background:'#f9fafb', ...BDR}}></td>
        <td colSpan={62} style={{...TDB, color:'#ccc', textAlign:'center', fontStyle:'italic'}}>—</td>
      </>;
    }
    const p   = row.ppto    || Array(12).fill(null);
    const atc = row.aj_tc   || Array(12).fill(null);
    const ai  = row.aj_ipc  || Array(12).fill(null);
    const ac  = row.aj_cpi  || Array(12).fill(null);
    const mc1 = m1fin - 1; // 0-indexed current month

    return <>
      {/* %Fijo / %Var */}
      <td style={{...bs, textAlign:'center', background:(bg||'#f9fafb')}}>{fmtPct(fijo)}</td>
      <td style={{...bs, textAlign:'center', background:(bg||'#f9fafb'), ...BDR}}>{fmtPct(fijo == null ? null : 1 - fijo)}</td>
      {/* PPTO */}
      {p.map((v,i) => <td key={`p${i}`} style={{...bs, ...(i===mc1?{background:'#d4e8ee'}:{})}}>{fmtV(v)}</td>)}
      <td style={{...bs, background:'#c8e0e8', fontWeight:'700'}}>{fmtV(row.ppto_mes)}</td>
      <td style={{...bs, background:'#c8e0e8', fontWeight:'700', ...BDR}}>{fmtV(row.ppto_acum)}</td>
      {/* Aj TC */}
      {atc.map((v,i) => <td key={`tc${i}`} style={{...bs, ...(i===mc1?{background:'#d4ede8'}:{})}}>{fmtV(v)}</td>)}
      <td style={{...bs, background:'#b8dfd8', fontWeight:'700'}}>{fmtV(row.aj_tc_mes)}</td>
      <td style={{...bs, background:'#b8dfd8', fontWeight:'700'}}>{fmtV(row.aj_tc_acum)}</td>
      <td style={bs}>{fmtE(row.ef_tc_mes)}</td>
      <td style={{...bs, ...BDR}}>{fmtE(row.ef_tc_acum)}</td>
      {/* Aj IPC */}
      {ai.map((v,i) => <td key={`ipc${i}`} style={{...bs, ...(i===mc1?{background:'#dce8f5'}:{})}}>{fmtV(v)}</td>)}
      <td style={{...bs, background:'#c8daf0', fontWeight:'700'}}>{fmtV(row.aj_ipc_mes)}</td>
      <td style={{...bs, background:'#c8daf0', fontWeight:'700'}}>{fmtV(row.aj_ipc_acum)}</td>
      <td style={bs}>{fmtE(row.ef_ipc_mes)}</td>
      <td style={{...bs, ...BDR}}>{fmtE(row.ef_ipc_acum)}</td>
      {/* Aj CPI */}
      {ac.map((v,i) => <td key={`cpi${i}`} style={{...bs, ...(i===mc1?{background:'#ece5f8'}:{})}}>{fmtV(v)}</td>)}
      <td style={{...bs, background:'#ddd0f0', fontWeight:'700'}}>{fmtV(row.aj_cpi_mes)}</td>
      <td style={{...bs, background:'#ddd0f0', fontWeight:'700'}}>{fmtV(row.aj_cpi_acum)}</td>
      <td style={bs}>{fmtE(row.ef_cpi_mes)}</td>
      <td style={{...bs, ...BDR}}>{fmtE(row.ef_cpi_acum)}</td>
    </>;
  }

  return (
    <div className="main">
      <div className="card" style={{overflow:'hidden'}}>
        <div style={{display:'flex', alignItems:'center', gap:'16px', marginBottom:'12px', flexWrap:'wrap'}}>
          <div className="card-title" style={{margin:0}}>Costos Ajustados Mes (CM)</div>
          <div className="company-tabs" style={{margin:0}}>
            {COMPANIES.map(c=>(
              <button key={c} className={`company-tab ${company===c?'active':''}`} onClick={()=>setCompany(c)}>{c}</button>
            ))}
          </div>
        </div>
        <p style={{fontSize:'.75rem', color:'#888', marginBottom:'10px'}}>
          PPTO mensual {a1fin} + Ajuste TC/IPC/CPI · mes cierre: <strong>{MESES[m1fin]}</strong> · <em>US$m</em> ·
          adj_tc = exp×TC_b/TC_r+(1-exp) · adj_ipc = exp×IPC_r/IPC_b+(1-exp) · adj_cpi = exp+(1-exp)×CPI_r/CPI_b
        </p>

        {loading && <p style={{color:'#aaa'}}><span className="spin"/>Calculando…</p>}
        {error   && <p className="err">{error}</p>}

        {!loading && !error && data && (() => {
          const LBL = {padding:'3px 8px', fontWeight:'600', position:'sticky', left:0, zIndex:1,
                       background:'white', borderRight:'1px solid #eee', whiteSpace:'nowrap', fontSize:FS};
          const GRP = {padding:'4px 8px', fontWeight:'700', position:'sticky', left:0, zIndex:1,
                       color:'white', background:C_PPTO, borderRight:'1px solid #2a4a5a', whiteSpace:'nowrap', fontSize:FS};
          const TOT = {padding:'4px 8px', fontWeight:'700', position:'sticky', left:0, zIndex:1,
                       borderRight:'1px solid #eee', whiteSpace:'nowrap', fontSize:FS};

          return (
            <div style={{overflowX:'auto'}}>
              <table style={{fontSize:FS, borderCollapse:'collapse', minWidth:'2200px'}}>
                <colgroup>
                  <col style={{minWidth:'200px'}}/>
                </colgroup>
                <thead>
                  <tr>
                    <th rowSpan={2} style={{...THB, textAlign:'left', position:'sticky', left:0, zIndex:3,
                      background:C_PPTO, minWidth:'200px', padding:'4px 8px', borderRight:'1px solid #2a4a5a'}}>
                      Sub-área
                    </th>
                    <th colSpan={2} style={{...THB, background:'#374151', textAlign:'center', ...BDR}}>%</th>
                    <th colSpan={14} style={{...THB, background:C_PPTO, textAlign:'center', ...BDR}}>PPTO {a1fin}</th>
                    <th colSpan={16} style={{...THB, background:C_TC,  textAlign:'center', ...BDR}}>PPTO Ajustado TC + Efecto TC</th>
                    <th colSpan={16} style={{...THB, background:C_IPC, textAlign:'center', ...BDR}}>PPTO Ajustado IPC + Efecto IPC</th>
                    <th colSpan={16} style={{...THB, background:C_CPI, textAlign:'center', ...BDR}}>PPTO Ajustado CPI + Efecto CPI</th>
                  </tr>
                  <tr>
                    <th style={{...THB, background:'#374151', textAlign:'center'}}>Fijo</th>
                    <th style={{...THB, background:'#374151', textAlign:'center', ...BDR}}>Var</th>
                    {MO_S.map((m,i)=><th key={`hp${i}`} style={{...THB, background:i===m1fin-1?'#27687a':C_PPTO}}>{m}</th>)}
                    <th style={{...THB, background:'#1A5080'}}>Mes</th>
                    <th style={{...THB, background:'#1A5080', ...BDR}}>Acum</th>
                    {MO_S.map((m,i)=><th key={`htc${i}`} style={{...THB, background:i===m1fin-1?'#2e8090':C_TC}}>{m}</th>)}
                    <th style={{...THB, background:'#0d5060'}}>Mes</th>
                    <th style={{...THB, background:'#0d5060'}}>Acum</th>
                    <th style={{...THB, background:'#0a4050'}}>Ef Mes</th>
                    <th style={{...THB, background:'#0a4050', ...BDR}}>Ef Acum</th>
                    {MO_S.map((m,i)=><th key={`hipc${i}`} style={{...THB, background:i===m1fin-1?'#4a6a90':C_IPC}}>{m}</th>)}
                    <th style={{...THB, background:'#2d4a70'}}>Mes</th>
                    <th style={{...THB, background:'#2d4a70'}}>Acum</th>
                    <th style={{...THB, background:'#1d3a60'}}>Ef Mes</th>
                    <th style={{...THB, background:'#1d3a60', ...BDR}}>Ef Acum</th>
                    {MO_S.map((m,i)=><th key={`hcpi${i}`} style={{...THB, background:i===m1fin-1?'#7a5ca9':C_CPI}}>{m}</th>)}
                    <th style={{...THB, background:'#5a3c80'}}>Mes</th>
                    <th style={{...THB, background:'#5a3c80'}}>Acum</th>
                    <th style={{...THB, background:'#4a2c70'}}>Ef Mes</th>
                    <th style={{...THB, background:'#4a2c70', ...BDR}}>Ef Acum</th>
                  </tr>
                </thead>
                <tbody>
                  {(data.grupos || []).map(grp => {
                    const sas    = grp.subareas || [];
                    const isLeaf = sas.length <= 1;
                    return (
                      <React.Fragment key={grp.key}>
                        <tr>
                          <td style={GRP}>{grp.label}</td>
                          <RowData row={grp.total} fijo={null} bold={true} bg='#1A3A4A'/>
                        </tr>
                        {!isLeaf && sas.map(sa => {
                          const dim = !sa.mapped;
                          return (
                            <tr key={sa.key}>
                              <td style={{...LBL, paddingLeft:'18px', color: dim?'#bbb':'#374151', fontStyle: dim?'italic':'normal'}}>
                                {sa.label}
                              </td>
                              <RowData row={sa} fijo={sa.fijo} bold={false}/>
                            </tr>
                          );
                        })}
                      </React.Fragment>
                    );
                  })}

                  {/* Costo On Site */}
                  <tr style={{borderTop:'2px solid #e5e7eb'}}>
                    <td style={{...TOT, background:'#dbeafe'}}>Costo On Site</td>
                    <RowData row={data.totales?.costo_onsite} fijo={null} bold={true} bg='#dbeafe'/>
                  </tr>

                  {/* Summary separator */}
                  <tr>
                    <td colSpan={DATA_COLS+1} style={{background:'#f3f4f6', padding:'2px 8px', fontSize:'.65rem',
                      fontWeight:'600', color:'#6b7280', borderTop:'2px solid #e5e7eb',
                      letterSpacing:'.04em', textTransform:'uppercase'}}>Otros conceptos</td>
                  </tr>

                  {(data.summary || []).map(sr => {
                    const dim = !sr.mapped;
                    return (
                      <tr key={sr.key}>
                        <td style={{...LBL, background:'#fffbf0', color: dim?'#bbb':'#374151', fontStyle: dim?'italic':'normal'}}>
                          {sr.label}
                        </td>
                        <RowData row={sr} fijo={sr.fijo} bold={false} bg='#fffbf0'/>
                      </tr>
                    );
                  })}

                  <tr><td colSpan={DATA_COLS+1} style={{padding:'2px', borderTop:'2px solid #e5e7eb'}}></td></tr>
                  {[
                    {key:'pre_credito', label:'On Site + TC/RC + Comercialización', bg:'#f8fafc'},
                    {key:'c1',          label:'C1 (Pre-crédito − Subproductos)',    bg:'#f0f9f9'},
                    {key:'c2',          label:'C2 (C1 + D&A)',                      bg:'#ecfdf5'},
                    {key:'c3',          label:'C3 (C2 + Otros Fin.)',               bg:'#d1fae5'},
                  ].map(({key, label, bg}) => (
                    <tr key={key}>
                      <td style={{...TOT, background:bg}}>{label}</td>
                      <RowData row={data.totales?.[key]} fijo={null} bold={true} bg={bg}/>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          );
        })()}

        {!loading && !error && !data && (
          <p style={{color:'#aaa', fontSize:'.9rem'}}>Selecciona período para calcular.</p>
        )}
      </div>
    </div>
  );
}

/* ─── Root App ─── */
function App() {
  const [tab,   setTab]   = useState('viz');
  const [tipos, setTipos] = useState([]);
  const [tipo1, setTipo1] = useState('');
  const [a1ini, setA1ini] = useState(DEFAULT_YR);
  const [m1ini, setM1ini] = useState(1);
  const [a1fin, setA1fin] = useState(DEFAULT_YR);
  const [m1fin, setM1fin] = useState(DEFAULT_MO);
  const [tipo2, setTipo2] = useState('');
  const [a2ini, setA2ini] = useState(DEFAULT_YR);
  const [m2ini, setM2ini] = useState(1);

  useEffect(() => {
    apiGet('/api/periodos').then(p => {
      const ts = p.tipos || [];
      setTipos(ts);
      const t1 = ts.find(t=>t.toLowerCase().includes('real')) || ts[0] || '';
      const t2 = ts.find(t=>t.toLowerCase().includes('ppto') || t.toLowerCase().includes('presupuesto')) || ts.find(t=>t!==t1) || ts[0] || '';
      setTipo1(t1); setTipo2(t2);
    }).catch(()=>{});
  }, []);

  const dur       = (a1fin - a1ini) * 12 + (m1fin - m1ini);
  const m2fin_raw = m2ini + dur;
  const a2fin     = a2ini + Math.floor((m2fin_raw - 1) / 12);
  const m2fin     = ((m2fin_raw - 1) % 12) + 1;

  const period  = { tipo1, a1ini, m1ini, a1fin, m1fin, tipo2, a2ini, m2ini, a2fin, m2fin };
  const setters = { setTipo1, setA1ini, setM1ini, setA1fin, setM1fin, setTipo2, setA2ini, setM2ini };

  return (
    <>
      <Header tab={tab} setTab={setTab} period={period}/>
      {(tab==='viz' || tab==='analisis' || tab==='params' || tab==='costos_aj' || tab==='cm') && <PeriodBar period={period} setters={setters} tipos={tipos}/>}
      {tab==='mapeos'        && <MapeosTab/>}
      {tab==='viz'           && <VisualizarTab period={period} tipos={tipos}/>}
      {tab==='analisis'      && <AnalisisCostoTab period={period}/>}
      {tab==='costos_aj'     && <CostosAjustadosTab period={period}/>}
      {tab==='cm'            && <CostosAjMesTab period={period}/>}
      {tab==='params'        && <ParamsTab period={period}/>}
      {tab==='formulas'      && <FormulasTab/>}
      {tab==='explicaciones' && <ExplicacionesTab period={period}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
