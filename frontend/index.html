<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robot 2026 — Automatización de Reportes v2</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1A3A4A; }
    :root { --teal:#1A7080; --teal-lt:#4EC3C3; --amber:#F5A800; --red:#C8312A; --navy:#1A3A4A; --gray:#E8E8E8; }

    /* Header */
    .header { background:linear-gradient(135deg, #1A7080 0%, #4EC3C3 100%); color:white; padding:14px 32px; display:flex; align-items:center; justify-content:space-between; }
    .header h1 { font-size:1.2rem; font-weight:700; }
    .header p  { color:var(--teal-lt); font-size:.82rem; margin-top:2px; }
    .nav-tabs { display:flex; gap:4px; }
    .nav-tab { padding:7px 18px; border-radius:6px; cursor:pointer; font-size:.88rem; font-weight:600; border:none; background:rgba(255,255,255,.1); color:rgba(255,255,255,.7); }
    .nav-tab.active { background:var(--teal); color:white; }
    .nav-tab:hover:not(.active) { background:rgba(255,255,255,.18); color:white; }

    /* Layout */
    .main { max-width:1100px; margin:0 auto; padding:24px 16px; display:flex; flex-direction:column; gap:16px; }
    .card { background:white; border-radius:10px; padding:22px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
    .card-title { font-size:.95rem; font-weight:700; color:var(--teal); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
    .card-title::before { content:''; display:inline-block; width:4px; height:16px; background:var(--teal); border-radius:2px; }

    /* Forms */
    .form-row { display:flex; flex-wrap:wrap; gap:16px; }
    .form-group { display:flex; flex-direction:column; gap:4px; min-width:110px; }
    .form-group label { font-size:.72rem; font-weight:700; color:#888; text-transform:uppercase; letter-spacing:.06em; }
    .form-group select { padding:8px 12px; border:2px solid var(--gray); border-radius:6px; font-size:.9rem; color:var(--navy); background:white; cursor:pointer; outline:none; }
    .form-group select:focus { border-color:var(--teal-lt); }

    /* Chips / checkboxes */
    .checkbox-row { display:flex; flex-wrap:wrap; gap:8px; }
    .chip { display:flex; align-items:center; gap:6px; padding:6px 14px; border:2px solid var(--gray); border-radius:20px; cursor:pointer; font-size:.875rem; font-weight:600; user-select:none; transition:all .15s; }
    .chip.on { background:var(--teal); border-color:var(--teal); color:white; }
    .chip input { display:none; }

    /* Buttons */
    .btn-row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
    .btn { padding:10px 22px; border:none; border-radius:6px; font-size:.9rem; font-weight:600; cursor:pointer; transition:opacity .15s; }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .btn-primary   { background:var(--teal); color:white; }
    .btn-secondary { background:var(--gray); color:var(--navy); }
    .btn-success   { background:#059669; color:white; }
    .btn-primary:hover:not(:disabled)   { background:#15606e; }
    .btn-secondary:hover:not(:disabled) { background:#d5d5d5; }
    .btn-success:hover:not(:disabled)   { background:#047857; }
    .btn-dl { background:var(--amber); color:var(--navy); text-decoration:none; display:inline-flex; align-items:center; gap:6px; padding:10px 22px; border-radius:6px; font-size:.9rem; font-weight:600; }
    .btn-dl:hover { opacity:.85; }

    /* Stats */
    .stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-bottom:12px; }
    .stat { text-align:center; padding:12px; background:#f8f9fa; border-radius:8px; }
    .stat-n { font-size:2rem; font-weight:800; color:var(--teal); }
    .stat-n.warn { color:var(--amber); }
    .stat-lbl { font-size:.72rem; color:#888; margin-top:2px; }
    .pills { display:flex; flex-wrap:wrap; gap:6px; }
    .pill { padding:3px 12px; border-radius:20px; font-size:.78rem; font-weight:700; }
    .pill-ok   { background:#d1fae5; color:#065f46; }
    .pill-warn { background:#fef3c7; color:#92400e; }

    /* Table */
    .tbl-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:.84rem; }
    th { background:var(--navy); color:white; padding:8px 12px; text-align:left; font-weight:600; white-space:nowrap; }
    td { padding:7px 12px; border-bottom:1px solid var(--gray); vertical-align:middle; }
    tr:hover td { background:#f8f9fa; }
    .badge { padding:2px 8px; border-radius:10px; font-size:.72rem; font-weight:700; white-space:nowrap; }
    .badge-ok   { background:#d1fae5; color:#065f46; }
    .badge-miss { background:#fee2e2; color:#991b1b; }
    .badge-partial { background:#fef3c7; color:#92400e; }

    /* Mapping input */
    .map-input { width:100%; padding:6px 10px; border:2px solid var(--gray); border-radius:6px; font-size:.84rem; outline:none; min-width:220px; }
    .map-input:focus { border-color:var(--teal-lt); }
    .map-input.mapped { border-color:#10b981; background:#f0fdf4; }

    /* Log */
    .log-box { background:var(--navy); border-radius:8px; padding:14px; max-height:180px; overflow-y:auto; font-family:monospace; font-size:.8rem; display:flex; flex-direction:column; gap:3px; }
    .li { color:#94a3b8; } .lok { color:#6ee7b7; } .lw { color:#fcd34d; } .ler { color:#fca5a5; }

    /* Misc */
    @keyframes spin { to { transform:rotate(360deg); } }
    .spin { display:inline-block; width:13px; height:13px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:5px; }
    .divider-lbl { font-size:.72rem; font-weight:700; color:#888; text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
    .company-tabs { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
    .company-tab { padding:6px 16px; border:2px solid var(--gray); border-radius:6px; cursor:pointer; font-weight:700; font-size:.88rem; background:white; }
    .company-tab.active { background:var(--teal); border-color:var(--teal); color:white; }
    .map-summary { font-size:.82rem; color:#666; margin-bottom:12px; }
    .map-summary strong { color:var(--teal); }

    /* ── Table utilities ── */
    .tbl-sec { background:#1A3A4A; color:white; font-weight:700; padding:5px 10px; font-size:.73rem; letter-spacing:.05em; text-transform:uppercase; }
    .tbl-subhd { background:#d4e8ee; color:#1A3A4A; font-weight:700; padding:4px 14px; font-size:.72rem; letter-spacing:.04em; text-transform:uppercase; border-top:1px solid #9ac8d8; border-bottom:1px solid #9ac8d8; }
    .tbl-amber { background:#92400e; color:white; font-weight:700; padding:7px 12px; font-size:.75rem; letter-spacing:.04em; text-transform:uppercase; }
    .tbl-th-c1 { padding:5px 8px; text-align:right; font-size:.7rem; color:white; background:#1A6575; white-space:nowrap; font-weight:600; }
    .tbl-th-c2 { padding:5px 8px; text-align:right; font-size:.7rem; color:white; background:#8a6000; white-space:nowrap; font-weight:600; }
    .tbl-kpi { padding:4px 10px; font-weight:600; position:sticky; left:0; background:inherit; z-index:1; border-right:1px solid #eee; white-space:nowrap; min-width:200px; }
    .tbl-ud { padding:4px 8px; color:#888; text-align:center; border-right:1px solid #eee; font-size:.76rem; }
    .tbl-val { padding:3px 7px; text-align:right; font-size:.76rem; white-space:nowrap; }
    .tbl-tot { padding:4px 10px; font-weight:700; background:#f0f9f9; position:sticky; left:0; z-index:1; border-right:1px solid #eee; white-space:nowrap; }
    .tbl-tot-val { padding:3px 7px; text-align:right; font-size:.76rem; font-weight:700; background:#f0f9f9; white-space:nowrap; }
    /* ── Visualizar KPI table ── */
    .viz-hcol { padding:5px 7px; text-align:right; font-size:.7rem; color:white; background:#1A3A4A; white-space:nowrap; font-weight:600; }
    .viz-col { padding:3px 7px; text-align:right; font-size:.76rem; white-space:nowrap; }
    .viz-kpi { padding:4px 10px; font-weight:600; position:sticky; left:0; z-index:1; border-right:1px solid #eee; vertical-align:middle; }
    .viz-unit { padding:4px 8px; color:#888; text-align:center; border-right:1px solid #eee; vertical-align:middle; }
    .viz-tag1 { padding:4px 7px; font-size:.7rem; font-weight:700; color:#4EC3C3; border-left:2px solid #4EC3C3; white-space:nowrap; text-align:center; background:#f4fdfd; }
    .viz-tag2 { padding:4px 7px; font-size:.7rem; font-weight:700; color:#F5A800; border-left:2px solid #F5A800; white-space:nowrap; text-align:center; background:#fffbf0; }
    .viz-mes1 { padding:3px 7px; text-align:right; font-size:.76rem; white-space:nowrap; background:#f0f9f9; font-weight:600; }
    .viz-mes2 { padding:3px 7px; text-align:right; font-size:.76rem; white-space:nowrap; background:#fef9ec; font-weight:600; }
    /* ── Params tab ── */
    .params-inp { width:68px; padding:3px 5px; border:1px solid #ddd; border-radius:4px; font-size:.8rem; text-align:right; }
    .params-td { padding:4px 6px; text-align:center; border-bottom:1px solid #f0f0f0; }
    /* ── Shared ── */
    .err  { color:var(--red); font-size:.88rem; margin-bottom:12px; }
    .hint { color:#aaa; }
    @media print {
      body > * { display:none !important; }
      #flash-print-area, #flash-print-area * { display:revert !important; }
      #flash-print-area { position:fixed; top:0; left:0; width:100%; }
      .header, .nav-tabs, button { display:none !important; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

const MESES = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio',
               'Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const COMPANIES = ['MLP','CEN','ANT','CMZ'];
const NOW = new Date();

/* ─── API helpers ─── */
async function apiGet(path) {
  const r = await fetch(path);
  if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail||'Error del servidor'); }
  return r.json();
}
async function apiPost(path, body) {
  const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail||'Error del servidor'); }
  return r.json();
}
async function apiPut(path, body) {
  const r = await fetch(path, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail||'Error del servidor'); }
  return r.json();
}
async function apiDelete(path) {
  const r = await fetch(path, { method:'DELETE' });
  if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail||'Error del servidor'); }
  return r.json();
}

/* ─── Custom hook: async state ─── */
function useAsyncState() {
  const [s, setS] = useState({ loading:false, error:'', data:null });
  const run = useCallback(async (promise) => {
    setS({ loading:true, error:'', data:null });
    try    { setS({ loading:false, error:'', data: await promise }); }
    catch(e){ setS({ loading:false, error:e.message||'Error', data:null }); }
  }, []);
  return [s.data, s.loading, s.error, run];
}

/* ─── Shared components ─── */
function Header({ tab, setTab, period }) {
  function excelUrl() {
    const enc = encodeURIComponent;
    const { tipo1, a1ini, m1ini, a1fin, m1fin, tipo2, a2ini, m2ini, a2fin, m2fin } = period;
    return `/api/export/excel?tipo1=${enc(tipo1)}&año1_ini=${a1ini}&mes1_ini=${m1ini}&año1_fin=${a1fin}&mes1_fin=${m1fin}`
         + `&tipo2=${enc(tipo2)}&año2_ini=${a2ini}&mes2_ini=${m2ini}&año2_fin=${a2fin}&mes2_fin=${m2fin}`;
  }
  return (
    <div className="header">
      <div>
        <h1>Robot 2026</h1>
        <p>Automatización de Reportes</p>
      </div>
      <div className="nav-tabs">
        <button className={`nav-tab ${tab==='mapeos'?'active':''}`} onClick={()=>setTab('mapeos')}>Configuración</button>
        <button className={`nav-tab ${tab==='params'?'active':''}`} onClick={()=>setTab('params')}>Parámetros</button>
        <button className={`nav-tab ${tab==='viz'?'active':''}`} onClick={()=>setTab('viz')}>Visualizar Input</button>
        <button className={`nav-tab ${tab==='analisis'?'active':''}`} onClick={()=>setTab('analisis')}>Análisis Costo</button>
        <button className={`nav-tab ${tab==='costos_aj'?'active':''}`} onClick={()=>setTab('costos_aj')}>Costos Ajustados</button>
        <button className={`nav-tab ${tab==='cm'?'active':''}`} onClick={()=>setTab('cm')}>Costos Aj Mes (CM)</button>
        <button className={`nav-tab ${tab==='flash'?'active':''}`} onClick={()=>setTab('flash')}>Flash Producciones</button>
        <button className={`nav-tab ${tab==='explicaciones'?'active':''}`} onClick={()=>setTab('explicaciones')}>Explicaciones</button>
        <button className={`nav-tab ${tab==='graficos'?'active':''}`} onClick={()=>setTab('graficos')}>Gráficos</button>
        <a href={excelUrl()} className="btn-dl"
           style={{padding:'6px 14px', fontSize:'.82rem', borderRadius:'6px', marginLeft:'8px'}}
           title="Descargar reporte completo Excel (todas las compañías y secciones)">
          ↓ Reporte
        </a>
      </div>
    </div>
  );
}


/* ─── Tab: Mapeos Excel ─── */
function MapeosTab() {
  const [company, setCompany]        = useState('MLP');
  const [excelKpis, setExcelKpis]    = useState([]);
  const [parquetKpis, setParquetKpis]= useState([]);
  // uiMaps: keyed by array-index string (e.g. "22") — guaranteed unique, no label collisions
  const [uiMaps, setUiMaps]          = useState({});
  // labelMappings: keyed by "Section||Label" — used only for save/load with backend
  const [labelMappings, setLabelMappings] = useState({});
  const [loading, setLoading]        = useState(false);
  const [saving, setSaving]          = useState(false);
  const [saved, setSaved]            = useState(false);
  const [error, setError]            = useState('');
  const [selectedId, setSelectedId]  = useState(null);
  const [pqFilter, setPqFilter]      = useState('');
  const [pqSheet, setPqSheet]        = useState('');
  const [activePqKpi, setActivePqKpi]= useState(null);   // KPI del parquet listo para asignar
  const [dragOver, setDragOver]      = useState(null);
  const [configSubTab, setConfigSubTab] = useState('kpis');
  // _id = String(array-index), _lk = "Section||Label" for backend
  const enrichedKpis = React.useMemo(() => {
    let sec = '', subhdr = '';
    return excelKpis.map((k, i) => {
      if (k.type === 'header')    { sec = k.label; subhdr = ''; return k; }
      if (k.type === 'subheader') { subhdr = k.label; return k; }
      const lk = subhdr ? `${sec}||${subhdr}||${k.label}` : `${sec}||${k.label}`;
      return { ...k, section: sec, _id: String(i), _lk: lk };
    });
  }, [excelKpis]);

  const enrichedKpisForTab = React.useMemo(() => {
    let inCostos = false;
    return enrichedKpis.filter(k => {
      if (k.type === 'header') inCostos = k.label === 'Costos Ajustados';
      return configSubTab === 'kpis' ? !inCostos : inCostos;
    });
  }, [enrichedKpis, configSubTab]);

  useEffect(() => {
    setLoading(true); setError('');
    Promise.all([
      apiGet(`/api/setup/excel-kpis/${company}`),
      apiGet(`/api/setup/parquet-kpis/${company}`),
      apiGet('/api/setup/mappings'),
    ])
    .then(([excel, parquet, saved]) => {
      const kpis = excel.kpis || [];
      setExcelKpis(kpis);
      // parquet.kpis is [{name, hoja, title}]; build lookup map too
      const pKpis = (parquet.kpis || []).map(k => typeof k === 'string' ? {name:k, hoja:'', title:''} : k);
      setParquetKpis(pKpis);
      setLabelMappings(saved || {});
      // Convert label-keyed saved maps → index-keyed for UI
      let sec = '', subhdr = '';
      const converted = {};
      const cmap = (saved || {})[company] || {};
      kpis.forEach((k, i) => {
        if (k.type === 'header')    { sec = k.label; subhdr = ''; return; }
        if (k.type === 'subheader') { subhdr = k.label; return; }
        const lk = subhdr ? `${sec}||${subhdr}||${k.label}` : `${sec}||${k.label}`;
        if (cmap[lk] !== undefined) converted[String(i)] = cmap[lk];
      });
      setUiMaps(converted);
    })
    .catch(e => setError(e.message || 'Error cargando datos'))
    .finally(() => setLoading(false));
  }, [company]);

  function setKpiVal(id, value) {
    setUiMaps(prev => ({ ...prev, [id]: value }));
    setSaved(false);
  }
  function setKpiSource(id, idx, value) {
    setUiMaps(prev => {
      const cur = prev[id];
      const arr = Array.isArray(cur) ? [...cur] : [cur||''];
      arr[idx] = value;
      return { ...prev, [id]: arr.length===1 ? arr[0] : arr };
    });
    setSaved(false);
  }
  function addKpiSource(id) {
    setUiMaps(prev => {
      const cur = prev[id];
      const arr = cur==='__NA__' ? [] : Array.isArray(cur) ? cur : (cur ? [cur] : []);
      return { ...prev, [id]: [...arr, ''] };
    });
    setSaved(false);
  }
  function removeKpiSource(id, idx) {
    setUiMaps(prev => {
      const cur = prev[id];
      const arr = (Array.isArray(cur) ? cur : [cur||'']).filter((_,i)=>i!==idx);
      return { ...prev, [id]: arr.length===0 ? '' : arr.length===1 ? arr[0] : arr };
    });
    setSaved(false);
  }

  async function handleSave() {
    setSaving(true); setSaved(false);
    try {
      // Convert index-keyed uiMaps → label-keyed for backend
      const labelMap = {};
      for (const k of enrichedKpis) {
        if (k.type !== 'kpi') continue;
        const val = uiMaps[k._id];
        if (val !== undefined) labelMap[k._lk] = val;
      }
      const toSave = { ...labelMappings, [company]: labelMap };
      await apiPost('/api/setup/mappings', toSave);
      setLabelMappings(toSave);
      setSaved(true);
      setTimeout(() => setSaved(false), 3000);
    } catch(e) {
      setError(e.message || 'Error al guardar');
    } finally {
      setSaving(false);
    }
  }

  const kpiRows  = enrichedKpisForTab.filter(k => k.type==='kpi');
  const mapped   = kpiRows.filter(k => uiMaps[k._id] && uiMaps[k._id]!=='__NA__');
  const na       = kpiRows.filter(k => uiMaps[k._id]==='__NA__');
  const unmapped = kpiRows.filter(k => !uiMaps[k._id]);

  // Build name → {hojas: Set, title} — un KPI puede aparecer en múltiples hojas
  const hojaMap = React.useMemo(() => {
    const m = {};
    parquetKpis.forEach(k => {
      if (!k.name) return;
      if (!m[k.name]) m[k.name] = { hojas: new Set(), title: k.title||'' };
      if (k.hoja) m[k.name].hojas.add(k.hoja);
    });
    return m;
  }, [parquetKpis]);

  const sheets = React.useMemo(() => {
    const s = new Set();
    parquetKpis.forEach(k => { if (k.hoja) s.add(k.hoja); });
    return [...s].sort();
  }, [parquetKpis]);

  const filteredPq = React.useMemo(() => {
    const fl = pqFilter.toLowerCase();
    const filtered = parquetKpis.filter(k => {
      if (pqSheet && k.hoja !== pqSheet) return false;
      if (!fl) return true;
      return k.name.toLowerCase().includes(fl) || (k.title||'').toLowerCase().includes(fl) || (k.hoja||'').toLowerCase().includes(fl);
    });
    // Sin hoja seleccionada: deduplicar por nombre (mostrar una vez cada KPI)
    if (!pqSheet) {
      const seen = new Set();
      return filtered.filter(k => { if (seen.has(k.name)) return false; seen.add(k.name); return true; });
    }
    return filtered;
  }, [parquetKpis, pqFilter, pqSheet]);

  function assignPqKpi(name) {
    if (!selectedId) return;
    setKpiVal(selectedId, name);
  }

  const selectedKpiItem = selectedId ? enrichedKpis.find(k => k._id === selectedId) : null;

  function handleRowClick(id, e) {
    if (['INPUT','SELECT','BUTTON'].includes(e.target.tagName)) return;
    setSelectedId(id === selectedId ? null : id);
  }

  function HojaLabel({src}) {
    if (!src || typeof src !== 'string' || !src.trim()) return null;
    const match = parquetKpis.find(k => k.name === src.trim());
    if (!match || !match.hoja) return null;
    return (
      <span style={{fontSize:'.65rem', color:'#0369a1', paddingLeft:'2px', whiteSpace:'nowrap'}}>
        {match.hoja}
      </span>
    );
  }

  return (
    <div className="main" style={{maxWidth:'1500px'}}>
      <div className="card">
        <div className="card-title">Configuración de KPIs</div>
        <div style={{display:'flex',gap:'8px',marginBottom:'12px',borderBottom:'2px solid #e5e7eb'}}>
          {[['kpis','Mapeo KPIs'],['costos_aj','Costos Ajustados']].map(([k,l])=>(
            <button key={k} onClick={()=>{setConfigSubTab(k);setSelectedId(null);}} style={{
              padding:'6px 16px', fontSize:'.82rem', fontWeight:'600', cursor:'pointer',
              border:'none', borderBottom: configSubTab===k ? '2px solid var(--navy)' : '2px solid transparent',
              background:'none', color: configSubTab===k ? 'var(--navy)' : '#6b7280',
              marginBottom:'-2px', transition:'color .15s',
            }}>{l}</button>
          ))}
        </div>
        <div style={{display:'flex',gap:'16px',alignItems:'center',marginBottom:'16px',flexWrap:'wrap'}}>
          <div className="company-tabs" style={{marginBottom:0}}>
            {COMPANIES.map(c=>(
              <button key={c} className={`company-tab ${company===c?'active':''}`} onClick={()=>{setCompany(c);setSelectedId(null);}}>
                {c}
              </button>
            ))}
          </div>
          {!loading && !error && kpiRows.length > 0 && (
            <p className="map-summary" style={{marginBottom:0}}>
              <strong>{mapped.length}</strong> mapeados · <strong>{na.length}</strong> N/A · <strong style={{color:unmapped.length>0?'var(--amber)':'inherit'}}>{unmapped.length}</strong> pendientes de {kpiRows.length}
            </p>
          )}
        </div>

        {loading && <p style={{color:'#aaa'}}><span className="spin"/>Cargando KPIs de {company}…</p>}
        {error   && <p style={{color:'var(--red)',fontSize:'.88rem'}}>{error}</p>}

        {!loading && !error && excelKpis.length > 0 && (
          <>
            {/* ── Layout dividido: tabla izquierda + browser parquet derecha ── */}
            <div style={{display:'flex',gap:'12px',alignItems:'flex-start'}}>

              {/* Panel izquierdo: tabla Excel KPIs */}
              <div style={{flex:1,minWidth:0,overflowX:'auto'}}>
                <table>
                  <thead>
                    <tr>
                      <th style={{width:'80px'}}>Código</th>
                      <th>KPI en Excel</th>
                      <th style={{width:'60px'}}>Ud.</th>
                      <th>Mapeo en Parquet</th>
                      <th style={{width:'88px'}}>Estado</th>
                    </tr>
                  </thead>
                  <tbody>
                    {enrichedKpisForTab.map((k,i)=>{
                      if(k.type==='header') return (
                        <tr key={`h-${i}`}>
                          <td colSpan={5} style={{
                            background:'var(--navy)', color:'white',
                            fontWeight:'700', fontSize:'.82rem',
                            padding:'8px 12px', letterSpacing:'.04em',
                            textTransform:'uppercase'
                          }}>{k.label}</td>
                        </tr>
                      );
                      if(k.type==='subheader') return (
                        <tr key={`sh-${i}`}>
                          <td colSpan={5} className="tbl-subhd">{k.label}</td>
                        </tr>
                      );
                      const id      = k._id;
                      const raw     = uiMaps[id];
                      const isNA     = raw === '__NA__';
                      const isForm   = !isNA && typeof raw === 'object' && !Array.isArray(raw) && raw?._f;
                      const isScalar = !isNA && typeof raw === 'object' && !Array.isArray(raw) && raw?._s;
                      const isRB     = !isNA && typeof raw === 'object' && !Array.isArray(raw) && raw?._rb;
                      const isPF     = !isNA && typeof raw === 'object' && !Array.isArray(raw) && raw?._pf;
                      const sources  = (isNA || isForm || isScalar || isRB || isPF) ? [] : Array.isArray(raw) ? raw : (raw ? [raw] : ['']);
                      const isMapped = isNA ? false
                        : isPF     ? !!(raw.num && raw.num.trim() && raw.den && raw.den.trim())
                        : isForm   ? !!(raw.a && raw.b)
                        : isScalar ? !!(raw.src && raw.src.trim() && raw.scalar != null)
                        : isRB     ? !!(raw.real && raw.real.trim())
                        : sources.some(s=>s&&s.trim());
                      const isMulti  = sources.length > 1;
                      const isSelected = selectedId === id;
                      const isDragTarget = dragOver === id;
                      const selStyle = {flex:1, padding:'5px 8px', border:'2px solid #10b981', borderRadius:'5px',
                                        fontSize:'.82rem', minWidth:'160px', background:'#f0fdf4'};
                      const isGrpTotal = !!k.is_group_total;
                      return (
                        <tr key={id}
                          onClick={e=>handleRowClick(id,e)}
                          onDragOver={e=>{e.preventDefault();setDragOver(id);}}
                          onDragLeave={()=>setDragOver(null)}
                          onDrop={e=>{e.preventDefault();const name=e.dataTransfer.getData('pqKpi');if(name)setKpiVal(id,name);setDragOver(null);}}
                          style={{
                            cursor:'pointer',
                            background: isDragTarget ? '#bfdbfe' : isSelected ? '#fef9c3' : isGrpTotal ? '#f0f9ff' : undefined,
                            outline: isDragTarget ? '2px solid #3b82f6' : undefined,
                            borderTop: isGrpTotal ? '1px solid #bae6fd' : undefined,
                          }}
                        >
                          <td style={{fontFamily:'monospace',fontSize:'.8rem',color:'#888'}}>{k.code}</td>
                          <td style={{fontWeight: isGrpTotal ? '700' : '600', color: isGrpTotal ? '#0369a1' : undefined}}>
                            {isGrpTotal && <span style={{marginRight:'5px',fontSize:'.8rem'}}>∑</span>}
                            {k.label}
                          </td>
                          <td style={{color:'#888',fontSize:'.82rem'}}>{k.unit}</td>
                          <td>
                            {isNA ? (
                            <span style={{fontSize:'.84rem',color:'#888',fontStyle:'italic'}}>
                              No aplica
                              <button onClick={()=>setKpiVal(id,'')} style={{marginLeft:'8px',background:'none',border:'none',cursor:'pointer',color:'var(--teal)',fontSize:'.78rem',fontWeight:'700'}}>Cambiar</button>
                            </span>
                          ) : isRB ? (
                            <div style={{display:'flex',flexDirection:'column',gap:'4px'}}>
                              {[['real','Real'],['budget','Ppto']].map(([fld,lbl])=>(
                                <div key={fld} style={{display:'flex',gap:'6px',alignItems:'center',flexWrap:'wrap'}}>
                                  <span style={{width:'38px',fontSize:'.76rem',color:'#888',fontWeight:'600',flexShrink:0}}>{lbl}</span>
                                  <div style={{flex:1,display:'flex',flexDirection:'column',gap:'1px'}}>
                                    <input
                                      className={`map-input ${raw[fld]&&raw[fld].trim()?'mapped':''}`}
                                      list={`pq-${company}`}
                                      value={raw[fld]||''}
                                      placeholder="Escribe para buscar…"
                                      autoComplete="off"
                                      onChange={e=>setKpiVal(id,{...raw,[fld]:e.target.value})}
                                    />
                                    <HojaLabel src={raw[fld]||''}/>
                                  </div>
                                </div>
                              ))}
                              <div style={{display:'flex',gap:'6px'}}>
                                <button onClick={()=>setKpiVal(id, raw.real||'')}
                                  style={{background:'none',border:'1px solid #aaa',borderRadius:'4px',padding:'2px 7px',cursor:'pointer',fontSize:'.75rem',color:'#888'}}>Una columna</button>
                              </div>
                            </div>
                          ) : isScalar ? (
                            <div style={{display:'flex',gap:'6px',alignItems:'center',flexWrap:'wrap'}}>
                              <div style={{flex:1,display:'flex',flexDirection:'column',gap:'1px'}}>
                                <input
                                  className={`map-input ${raw.src&&raw.src.trim()?'mapped':''}`}
                                  list={`pq-${company}`}
                                  value={raw.src||''}
                                  placeholder="Escribe para buscar…"
                                  autoComplete="off"
                                  onChange={e=>setKpiVal(id,{...raw,src:e.target.value})}
                                />
                                <HojaLabel src={raw.src||''}/>
                              </div>
                              <select value={raw.op||'/'} onChange={e=>setKpiVal(id,{...raw,op:e.target.value})}
                                style={{width:'46px',padding:'5px 4px',border:'2px solid #10b981',borderRadius:'5px',fontSize:'.95rem',textAlign:'center',background:'#f0fdf4',fontWeight:700}}>
                                <option value="/">÷</option>
                                <option value="*">×</option>
                                <option value="+">+</option>
                                <option value="-">−</option>
                              </select>
                              <input type="number" placeholder="escalar" value={raw.scalar??''}
                                onChange={e=>setKpiVal(id,{...raw,scalar:e.target.value===''?null:Number(e.target.value)})}
                                style={{width:'88px',padding:'5px 7px',border:'2px solid #10b981',borderRadius:'5px',fontSize:'.84rem',background:'#f0fdf4'}}/>
                              <button onClick={()=>setKpiVal(id, raw.src||'')} title="Quitar escalar"
                                style={{background:'none',border:'1px solid #aaa',borderRadius:'4px',padding:'3px 7px',cursor:'pointer',fontSize:'.75rem',color:'#888'}}>Quitar escalar</button>
                            </div>
                          ) : isPF ? (
                            <div style={{display:'flex',gap:'6px',alignItems:'center',flexWrap:'wrap'}}>
                              <div style={{display:'flex',flexDirection:'column',gap:'2px',flex:1,minWidth:'200px'}}>
                                <span style={{fontSize:'.7rem',color:'#888'}}>Numerador</span>
                                <input className={`map-input ${raw.num?.trim()?'mapped':''}`}
                                  list={`pq-${company}`} value={raw.num||''} placeholder="KPI parquet numerador"
                                  autoComplete="off"
                                  onChange={e=>setKpiVal(id,{...raw,num:e.target.value})}/>
                              </div>
                              <select value={raw.op||'/'} onChange={e=>setKpiVal(id,{...raw,op:e.target.value})}
                                style={{width:'46px',padding:'5px 4px',border:'2px solid #10b981',borderRadius:'5px',fontSize:'.95rem',textAlign:'center',background:'#f0fdf4',fontWeight:700}}>
                                <option value="/">÷</option>
                                <option value="*">×</option>
                                <option value="+">+</option>
                                <option value="-">−</option>
                              </select>
                              <div style={{display:'flex',flexDirection:'column',gap:'2px',flex:1,minWidth:'200px'}}>
                                <span style={{fontSize:'.7rem',color:'#888'}}>Denominador</span>
                                <input className={`map-input ${raw.den?.trim()?'mapped':''}`}
                                  list={`pq-${company}`} value={raw.den||''} placeholder="KPI parquet denominador"
                                  autoComplete="off"
                                  onChange={e=>setKpiVal(id,{...raw,den:e.target.value})}/>
                              </div>
                              <div style={{display:'flex',flexDirection:'column',gap:'2px'}}>
                                <span style={{fontSize:'.7rem',color:'#888'}}>× escalar</span>
                                <input type="number" placeholder="1" value={raw.scale??''} onChange={e=>setKpiVal(id,{...raw,scale:e.target.value===''?null:Number(e.target.value)})}
                                  style={{width:'72px',padding:'5px 7px',border:'1px solid #ddd',borderRadius:'5px',fontSize:'.84rem'}}/>
                              </div>
                              <button onClick={()=>setKpiVal(id,'')} title="Volver a mapeo parquet"
                                style={{background:'none',border:'1px solid #aaa',borderRadius:'4px',padding:'3px 7px',cursor:'pointer',fontSize:'.75rem',color:'#888',alignSelf:'flex-end',marginBottom:'2px'}}>Parquet</button>
                            </div>
                          ) : isForm ? (
                            <div style={{display:'flex',gap:'6px',alignItems:'center',flexWrap:'wrap'}}>
                              <select style={selStyle} value={raw.a||''} onChange={e=>setKpiVal(id,{...raw,a:e.target.value})}>
                                <option value="">— KPI A —</option>
                                {kpiRows.filter(r=>r._id!==id).map(r=>(
                                  <option key={r._id} value={r._lk}>{r.section} › {r.label}</option>
                                ))}
                              </select>
                              <select value={raw.op||'/'} onChange={e=>setKpiVal(id,{...raw,op:e.target.value})}
                                style={{width:'46px',padding:'5px 4px',border:'2px solid #10b981',borderRadius:'5px',fontSize:'.95rem',textAlign:'center',background:'#f0fdf4',fontWeight:700}}>
                                <option value="/">÷</option>
                                <option value="*">×</option>
                                <option value="+">+</option>
                                <option value="-">−</option>
                              </select>
                              <select style={selStyle} value={raw.b||''} onChange={e=>setKpiVal(id,{...raw,b:e.target.value})}>
                                <option value="">— KPI B —</option>
                                {kpiRows.filter(r=>r._id!==id).map(r=>(
                                  <option key={r._id} value={r._lk}>{r.section} › {r.label}</option>
                                ))}
                              </select>
                              <span style={{fontSize:'.75rem',color:'#aaa'}}>×k</span>
                              <select value={raw.scale_op||'*'} onChange={e=>setKpiVal(id,{...raw,scale_op:e.target.value})}
                                style={{width:'46px',padding:'5px 4px',border:'1px solid #ddd',borderRadius:'5px',fontSize:'.95rem',textAlign:'center',fontWeight:700}}>
                                <option value="*">×</option>
                                <option value="/">÷</option>
                              </select>
                              <input type="number" placeholder="1" value={raw.scale??''} onChange={e=>setKpiVal(id,{...raw,scale:e.target.value===''?null:Number(e.target.value)})}
                                style={{width:'72px',padding:'5px 7px',border:'1px solid #ddd',borderRadius:'5px',fontSize:'.84rem'}}/>
                              <button onClick={()=>setKpiVal(id,'')} title="Volver a mapeo parquet"
                                style={{background:'none',border:'1px solid #aaa',borderRadius:'4px',padding:'3px 7px',cursor:'pointer',fontSize:'.75rem',color:'#888'}}>Parquet</button>
                            </div>
                          ) : (
                            <div style={{display:'flex',flexDirection:'column',gap:'4px'}}>
                              {sources.map((s,idx)=>(
                                <div key={idx} style={{display:'flex',gap:'4px',alignItems:'center',flexWrap:'wrap'}}>
                                  <div style={{flex:1,display:'flex',flexDirection:'column',gap:'1px'}}>
                                    <input
                                      className={`map-input ${s&&s.trim()?'mapped':''}`}
                                      list={`pq-${company}`}
                                      value={s}
                                      placeholder="Escribe para buscar…"
                                      autoComplete="off"
                                      name={`kpi-${id}-${idx}`}
                                      onChange={e=>setKpiSource(id, idx, e.target.value)}
                                    />
                                    <HojaLabel src={s}/>
                                  </div>
                                  {sources.length>1 && (
                                    <button onClick={()=>removeKpiSource(id,idx)}
                                      title="Quitar esta fuente"
                                      style={{background:'var(--red)',color:'white',border:'none',borderRadius:'4px',width:'22px',height:'22px',cursor:'pointer',fontWeight:'700',fontSize:'.82rem',flexShrink:0}}>−</button>
                                  )}
                                </div>
                              ))}
                              <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
                                <button onClick={()=>addKpiSource(id)} title="Agregar otra fuente (suma)"
                                  style={{background:'none',border:'1px dashed var(--teal)',color:'var(--teal)',borderRadius:'4px',padding:'2px 8px',cursor:'pointer',fontSize:'.78rem',fontWeight:'700'}}>+ suma</button>
                                <button onClick={()=>setKpiVal(id,{_rb:true,real:sources[0]||'',budget:''})} title="Columnas distintas para Real y Presupuesto"
                                  style={{background:'none',border:'1px dashed #6366f1',color:'#6366f1',borderRadius:'4px',padding:'2px 8px',cursor:'pointer',fontSize:'.78rem',fontWeight:'700'}}>Real/Ppto</button>
                                <button onClick={()=>setKpiVal(id,{_s:true,src:sources[0]||'',op:'/',scalar:null})} title="Aplicar escalar al valor"
                                  style={{background:'none',border:'1px dashed #10b981',color:'#10b981',borderRadius:'4px',padding:'2px 8px',cursor:'pointer',fontSize:'.78rem',fontWeight:'700'}}>÷ × escalar</button>
                                <button onClick={()=>setKpiVal(id,{_f:true,a:'',op:'/',b:''})} title="Definir como fórmula entre dos KPIs mapeados"
                                  style={{background:'none',border:'1px dashed #10b981',color:'#10b981',borderRadius:'4px',padding:'2px 8px',cursor:'pointer',fontSize:'.78rem',fontWeight:'700'}}>÷ fórmula</button>
                                <button onClick={()=>setKpiVal(id,{_pf:true,num:sources[0]||'',den:'',op:'/',scale:null})} title="Dividir dos KPIs directos del parquet"
                                  style={{background:'none',border:'1px dashed #f59e0b',color:'#d97706',borderRadius:'4px',padding:'2px 8px',cursor:'pointer',fontSize:'.78rem',fontWeight:'700'}}>÷ parquet</button>
                              </div>
                            </div>
                          )}
                          </td>
                          <td style={{whiteSpace:'nowrap'}}>
                            {activePqKpi && !isNA ? (
                              <button
                                onClick={e=>{e.stopPropagation();setKpiVal(id,activePqKpi);setActivePqKpi(null);}}
                                style={{padding:'3px 8px',background:'#1A7080',color:'white',border:'none',borderRadius:'4px',cursor:'pointer',fontSize:'.78rem',fontWeight:700}}
                                title={`Asignar "${activePqKpi}" a este KPI`}
                              >← Asignar</button>
                            ) : (
                              <>
                                {isNA
                                  ? <span className="badge badge-partial">No aplica</span>
                                  : <span className={`badge ${isMapped?'badge-ok':'badge-miss'}`}>
                                      {isMapped ? (isPF ? 'Div Parquet' : isForm ? 'Fórmula' : isScalar ? 'Escalar' : isRB ? 'Dual' : isMulti ? `Suma (${sources.length})` : 'Mapeado') : 'Pendiente'}
                                    </span>
                                }
                                {!isNA && (
                                  <button title="Marcar como No aplica" onClick={()=>setKpiVal(id,'__NA__')}
                                    style={{marginLeft:'6px',background:'none',border:'none',cursor:'pointer',color:'#aaa',fontSize:'.78rem'}}>N/A</button>
                                )}
                              </>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>

                <datalist id={`pq-${company}`}>
                  {parquetKpis.map(k=><option key={k.name} value={k.name}>{k.hoja ? `[${k.hoja}] ${k.title||k.name}` : k.name}</option>)}
                </datalist>
              </div>

              {/* Panel derecho: browser de KPIs del Parquet */}
              <div style={{
                width:'300px', flexShrink:0, position:'sticky', top:'16px',
                background:'#f8fafb', borderRadius:'8px', border:'1px solid #dde3e7',
                padding:'12px', maxHeight:'calc(100vh - 160px)', overflowY:'auto',
                boxShadow:'0 2px 6px rgba(0,0,0,.06)', display:'flex', flexDirection:'column', gap:'8px',
              }}>
                <div style={{fontWeight:700, fontSize:'.85rem', color:'var(--teal)', paddingBottom:'6px', borderBottom:'2px solid var(--teal)'}}>
                  KPIs disponibles en Parquet
                </div>

                {/* Indicador de KPI seleccionado */}
                {/* Estado actual del panel */}
                {activePqKpi ? (
                  <div style={{background:'#d1fae5', border:'2px solid #10b981', borderRadius:'6px', padding:'10px', fontSize:'.82rem'}}>
                    <div style={{color:'#065f46', fontWeight:700, fontSize:'.72rem', textTransform:'uppercase', marginBottom:'3px'}}>Listo para asignar:</div>
                    <div style={{fontWeight:700, color:'#065f46', lineHeight:'1.3', wordBreak:'break-all'}}>{activePqKpi}</div>
                    <div style={{color:'#047857', fontSize:'.75rem', marginTop:'4px'}}>
                      Ahora haz clic en la fila de la tabla donde quieres asignarlo.
                    </div>
                    <button onClick={()=>setActivePqKpi(null)}
                      style={{marginTop:'5px', background:'none', border:'1px solid #aaa', borderRadius:'4px', padding:'2px 7px', cursor:'pointer', color:'#666', fontSize:'.72rem'}}>
                      Cancelar ✕
                    </button>
                  </div>
                ) : (
                  <div style={{background:'#eff6ff', border:'1px solid #bfdbfe', borderRadius:'6px', padding:'8px', fontSize:'.78rem', color:'#1e40af', lineHeight:'1.5'}}>
                    Haz clic en un KPI de la lista para cargarlo, luego haz clic en la fila del Excel para asignarlo.
                  </div>
                )}

                {/* Filtros */}
                <input
                  value={pqFilter}
                  onChange={e=>setPqFilter(e.target.value)}
                  placeholder="Buscar KPI en parquet..."
                  style={{padding:'6px 9px', border:'1px solid #d0d7de', borderRadius:'5px', fontSize:'.82rem', outline:'none', width:'100%'}}
                />
                {sheets.length > 0 && (
                  <select value={pqSheet} onChange={e=>setPqSheet(e.target.value)}
                    style={{padding:'6px 8px', border:'1px solid #d0d7de', borderRadius:'5px', fontSize:'.8rem', background:'white', width:'100%'}}>
                    <option value="">Todas las hojas ({parquetKpis.length})</option>
                    {sheets.map(s=><option key={s} value={s}>{s}</option>)}
                  </select>
                )}

                {/* Lista de KPIs del parquet */}
                <div style={{display:'flex', flexDirection:'column', gap:'1px', overflowY:'auto', flex:1}}>
                  {filteredPq.map(k => {
                    const curVal = selectedId ? uiMaps[selectedId] : null;
                    const isAssigned = typeof curVal === 'string' && curVal === k.name;
                    const shortName  = k.name.includes('||') ? k.name.split('||').pop() : k.name;
                    return (
                      <div key={k.name}
                        draggable={true}
                        onDragStart={e=>{e.dataTransfer.setData('pqKpi', k.name); e.dataTransfer.effectAllowed='copy';}}
                        onClick={()=>{
                          if (selectedId) { assignPqKpi(k.name); }
                          else { setActivePqKpi(activePqKpi === k.name ? null : k.name); }
                        }}
                        title={k.name + (k.title && k.title !== k.name ? ' — '+k.title : '')}
                        style={{
                          padding:'5px 7px', borderRadius:'4px', fontSize:'.78rem', lineHeight:'1.3',
                          cursor: 'pointer',
                          background: isAssigned ? '#d1fae5'
                            : activePqKpi === k.name ? '#fef9c3'
                            : 'transparent',
                          border: isAssigned ? '1px solid #10b981'
                            : activePqKpi === k.name ? '1px solid #f59e0b'
                            : '1px solid transparent',
                          fontWeight: activePqKpi === k.name ? 700 : undefined,
                          transition:'background .1s',
                        }}
                        onMouseEnter={e=>{if(!isAssigned && activePqKpi !== k.name)e.currentTarget.style.background='#e0f2fe';}}
                        onMouseLeave={e=>{if(!isAssigned && activePqKpi !== k.name)e.currentTarget.style.background='transparent';}}
                      >
                        {k.hoja && <span style={{fontSize:'.68rem', fontWeight:700, color:'#0369a1', background:'#dbeafe', padding:'0 4px', borderRadius:'8px', marginRight:'4px', whiteSpace:'nowrap'}}>{k.hoja}</span>}
                        {shortName}
                      </div>
                    );
                  })}
                  {filteredPq.length === 0 && (
                    <div style={{color:'#aaa', fontSize:'.8rem', textAlign:'center', padding:'16px'}}>
                      Sin resultados
                    </div>
                  )}
                </div>
              </div>

            </div>{/* fin layout dividido */}

            <div style={{marginTop:'12px'}}>
              <button className="btn btn-success" onClick={handleSave} disabled={saving}>
                {saving ? <><span className="spin"/>Guardando…</> : 'Guardar mapeos'}
              </button>
              {saved && <span style={{marginLeft:'12px',color:'#059669',fontWeight:'600',fontSize:'.88rem'}}>Guardado ✓</span>}
            </div>
          </>
        )}

        {!loading && !error && excelKpis.length === 0 && (
          <p style={{color:'#aaa',fontSize:'.9rem'}}>
            No se encontraron KPIs para {company}. Verifica que el archivo
            <code style={{background:'#f0f2f5',padding:'0 4px',borderRadius:'3px',fontSize:'.82rem'}}> templates/Robot 2026.xlsx </code>
            esté en la carpeta <code style={{background:'#f0f2f5',padding:'0 4px',borderRadius:'3px',fontSize:'.82rem'}}>templates/</code>.
          </p>
        )}
      </div>

    </div>
  );
}

/* ─── Tab: Visualizar ─── */
const MESES_SHORT = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MONTH_FIELDS_FE = ['enero','febrero','marzo','abril','mayo','junio','julio',
                         'agosto','septiembre','octubre','noviembre','diciembre'];

function fmt(v) {
  if (v === null || v === undefined) return <span style={{color:'#ccc'}}>—</span>;
  const n = Number(v);
  if (isNaN(n)) return '—';
  return n.toLocaleString('es-CL', {maximumFractionDigits: 2});
}

const RANGE_YEARS = Array.from({length: new Date().getFullYear()-2023}, (_,i)=>2024+i);
const MONTH_LABELS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const _lag      = NOW.getDate() <= 20 ? 2 : 1;
const _absMo    = NOW.getFullYear() * 12 + NOW.getMonth() - _lag;
const DEFAULT_YR = Math.floor(_absMo / 12);
const DEFAULT_MO = (_absMo % 12) + 1;

function buildColumns(aIni, mIni, aFin, mFin) {
  const cols = [];
  let y = aIni, m = mIni;
  while (y < aFin || (y === aFin && m <= mFin)) {
    cols.push({year:y, month:m, label:MONTH_LABELS[m-1]+"'"+String(y).slice(2)});
    m++; if (m > 12) { m = 1; y++; }
  }
  return cols;
}

function applyOverrides(data, overrides) {
  if (!data || !overrides || Object.keys(overrides).length === 0) return data;
  return {
    ...data,
    sections: data.sections.map(sec => ({
      ...sec,
      kpis: sec.kpis.map(kpi => {
        if (kpi.type === 'subheader') return kpi;
        const lkOvr = overrides[kpi.lk];
        if (!lkOvr) return kpi;
        const o1 = lkOvr[data.tipo1] || {};
        const o2 = lkOvr[data.tipo2] || {};
        return {
          ...kpi,
          vals1: kpi.vals1.map((v, i) => { const ck = `${data.cols1[i].year}_${data.cols1[i].month}`; return o1[ck] !== undefined ? o1[ck] : v; }),
          vals2: kpi.vals2.map((v, i) => { const ck = `${data.cols2[i].year}_${data.cols2[i].month}`; return o2[ck] !== undefined ? o2[ck] : v; }),
          mes1: o1['mes'] !== undefined ? o1['mes'] : kpi.mes1,
          ytd1: o1['ytd'] !== undefined ? o1['ytd'] : kpi.ytd1,
          mes2: o2['mes'] !== undefined ? o2['mes'] : kpi.mes2,
          ytd2: o2['ytd'] !== undefined ? o2['ytd'] : kpi.ytd2,
        };
      })
    }))
  };
}

function VisualizarTab({period, tipos}) {
  const {tipo1, a1ini, m1ini, a1fin, m1fin, tipo2, a2ini, m2ini, a2fin, m2fin} = period;
  const [company,   setCompany]   = useState('MLP');
  const [hideNA,    setHideNA]    = useState(true);
  const [data,      loading,      error,      runFetch] = useAsyncState();
  const [calcData,  calcLoading,  calcError,  runCalc]  = useAsyncState();
  const [overrides, setOverrides] = useState({});
  const [editCell,  setEditCell]  = useState(null); // {lk, tipo, colkey, inputVal}

  // Load overrides when company changes
  useEffect(() => {
    apiGet(`/api/overrides/${company}`).then(setOverrides).catch(() => setOverrides({}));
  }, [company]);

  const displayData = React.useMemo(() => applyOverrides(data, overrides), [data, overrides]);

  function commitOverride(lk, tipo, colkey, rawVal) {
    const val = parseFloat(String(rawVal).replace(',', '.'));
    setOverrides(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      if (isNaN(val)) {
        if (next[lk]?.[tipo]) delete next[lk][tipo][colkey];
      } else {
        if (!next[lk]) next[lk] = {};
        if (!next[lk][tipo]) next[lk][tipo] = {};
        next[lk][tipo][colkey] = val;
      }
      return next;
    });
  }

  function cargarCalculos() {
    runCalc(apiGet(`/api/calculos/${company}?año_ini=${a1ini}&mes_ini=${m1ini}&año_fin=${a1fin}&mes_fin=${m1fin}`));
  }

  function cargar() {
    // Save pending overrides, then reload (overrides applied client-side)
    apiPost(`/api/overrides/${company}`, overrides).catch(e => console.error(e));
    const enc = encodeURIComponent;
    const q = `tipo1=${enc(tipo1)}&año1_ini=${a1ini}&mes1_ini=${m1ini}&año1_fin=${a1fin}&mes1_fin=${m1fin}`
            + `&tipo2=${enc(tipo2)}&año2_ini=${a2ini}&mes2_ini=${m2ini}&año2_fin=${a2fin}&mes2_fin=${m2fin}`;
    runFetch(apiGet(`/api/visualizar/${company}?${q}`));
  }

  function cargarDeFuente() {
    // Clear overrides for this company, then reload from parquet
    apiDelete(`/api/overrides/${company}`).catch(e => console.error(e));
    setOverrides({});
    const enc = encodeURIComponent;
    const q = `tipo1=${enc(tipo1)}&año1_ini=${a1ini}&mes1_ini=${m1ini}&año1_fin=${a1fin}&mes1_fin=${m1fin}`
            + `&tipo2=${enc(tipo2)}&año2_ini=${a2ini}&mes2_ini=${m2ini}&año2_fin=${a2fin}&mes2_fin=${m2fin}`;
    runFetch(apiGet(`/api/visualizar/${company}?${q}`));
  }

  // Renders an editable table cell
  function mkCell(v, lk, tipo, colkey, className, extraStyle) {
    const ovrVal = overrides?.[lk]?.[tipo]?.[colkey];
    const isOvr  = ovrVal !== undefined;
    const dispVal = isOvr ? ovrVal : v;
    const isEdit  = editCell?.lk === lk && editCell?.tipo === tipo && editCell?.colkey === colkey;
    const bg = isOvr ? '#fffbe6' : (extraStyle?.background);
    if (isEdit) {
      return (
        <td className={className} style={{...extraStyle, background:'#fffbe6', padding:'1px', outline:'2px solid #f5a800', outlineOffset:'-2px'}}>
          <input type="number" step="any" autoFocus
            defaultValue={editCell.inputVal}
            style={{width:'100%', border:'none', background:'transparent', textAlign:'right',
                    fontSize:'.76rem', padding:'2px 8px', outline:'none'}}
            onKeyDown={e => {
              if (e.key === 'Enter')  { commitOverride(lk, tipo, colkey, e.target.value); setEditCell(null); }
              if (e.key === 'Escape') { setEditCell(null); }
            }}
            onBlur={e => { commitOverride(lk, tipo, colkey, e.target.value); setEditCell(null); }}
          />
        </td>
      );
    }
    return (
      <td className={className} style={{...extraStyle, background: bg, cursor:'cell'}}
          title="Haz clic para editar"
          onClick={() => setEditCell({lk, tipo, colkey, inputVal: dispVal != null ? dispVal : ''})}>
        {fmt(dispVal)}
      </td>
    );
  }

  const hasOverrides = Object.keys(overrides).length > 0;

  return (
    <div className="main">
      <div className="card">
        <div className="card-title">Visualizar KPIs por Período</div>
        <div className="company-tabs" style={{marginBottom:'12px'}}>
          {COMPANIES.map(c=>(
            <button key={c} className={`company-tab ${company===c?'active':''}`} onClick={()=>setCompany(c)}>{c}</button>
          ))}
        </div>
        <div style={{display:'flex', gap:'12px', flexWrap:'wrap', alignItems:'flex-end', marginBottom:'16px'}}>
          <button className="btn btn-primary" onClick={cargar} disabled={loading}
            style={{alignSelf:'flex-end', height:'38px'}}>
            {loading?<><span className="spin"/>Cargando…</>:'Cargar'}
          </button>
          <button onClick={cargarDeFuente} disabled={loading} style={{
            alignSelf:'flex-end', height:'38px', padding:'0 16px', border:'2px solid #fca5a5',
            borderRadius:'6px', fontSize:'.84rem', fontWeight:600, cursor:'pointer',
            background:'#fee2e2', color:'#991b1b'
          }}>Cargar de la fuente</button>
          <button onClick={()=>setHideNA(v=>!v)} style={{
            alignSelf:'flex-end', height:'38px', padding:'0 16px', border:'2px solid var(--gray)',
            borderRadius:'6px', fontSize:'.84rem', fontWeight:600, cursor:'pointer',
            background: hideNA?'white':'#e0f2f1', color: '#444',
            borderColor: 'var(--gray)'
          }}>{hideNA ? 'Mostrar N/A' : 'Ocultar N/A'}</button>
          {hasOverrides && (
            <span style={{alignSelf:'center', fontSize:'.75rem', color:'#92400e', background:'#fffbe6',
                          border:'1px solid #f5a800', borderRadius:'4px', padding:'3px 8px'}}>
              ✎ Con ediciones manuales — celdas en amarillo
            </span>
          )}
        </div>

        {error && <p className="err">{error}</p>}

        {displayData && (() => {
          const d = displayData;
          const nc1 = d.cols1.length, nc2 = d.cols2.length;
          const ncMax = Math.max(nc1, nc2);
          const totalCols = 3 + ncMax + 2;
          const pad1 = ncMax - nc1, pad2 = ncMax - nc2;
          return (
            <div className="tbl-wrap">
              <table style={{fontSize:'.76rem', borderCollapse:'collapse'}}>
                <thead>
                  <tr>
                    <th rowSpan={2} className="viz-hcol" style={{textAlign:'left', minWidth:'170px', position:'sticky', left:0, zIndex:2}}>KPI</th>
                    <th rowSpan={2} className="viz-hcol" style={{width:'42px'}}>Ud.</th>
                    <th className="tbl-th-c1" style={{minWidth:'58px', borderLeft:'2px solid #4EC3C3', textAlign:'center'}}>{d.tipo1}</th>
                    {d.cols1.map((c,i)=><th key={`c1-${i}`} className="tbl-th-c1">{c.label}</th>)}
                    <th className="tbl-th-c1" style={{background:'#0e4e5e'}}>Mes</th>
                    <th className="tbl-th-c1" style={{background:'#0e4e5e'}}>YTD</th>
                    {Array(pad1).fill(null).map((_,i)=><th key={i} style={{background:'#1A3A4A'}}></th>)}
                  </tr>
                  <tr>
                    <th className="tbl-th-c2" style={{borderLeft:'2px solid #F5A800', textAlign:'center'}}>{d.tipo2}</th>
                    {d.cols2.map((c,i)=><th key={`c2-${i}`} className="tbl-th-c2">{c.label}</th>)}
                    <th className="tbl-th-c2" style={{background:'#5a3c00'}}>Mes</th>
                    <th className="tbl-th-c2" style={{background:'#5a3c00'}}>YTD</th>
                    {Array(pad2).fill(null).map((_,i)=><th key={i} style={{background:'#1A3A4A'}}></th>)}
                  </tr>
                </thead>
                <tbody>
                  {d.sections.map((sec,si)=>{
                    const visKpis = hideNA
                      ? sec.kpis.filter(k => k.type === 'subheader' || !k.is_na)
                      : sec.kpis;
                    const hasVis = visKpis.some(k => k.type !== 'subheader');
                    if (hideNA && !hasVis) return null;
                    return (
                    <React.Fragment key={si}>
                      <tr><td colSpan={totalCols} className="tbl-sec">{sec.label}</td></tr>
                      {visKpis.map((kpi,ki)=>{
                        if (kpi.type === 'subheader') {
                          return <tr key={ki}><td colSpan={totalCols} className="tbl-subhd">{kpi.label}</td></tr>;
                        }
                        const bg = ki%2===0?'white':'#f8fafb';
                        return (
                          <React.Fragment key={ki}>
                            <tr style={{background:bg}}>
                              <td rowSpan={2} className="viz-kpi" style={{background:bg, color:kpi.mapped?'inherit':'#ccc'}}>{kpi.label}</td>
                              <td rowSpan={2} className="viz-unit">{kpi.unit}</td>
                              <td className="viz-tag1">{d.tipo1}</td>
                              {kpi.vals1.map((v,vi)=> mkCell(v, kpi.lk, d.tipo1, `${d.cols1[vi].year}_${d.cols1[vi].month}`, 'viz-col', {background:bg}))}
                              {mkCell(kpi.mes1, kpi.lk, d.tipo1, 'mes', 'viz-mes1', {})}
                              {mkCell(kpi.ytd1, kpi.lk, d.tipo1, 'ytd', 'viz-mes1', {})}
                              {Array(pad1).fill(null).map((_,i)=><td key={i}></td>)}
                            </tr>
                            <tr style={{background:bg, borderBottom:'2px solid #e5e7eb'}}>
                              <td className="viz-tag2">{d.tipo2}</td>
                              {kpi.vals2.map((v,vi)=> mkCell(v, kpi.lk, d.tipo2, `${d.cols2[vi].year}_${d.cols2[vi].month}`, 'viz-col', {background:bg}))}
                              {mkCell(kpi.mes2, kpi.lk, d.tipo2, 'mes', 'viz-mes2', {})}
                              {mkCell(kpi.ytd2, kpi.lk, d.tipo2, 'ytd', 'viz-mes2', {})}
                              {Array(pad2).fill(null).map((_,i)=><td key={i}></td>)}
                            </tr>
                          </React.Fragment>
                        );
                      })}
                    </React.Fragment>
                  );})}
                </tbody>
              </table>
            </div>
          );
        })()}
      </div>

      {/* ─── Cálculos ─── */}
      <CalcDescomposicionCard
        calcData={calcData} calcLoading={calcLoading} calcError={calcError}
        onCargar={cargarCalculos}
        hint="Real vs Plan/Ppto · período Comp 1 seleccionado"
      />
    </div>
  );
}

function calcFmtN(v) {
  if (v == null) return <span style={{color:'#ccc'}}>—</span>;
  const color = v < 0 ? 'var(--red)' : v > 0 ? '#059669' : 'inherit';
  return <span style={{color}}>{v >= 0 ? '+' : ''}{v.toLocaleString('es-CL',{minimumFractionDigits:2,maximumFractionDigits:2})}</span>;
}

function CalcDescomposicionTable({calcData}) {
  if (!calcData) return null;
  const nc = calcData.cols.length;
  const totalCols = 2 + nc + 2;
  const fmtN = calcFmtN;
  return (
    <div className="tbl-wrap">
      <table style={{fontSize:'.76rem', borderCollapse:'collapse'}}>
        <thead>
          <tr>
            <th rowSpan={2} className="tbl-th-c1" style={{textAlign:'left', minWidth:'200px', position:'sticky', left:0, zIndex:2, background:'#1A3A4A'}}>Componente</th>
            <th rowSpan={2} className="tbl-th-c1" style={{width:'44px', background:'#1A3A4A'}}>Ud.</th>
            {calcData.cols.map((c,i)=><th key={i} className="tbl-th-c1">{c.label}</th>)}
            <th className="tbl-th-c1" style={{background:'#0e4e5e'}}>Mes</th>
            <th className="tbl-th-c1" style={{background:'#0e4e5e'}}>YTD</th>
          </tr>
          <tr>
            {calcData.cols.map((_,i)=><th key={i} className="tbl-th-c1" style={{fontSize:'.65rem', color:'#a0d8df'}}>Real–Ppto</th>)}
            <th className="tbl-th-c1" style={{background:'#0e4e5e', fontSize:'.65rem', color:'#a0d8df'}}>Real–Ppto</th>
            <th className="tbl-th-c1" style={{background:'#0e4e5e', fontSize:'.65rem', color:'#a0d8df'}}>Real–Ppto</th>
          </tr>
        </thead>
        <tbody>
          {CALC_SECS_DEF.map((sec, si) => {
            const secData = calcData[sec.sec];
            return (
              <React.Fragment key={si}>
                {si === 2 && calcData.actividad_contexto && (() => {
                  const acData = calcData.actividad_contexto;
                  const acRows = [
                    { lbl:'Mov. Mina', key:'mov_mina', unit:'kt' },
                    { lbl:'Actividad Mina', key:'actividad_mina', unit:'kUS$' },
                    { lbl:'Actividad Concentradora', key:'actividad_conc', unit:'kUS$' },
                    { lbl:'Actividad Hidro', key:'actividad_hidro', unit:'kUS$' },
                  ];
                  return (
                    <React.Fragment>
                      <tr><td colSpan={totalCols} className="tbl-amber">Actividad — Contexto (Real − Ppto)</td></tr>
                      {acRows.map(({lbl, key, unit}, ri) => {
                        const series = acData[key];
                        if (!series) return null;
                        const bg = ri % 2 === 0 ? '#fffbf0' : '#fef3c7';
                        return (
                          <tr key={ri} style={{background:bg}}>
                            <td className="tbl-kpi" style={{background:bg, color:'#92400e', fontStyle:'italic'}}>{lbl}</td>
                            <td className="tbl-ud" style={{color:'#92400e'}}>{unit}</td>
                            {series.vals.map((v, vi) => <td key={vi} className="tbl-val">{fmtN(v)}</td>)}
                            <td className="tbl-val">{fmtN(series.mes)}</td>
                            <td className="tbl-val">{fmtN(series.ytd)}</td>
                          </tr>
                        );
                      })}
                    </React.Fragment>
                  );
                })()}
                <tr><td colSpan={totalCols} className="tbl-sec">{sec.label}</td></tr>
