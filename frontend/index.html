/* ─── Grupo Minero aggregation for Análisis Costo ─── */
function sumSeries(a, b) {
  if (!a && !b) return {vals:[], mes:null, ytd:null};
  if (!a) return b; if (!b) return a;
  const ss = (x, y) => x != null && y != null ? x + y : (x ?? y);
  return {
    vals: a.vals.map((v, i) => ss(v, b.vals[i])),
    mes: ss(a.mes, b.mes),
    ytd: ss(a.ytd, b.ytd),
  };
}
function sumSection(a, b) {
  const keys = new Set([...Object.keys(a||{}), ...Object.keys(b||{})]);
  const res = {};
  for (const k of keys) res[k] = sumSeries(a?.[k], b?.[k]);
  return res;
}

/* Aggregate waterfall panels from multiple company explicaciones responses */
function aggregateExpResults(results) {
  if (!results || results.length === 0) return null;
  const ss = (a, b) => (a != null && b != null) ? a + b : (a ?? b);
  const merged = {company: 'Grupo Minero', año: results[0].año, mes: results[0].mes, data: {}};
  for (const panel of ['mes', 'ytd']) {
    const panels = results.map(r => r.data?.[panel]).filter(Boolean);
    if (!panels.length) continue;
    const wf = {};
    const WF_KEYS = ['c1_b','c1_r','aj_tc','aj_ipc','aj_cpi',
      'pr_energia','pr_combustible','pr_acido','pr_bolas','pr_explosivos',
      'ley_conc','ley_hidro','act_mina_kus','act_conc_kus',
      'da_trat_conc','da_trat_hidro','da_rec_conc','da_rec_hidro','varinv',
      'rend_energia_conc','rend_energia_hidro','rend_combustible','rend_acido','rend_bolas','rend_explosivos',
      'dev_mina','tcrc_kus','comer_kus'];
    for (const key of WF_KEYS) wf[key] = panels.reduce((acc, p) => ss(acc, p.waterfall?.[key]), null);

    // Agrega arrays por posición sumando solo los efectos (real/ppto son tasas → null)
    const mergeRows = (key, effKey) => {
      const first = panels[0]?.[key];
      if (!first) return [];
      return first.map((row, i) => ({
        ...row,
        real: null, ppto: null,
        [effKey]: panels.reduce((acc, p) => ss(acc, p[key]?.[i]?.[effKey]), null),
      }));
    };

    // Producción: kt se suman, % usan promedio ponderado
    const wavgProd = (numLabel, denLabel, field) => {
      const first = panels[0]?.produccion;
      if (!first) return null;
      const ni = first.findIndex(r => r.label === numLabel);
      const di = first.findIndex(r => r.label === denLabel);
      if (ni < 0 || di < 0) return null;
      let wSum = 0, wTot = 0;
      for (const p of panels) {
        const v = p.produccion?.[ni]?.[field];
        const w = p.produccion?.[di]?.[field];
        if (v != null && w != null && w > 0) { wSum += v * w; wTot += w; }
      }
      return wTot > 0 ? wSum / wTot : null;
    };
    const KT_PROD = new Set(['Tratamiento Conc','Apilamiento','Beneficio Hidro','Otros','Inventarios y otros']);
    const WAVG_PROD = {
      'Ley Conc':  ['Ley Conc',  'Tratamiento Conc'],
      'Rec Conc':  ['Rec Conc',  'Tratamiento Conc'],
      'Ley Hidro': ['Ley Hidro', 'Beneficio Hidro'],
      'Rec Hidro': ['Rec Hidro', 'Beneficio Hidro'],
    };
    const mergeProd = () => {
      const first = panels[0]?.produccion;
      if (!first) return [];
      return first.map((row, i) => {
        const eff    = panels.reduce((a, p) => ss(a, p.produccion?.[i]?.efecto_ktcuf), null);
        const effKus = panels.reduce((a, p) => ss(a, p.produccion?.[i]?.efecto_kus),   null);
        if (KT_PROD.has(row.label)) {
          return {
            ...row,
            real: panels.reduce((a, p) => ss(a, p.produccion?.[i]?.real), null),
            ppto: panels.reduce((a, p) => ss(a, p.produccion?.[i]?.ppto), null),
            efecto_ktcuf: eff, efecto_kus: effKus,
          };
        }
        if (WAVG_PROD[row.label]) {
          const [nl, dl] = WAVG_PROD[row.label];
          return {
            ...row,
            real: wavgProd(nl, dl, 'real'),
            ppto: wavgProd(nl, dl, 'ppto'),
            efecto_ktcuf: eff, efecto_kus: effKus,
          };
        }
        return { ...row, real: null, ppto: null, efecto_ktcuf: eff, efecto_kus: effKus };
      });
    };

    const mmObj = key => ({
      real:       panels.reduce((a,p) => ss(a, p[key]?.real),       null),
      ppto:       panels.reduce((a,p) => ss(a, p[key]?.ppto),       null),
      efecto_kus: panels.reduce((a,p) => ss(a, p[key]?.efecto_kus), null),
    });

    merged.data[panel] = {
      cu_prod_real:   panels.reduce((a,p) => ss(a, p.cu_prod_real),   null),
      cu_prod_budget: panels.reduce((a,p) => ss(a, p.cu_prod_budget), null),
      waterfall: wf,
      ajuste_monetario: mergeRows('ajuste_monetario', 'efecto_kus'),
      precio_insumos:   mergeRows('precio_insumos',   'efecto_kus'),
      rendimiento:      mergeRows('rendimiento',       'efecto_kus'),
      produccion:       mergeProd(),
      mov_mina:         mmObj('mov_mina'),
      desarrollo_mina: {
        ...mmObj('desarrollo_mina'),
        tonelaje_real:       panels.reduce((a,p) => ss(a, p.desarrollo_mina?.tonelaje_real),       null),
        tonelaje_ppto:       panels.reduce((a,p) => ss(a, p.desarrollo_mina?.tonelaje_ppto),       null),
        tonelaje_efecto_kus: panels.reduce((a,p) => ss(a, p.desarrollo_mina?.tonelaje_efecto_kus), null),
        cu_real: null, cu_ppto: null, cu_efecto_kus: null,
      },
    };
  }
  return merged;
}

/* Build ordered waterfall rows from panel data */
const B_CLB = 2204.62;
function toClb(kus, ktu) { return (ktu && ktu > 0) ? kus * 100 / (ktu * B_CLB) : null; }

function buildWaterfall(expData, panel, tipo2) {
  const d = expData?.data?.[panel];
  const wf = d?.waterfall || {};
  const t2 = tipo2 ? tipo2.charAt(0).toUpperCase() + tipo2.slice(1) : 'Ppto';

  let ktu = d?.cu_prod_budget ?? null;
  let kus = null;
  const rows = [];
  let baseClb = null;

  const clbOf = (k, t) => (k != null && t != null && t > 0) ? k * 100 / (t * B_CLB) : null;

  // Azul oscuro — muestra el kus acumulado actual
  const pushMain = (id, label) => {
    const clb = clbOf(kus, ktu);
    rows.push({id, label, type:'main', kus, ktu, clb, dclb: null});
    baseClb = clb;
  };

  // Gris claro — muestra abs_kus (null → "—"); solo actualiza kus si abs_kus != null
  const snapGroup = (id, label, abs_kus) => {
    const prev = baseClb;
    if (abs_kus != null) kus = abs_kus;
    const clb = abs_kus != null ? clbOf(abs_kus, ktu) : null;
    rows.push({id, label, type:'group',
      kus: abs_kus, ktu: abs_kus != null ? ktu : null, clb,
      dclb: clb != null && prev != null ? clb - prev : null});
    if (abs_kus != null) baseClb = clb;
  };

  // Azul oscuro — muestra abs_kus (null → "—"); solo actualiza kus si abs_kus != null
  const snapMain = (id, label, abs_kus) => {
    if (abs_kus != null) kus = abs_kus;
    const clb = abs_kus != null ? clbOf(abs_kus, ktu) : null;
    rows.push({id, label, type:'main',
      kus: abs_kus, ktu: abs_kus != null ? ktu : null, clb, dclb: null});
    if (abs_kus != null) baseClb = clb;
  };

  // Gris claro — aplica delta; dclb=null si ambos deltas son null
  const applyGroup = (id, label, dkus, dktu) => {
    const prev = baseClb;
    if (kus != null && dkus != null) kus += dkus;
    if (ktu != null && dktu != null) ktu += dktu;
    const clb = clbOf(kus, ktu);
    const hasD = dkus != null || dktu != null;
    rows.push({id, label, type:'group', kus, ktu, clb,
      dclb: hasD && clb != null && prev != null ? clb - prev : null});
    baseClb = clb;
  };

  // Suma null-safe: null cuando TODOS los valores son null
  const nsum = (...vals) => {
    const nn = vals.filter(v => v != null);
    return nn.length ? nn.reduce((a, b) => a + b, 0) : null;
  };

  // Grupo primero, luego sub-filas usando el estado PRE-grupo
  const groupThenSubs = (gid, glabel, gdkus, gdktu, subfn) => {
    const preKus = kus, preKtu = ktu, preClb = baseClb;
    applyGroup(gid, glabel, gdkus, gdktu);
    const sub = (id, label, dkus, dktu) => {
      const nk = preKus != null && dkus != null ? preKus + dkus : null;
      const np = preKtu != null && dktu != null ? preKtu + dktu : null;
      const clb = clbOf(nk, np);
      rows.push({id, label, type:'sub', kus:nk, ktu:np, clb,
        dclb: clb != null && preClb != null ? clb - preClb : null, dkus, dktu});
    };
    subfn(sub);
  };

  // ── PREÁMBULO PRESUPUESTO ──
  if      (wf.c3_b     != null) kus = wf.c3_b;
  else if (wf.c2_b     != null) kus = wf.c2_b;
  else if (wf.c1_abs_b != null) kus = wf.c1_abs_b + (wf.da_b || 0);
  else if (wf.c1_b     != null) kus = wf.c1_b;
  baseClb = clbOf(kus, ktu);

  snapMain('c3',          `C3 ${t2}`,                   wf.c3_b);
  snapMain('c2',          `C2 ${t2}`,                   wf.c2_b);
  applyGroup('da',        'Depreciación / Amortización', wf.da_b      != null ? -wf.da_b      : null, 0);
  snapMain('c1p',         `C1 ${t2}`,                   wf.c1_abs_b);
  applyGroup('subprod',   'Subproductos',               wf.subprod_b != null ? -wf.subprod_b : null, 0);
  if (wf.precredit_b_costo != null) snapMain('precredit', `Pre-credit ${t2}`, wf.precredit_b_costo);
  else pushMain('precredit', `Pre-credit ${t2}`);
  applyGroup('tcrc_pre',  'TC/RC',                      wf.tcrc_b_total  != null ? -wf.tcrc_b_total  : null, 0);
  applyGroup('comer_pre', 'Comercialización',            wf.comer_b_total != null ? -wf.comer_b_total : null, 0);

  if (wf.c1_b != null) { kus = wf.c1_b; baseClb = clbOf(kus, ktu); }
  pushMain('onsite', `Costo Onsite ${t2}`);

  // ── EFECTOS (grupo siempre primero, sub-filas después) ──

  const aj_sum = nsum(wf.aj_tc, wf.aj_ipc, wf.aj_cpi);
  applyGroup('aj_mon', 'Efecto Ajuste Monetario', aj_sum ?? wf.aj_total_ca, 0);

  groupThenSubs('pr_ins', 'Efecto precio insumos',
    nsum(wf.pr_energia, wf.pr_combustible, wf.pr_acido, wf.pr_bolas, wf.pr_explosivos), 0,
    sub => {
      sub('pr_en', 'Energía',     wf.pr_energia,     0);
      sub('pr_cb', 'Combustible', wf.pr_combustible, 0);
      sub('pr_ac', 'Ácido',       wf.pr_acido,       0);
      sub('pr_bo', 'Bolas',       wf.pr_bolas,       0);
      sub('pr_ex', 'Explosivos',  wf.pr_explosivos,  0);
    });

  applyGroup('ley', 'Efecto ley', 0, nsum(wf.ley_conc, wf.ley_hidro));

  groupThenSubs('act', 'Efecto actividad', nsum(wf.act_mina_kus, wf.act_conc_kus), null, sub => {
    sub('ac_mn', 'Mina',        wf.act_mina_kus, 0);
    sub('ac_cn', 'Tratamiento', wf.act_conc_kus, 0);
  });

  groupThenSubs('prod_cu', 'Efecto Producción Cu', 0, nsum(wf.da_trat_conc, wf.da_rec_conc, wf.varinv), sub => {
    sub('cu_tr', 'Tratamiento', 0, wf.da_trat_conc);
    sub('cu_rc', 'Recuperación',0, wf.da_rec_conc);
    sub('cu_iv', 'Inventario',  0, wf.varinv);
  });

  groupThenSubs('rend', 'Efecto rendimiento insumos',
    nsum(wf.rend_energia_conc, wf.rend_energia_hidro, wf.rend_combustible, wf.rend_acido, wf.rend_bolas, wf.rend_explosivos), 0,
    sub => {
      sub('rn_ec', 'Energía Conc',  wf.rend_energia_conc,  0);
      sub('rn_eh', 'Energía Hidro', wf.rend_energia_hidro, 0);
      sub('rn_cb', 'Combustible',   wf.rend_combustible,   0);
      sub('rn_ac', 'Ácido',         wf.rend_acido,         0);
      sub('rn_bo', 'Bolas',         wf.rend_bolas,         0);
      sub('rn_ex', 'Explosivos',    wf.rend_explosivos,    0);
    });

  groupThenSubs('dev', 'Desarrollo Mina', wf.dev_mina, 0, sub => {
    sub('dev_p', 'Efecto P', wf.dev_mina_cu,  0);
    sub('dev_q', 'Efecto Q', wf.dev_mina_ton, 0);
  });

  applyGroup('inv', 'Efecto inventarios', wf.vi_inv_kus, 0);

  applyGroup('ifrs16', 'IFRS16', wf.ifrs16_kus, 0);

  const efic = wf.c1_r != null && kus != null ? wf.c1_r - kus : null;
  applyGroup('efic', 'Eficiencia / desfases', efic, 0);

  pushMain('onsite_r', 'On Site Real');

  // ── CIERRE REAL ──
  applyGroup('tcrc_r',    'TC/RC',                      wf.tcrc_r_total  != null ? -wf.tcrc_r_total  : null, 0);
  applyGroup('comer_r',   'Comercialización',            wf.comer_r_total != null ? -wf.comer_r_total : null, 0);
  if (wf.precredit_r_costo != null) snapMain('precredit_r', 'Pre-credit Real', wf.precredit_r_costo);
  else pushMain('precredit_r', 'Pre-credit Real');
  applyGroup('subprod_r', 'Subproductos',               wf.subprod_r,    0);
  if (wf.c1_r_costo != null) snapMain('c1_real', 'C1 Real', wf.c1_r_costo);
  else pushMain('c1_real', 'C1 Real');
  applyGroup('da_r_row',  'Depreciación / Amortización', wf.da_r,         0);
  if (wf.c2_r != null) snapMain('c2_real', 'C2 Real', wf.c2_r);
  else pushMain('c2_real', 'C2 Real');
  applyGroup('otros_fin',     'Otros Items Financieros',        wf.otros_fin_r,     0);
  applyGroup('dif_cambio',    'Diferencias de cambio',          wf.dif_cambio_r,    0);
  applyGroup('donaciones',    'Donaciones',                     wf.donaciones_r,    0);
  applyGroup('gasto_expl',    'Gastos Exploraciones',           wf.gasto_expl_r,    0);
  applyGroup('ing_gasto_fin', 'Ingresos y Gastos Financieros',  wf.ing_gasto_fin_r, 0);
  applyGroup('ing_no_op',     'Ingresos No Operacionales',      wf.ing_no_op_r,     0);
  applyGroup('otros_egr',     'Otros egresos operacionales',    wf.otros_egr_op_r,  0);
  if (wf.c3_r != null) snapMain('c3_real', 'C3 Real', wf.c3_r);
  else pushMain('c3_real', 'C3 Real');

  // Efecto TC/RC & Comercialización (real − ppto) en c/lb, solo para el gráfico.
  // tcrc_kus/comer_kus ya son el delta real vs ppto; se convierten a c/lb con
  // la producción presupuestada. chartOnly → no se muestra en la tabla.
  const tcComerKus = nsum(wf.tcrc_kus, wf.comer_kus);
  const budgetKtu  = d?.cu_prod_budget ?? null;
  rows.push({
    id: 'tcrc_comer_ef', label: 'TC/RC & Comerc.', type: 'effect', chartOnly: true,
    dclb: toClb(tcComerKus, budgetKtu),
  });

  return rows;
}

/* Waterfall table component */
const AC_N = (v, dec=0) => v == null ? <span style={{color:'#ccc'}}>—</span>
  : v.toLocaleString('es-CL', {minimumFractionDigits:dec, maximumFractionDigits:dec});
const AC_DCLB = (v) => {
  if (v == null) return <span style={{color:'#ccc'}}>—</span>;
  const col = v < -0.005 ? '#059669' : v > 0.005 ? 'var(--red)' : '#888';
  return <span style={{color:col}}>{v >= 0 ? '+' : ''}{v.toFixed(2)}</span>;
};

const WaterfallTable = React.memo(function WaterfallTable({rows}) {
  const thS = {background:'#1A3A4A', color:'white', padding:'6px 10px', fontSize:'.74rem', fontWeight:600, textAlign:'right', whiteSpace:'nowrap'};
  const thL = {...thS, textAlign:'left', minWidth:'200px'};
  const tdR = {padding:'3px 10px', textAlign:'right', fontSize:'.78rem', whiteSpace:'nowrap'};
  const tdL = {padding:'3px 10px', fontSize:'.79rem', whiteSpace:'nowrap'};

  return (
    <div className="tbl-wrap">
      <table style={{width:'100%', borderCollapse:'collapse', tableLayout:'fixed'}}>
        <colgroup>
          <col style={{width:'220px'}}/>
          <col style={{width:'110px'}}/>
          <col style={{width:'75px'}}/>
          <col style={{width:'90px'}}/>
          <col style={{width:'90px'}}/>
        </colgroup>
        <thead>
          <tr>
            <th style={thL}>Concepto</th>
            <th style={thS}>US$k</th>
            <th style={thS}>ktCuf</th>
            <th style={thS}>c/lb</th>
            <th style={thS}>Δ c/lb</th>
          </tr>
        </thead>
        <tbody>
          {rows.filter(r => !r.chartOnly).map(r => {
            const isMain  = r.type === 'main';
            const isGroup = r.type === 'group';
            const isSub   = r.type === 'sub';
            const bg = isMain ? '#1A3A4A' : isGroup ? '#d4e8ee' : 'white';
            const fg = isMain ? 'white' : '#1A3A4A';
            const fw = (isMain || isGroup) ? 700 : 400;
            const indent = isSub ? '20px' : '0';
            const rowBorderTop = isMain ? '2px solid #1A3A4A' : isGroup ? '1px solid #9ac8d8' : '1px solid #f0f0f0';
            return (
              <tr key={r.id} style={{background:bg, borderTop:rowBorderTop}}>
                <td style={{...tdL, color:fg, fontWeight:fw, paddingLeft:indent}}>{r.label}</td>
                <td style={{...tdR, color:fg, fontWeight:fw}}>{AC_N(r.kus, 0)}</td>
                <td style={{...tdR, color:fg, fontWeight:fw}}>{r.ktu != null ? r.ktu.toFixed(2) : '—'}</td>
                <td style={{...tdR, color:fg, fontWeight:fw}}>{r.clb != null ? r.clb.toFixed(2) : '—'}</td>
                <td style={{...tdR}}>{isMain ? null : AC_DCLB(r.dclb)}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
});

/* ─── Callout metadata (compartido con GraficosTab) ─── */
const CALLOUT_META = {
  act:  {label:'Actividad',     yOffset:  0, rows:[{id:'ac_mn', lbl:'Mov. Mina'}, {id:'ac_cn', lbl:'Planta'}]},
  prod: {label:'Producción Cu', yOffset: 44, rows:[{id:'cu_tr', lbl:'Cu Tratamiento'}, {id:'cu_rc', lbl:'Cu Recuperación'}, {id:'cu_iv', lbl:'Cu Inventario'}]},
  vi:   {label:'Var. Inv. & IFRIC20', yOffset: 0, rows:[{id:'inv',  lbl:'Var. Inv.'}, {id:'ifrs16', lbl:'IFRIC 20'}]},
};

/* ─── Configuración por defecto de barras intermedias del waterfall ─── */
const DELTA_BARS_DEFAULT = [
  {id:'aj',    label:'Ajuste monetario',     wfIds:['aj_mon'],                                    callout:null,   visible:true},
  {id:'pr',    label:'Precio insumos',       wfIds:['pr_ins'],                                    callout:null,   visible:true},
  {id:'rend',  label:'Rendimiento insumos',  wfIds:['rend'],                                      callout:null,   visible:true},
  {id:'ley',   label:'Leyes',                wfIds:['ley'],                                       callout:null,   visible:true},
  {id:'act',   label:'Actividad',            wfIds:['act'],                                       callout:'act',  visible:true},
  {id:'prod',  label:'Producción Cu',        wfIds:['prod_cu'],                                   callout:'prod', visible:true},
  {id:'vi',    label:'Var. Inv. & IFRIC20',  wfIds:['inv','ifrs16'],                              callout:'vi',   visible:true},
  {id:'tcrc',  label:'TC/RC & Comerc.',      wfIds:['tcrc_comer_ef'],                             callout:null,   visible:true},
  {id:'otros', label:'Otros',                wfIds:['dev','efic'],                                callout:null,   visible:true},
];
const WF_BARS_LS_KEY = 'wf_bar_config_v1';

/* ─── Gráfico Waterfall SVG ─── */
function WaterfallSvgChart({rows, title, hiddenCallouts = new Set(), deltaBars = DELTA_BARS_DEFAULT}) {
  if (!rows || !rows.length) return null;

  const byId = {};
  for (const r of rows) byId[r.id] = r;

  const ns = (...ids) => {
    const vs = ids.map(id => byId[id]?.dclb).filter(v => v != null);
    return vs.length ? vs.reduce((a,b)=>a+b,0) : null;
  };
  // Formato contable: negativos entre paréntesis, coma decimal, positivos sin signo
  const fv = (v) => {
    if (v == null) return '—';
    const s = Math.abs(v).toFixed(1).replace('.', ',');
    return v < -0.05 ? `(${s})` : s;
  };
  // Valor absoluto con coma (para totales dentro de barras)
  const fvAbs = (v) => v == null ? '—' : v.toFixed(1).replace('.', ',');

  // Etiquetas en una sola línea (nombre completo, como la imagen)
  const splitLbl = lbl => [lbl];

  // Barras principales
  const bars = [
    {id:'c1_b',  labels:['Costo C1 ppto'],   type:'split',
      clb_net: byId.c1p?.clb,  clb_pre: byId.precredit?.clb},
    {id:'pre_b', labels:['Pre-crédito Ppto'], type:'anchor', clb: byId.precredit?.clb, style:'pre'},
    ...deltaBars.filter(b => b.visible).map(b => ({
      id: b.id,
      labels: splitLbl(b.label),
      type: 'delta',
      dclb: ns(...b.wfIds),
      callout: b.callout || null,
    })),
    {id:'pre_r', labels:['Pre-crédito Real'], type:'anchor', clb: byId.precredit_r?.clb, style:'pre'},
    {id:'c1_r',  labels:['Costo C1 real'],    type:'split',
      clb_net: byId.c1_real?.clb, clb_pre: byId.precredit_r?.clb},
  ];

  // Running total (pivot = Pre-crédito Ppto)
  let running = byId.precredit?.clb ?? null;
  const computed = bars.map(b => {
    if (b.type === 'anchor') {
      if (b.clb != null) running = b.clb;
      return {...b, isNull: b.clb == null};
    }
    if (b.type === 'split') {
      return {...b, isNull: b.clb_pre == null || b.clb_net == null};
    }
    const base = running;
    const d = b.dclb;
    if (running != null && d != null) running = running + d;
    return {...b, base, isNull: d == null};
  });

  // Layout — eje Y siempre desde 0; cajitas de callout dentro del área de gráfico
  const W = 880, H = 380;
  const ML = 46, MR = 10, MT = title ? 62 : 16, MB_LBL = 40;
  const MB = MB_LBL;
  const cH = H - MT - MB;
  const cW = W - ML - MR;
  const n = bars.length;
  const bGap = cW / n;
  const bW = bGap * 0.56;
  const bx = i => ML + i * bGap + (bGap - bW) / 2;
  const bcx = i => bx(i) + bW / 2;   // centro X de barra i

  // Escala Y: incluye 0 y valores negativos (ej. C1 neto negativo cuando el
  // crédito de subproductos supera al pre-crédito, como en CEN).
  const allVals = computed.flatMap(b => {
    if (b.isNull) return [];
    if (b.type === 'split')  return [b.clb_pre, b.clb_net];
    if (b.type === 'anchor') return [b.clb];
    const d = b.dclb ?? 0, base = b.base ?? 0;
    return [base, base + d];
  }).filter(v => v != null && isFinite(v));

  if (!allVals.length) return <p style={{color:'#aaa', textAlign:'center', padding:'24px'}}>Sin datos</p>;

  const vMax = Math.max(...allVals, 0);
  const vMin = Math.min(...allVals, 0);
  const pad  = (vMax - vMin) * 0.08 || 1;
  const yMax = vMax + pad;
  const yMin = vMin < 0 ? vMin - pad : 0;
  const sy = v => MT + cH - ((v - yMin) / (yMax - yMin)) * cH;
  const yBase = sy(0);        // línea de cero (referencia de las barras)
  const chartBottom = MT + cH; // borde inferior (donde van las etiquetas X)

  // Ticks Y (incluye negativos si los hay)
  const rawStep = (yMax - yMin) / 5;
  const texp = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const tickStep = Math.ceil(rawStep / texp) * texp;
  const ticks = [];
  for (let t = Math.ceil(yMin / tickStep) * tickStep; t <= yMax + 0.001; t = Math.round((t + tickStep) * 1e6) / 1e6) ticks.push(t);

  const FILL = {c1:'#1A3A4A', pre:'#1A7080'};
  const CELESTE = '#4EC3C3';
  // Paleta de la imagen: aumentos de costo en rojo, disminuciones en teal/verde
  const GRN = '#4F9D8C', RED = '#C0392B', NEU = '#9aa3a8';

  // Posiciones de barras Pre-crédito para el bracket
  const preBIdx  = computed.findIndex(b => b.id === 'pre_b');
  const preRIdx  = computed.findIndex(b => b.id === 'pre_r');
  const preBClb  = byId.precredit?.clb;
  const preRClb  = byId.precredit_r?.clb;
  const bracketY = MT - 16;  // entre título y área de barras
  const deltaPre = (preBClb != null && preRClb != null) ? preRClb - preBClb : null;
  const pctPre   = (deltaPre != null && preBClb) ? (deltaPre / preBClb * 100) : null;

  // Etiqueta de categoría en el borde inferior (una línea, tamaño uniforme)
  const renderLabel = (lbl, i, fill = '#444') =>
    <text x={bcx(i)} y={chartBottom + 15} textAnchor="middle" fontSize={7} fill={fill}>{lbl}</text>;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:'block', fontFamily:'-apple-system,sans-serif'}}>
      {title && <text x={W/2} y={20} textAnchor="middle" fontSize={11} fontWeight={700} fill="#1A3A4A">{title}</text>}

      {/* Grid + eje Y */}
      {ticks.map((t,i) => (
        <g key={i}>
          <line x1={ML} y1={sy(t)} x2={ML+cW} y2={sy(t)} stroke="#ebebeb" strokeWidth={1}/>
          <text x={ML-4} y={sy(t)+3.5} textAnchor="end" fontSize={8} fill="#999">{t.toFixed(0)}</text>
        </g>
      ))}
      <text x={11} y={MT+cH/2} textAnchor="middle" fontSize={8} fill="#aaa"
        transform={`rotate(-90 11 ${MT+cH/2})`}>c/lb</text>
      <line x1={ML} y1={yBase} x2={ML+cW} y2={yBase} stroke="#bbb" strokeWidth={1}/>

      {/* ── Bracket superior Pre-créd Ppto → Pre-créd Real ── */}
      {deltaPre != null && preBIdx >= 0 && preRIdx >= 0 && (() => {
        const x1 = bcx(preBIdx), x2 = bcx(preRIdx);
        const by = bracketY;
        const col = NEU;
        const lbl = `${deltaPre >= 0 ? '+' : ''}${deltaPre.toFixed(1).replace('.', ',')}${pctPre != null ? ` (${pctPre >= 0 ? '+' : ''}${pctPre.toFixed(0)}%)` : ''}`;
        return (
          <g>
            {/* línea horizontal + bajadas */}
            <line x1={x1} y1={by} x2={x2} y2={by} stroke={col} strokeWidth={1.2}/>
            <line x1={x1} y1={by} x2={x1} y2={sy(preBClb)-2} stroke={col} strokeWidth={1.2}/>
            {/* flecha bajando en x2 */}
            <line x1={x2} y1={by} x2={x2} y2={sy(preRClb)-2} stroke={col} strokeWidth={1.2}/>
            <polygon points={`${x2-4},${sy(preRClb)-2} ${x2+4},${sy(preRClb)-2} ${x2},${sy(preRClb)+5}`} fill={col}/>
            {/* etiqueta */}
            <text x={(x1+x2)/2} y={by-4} textAnchor="middle" fontSize={9} fontWeight={700} fill={col}>{lbl}</text>
          </g>
        );
      })()}

      {/* Conectores dashed entre barras delta consecutivas */}
      {computed.map((b, i) => {
        if (b.type !== 'delta' || b.isNull) return null;
        const nxt = computed[i+1];
        if (!nxt || nxt.type !== 'delta' || nxt.isNull) return null;
        const afterY = sy((b.base ?? 0) + (b.dclb ?? 0));
        return <line key={`c${i}`} x1={bx(i)+bW} y1={afterY} x2={bx(i+1)} y2={afterY}
          stroke="#ccc" strokeWidth={0.8} strokeDasharray="4,2"/>;
      })}

      {/* ── Barras ── */}
      {computed.map((b, i) => {
        if (b.isNull) return (
          <g key={b.id}>{renderLabel(b.labels[0], i, '#ccc')}</g>
        );

        if (b.type === 'split') {
          // C1 neto (color Pre-créd.) + subproductos (clarito). El C1 neto puede ser
          // NEGATIVO (crédito de subprod > pre-crédito): se dibuja bajo la línea de cero.
          const subVal = b.clb_pre - b.clb_net;  // crédito subproductos (segmento claro)
          const yPre = sy(b.clb_pre);            // tope = pre-crédito
          const yNet = sy(b.clb_net);            // frontera = C1 neto
          const yZ   = sy(0);
          // Segmento claro (subproductos): entre C1 neto y pre-crédito
          const lightY = Math.min(yPre, yNet), lightH = Math.max(Math.abs(yNet - yPre), 1);
          // Segmento oscuro (C1 neto): entre 0 y C1 neto (bajo cero si es negativo)
          const darkY  = Math.min(yZ, yNet),    darkH  = Math.max(Math.abs(yNet - yZ), 1);
          return (
            <g key={b.id}>
              <rect x={bx(i)} y={lightY} width={bW} height={lightH} fill="#b0d8e8" rx={2}/>
              <rect x={bx(i)} y={darkY}  width={bW} height={darkH}  fill={FILL.pre} rx={2}/>
              {/* Valores dentro de cada segmento */}
              {lightH > 14 && <text x={bcx(i)} y={lightY + lightH/2 + 3} textAnchor="middle"
                fontSize={9} fontWeight={700} fill="#1A3A4A">{fvAbs(subVal)}</text>}
              {darkH > 14 && <text x={bcx(i)} y={darkY + darkH/2 + 3} textAnchor="middle"
                fontSize={9} fontWeight={700} fill="white">{fvAbs(b.clb_net)}</text>}
              {renderLabel(b.labels[0], i)}
            </g>
          );
        }

        if (b.type === 'anchor') {
          const yTop = sy(b.clb);
          const barH = Math.max(yBase - yTop, 1);
          const fill = FILL[b.style] ?? FILL.c1;
          return (
            <g key={b.id}>
              <rect x={bx(i)} y={yTop} width={bW} height={barH} fill={fill} rx={2}/>
              {barH > 14 && <text x={bcx(i)} y={yTop + barH/2 + 3} textAnchor="middle"
                fontSize={9} fontWeight={700} fill="white">{fvAbs(b.clb)}</text>}
              {renderLabel(b.labels[0], i)}
            </g>
          );
        }

        // Barra delta
        const d = b.dclb ?? 0;
        const base = b.base ?? 0;
        const yTop = sy(Math.max(base, base+d));
        const yBot = sy(Math.min(base, base+d));
        const barH = Math.max(yBot - yTop, 1.5);
        const col = d < -0.01 ? GRN : d > 0.01 ? RED : NEU;

        // Callout: dentro del área del gráfico, debajo de las barras delta
        const calloutMeta = b.callout ? CALLOUT_META[b.callout] : null;
        const showCallout = calloutMeta && !hiddenCallouts.has(b.callout);
        const calloutRows = calloutMeta?.rows ?? [];
        const callBoxW = 116;   // más ancho para nombres completos (Cu Tratamiento, etc.)
        const callBoxH = calloutRows.length * 13 + 6;
        // Posición: 62% del área de barras desde arriba (debajo del nivel de running total)
        const callBoxY = MT + cH * 0.62 + (calloutMeta?.yOffset ?? 0);
        const callBoxX = bcx(i) - callBoxW / 2;

        return (
          <g key={b.id}>
            <rect x={bx(i)} y={yTop} width={bW} height={barH} fill={col} rx={1}/>
            <text x={bcx(i)} y={yTop-3} textAnchor="middle" fontSize={8} fontWeight={700} fill={col}>
              {fv(d)}
            </text>
            {renderLabel(b.labels[0], i)}

            {/* Callout box con desglose */}
            {showCallout && (() => {
              const hasAny = calloutRows.some(s => byId[s.id]?.dclb != null);
              if (!hasAny) return null;
              const barBottomY = Math.max(yTop, yBot);
              return (
                <g>
                  {/* línea vertical de conexión desde base de barra hasta caja */}
                  <line x1={bcx(i)} y1={barBottomY + 2} x2={bcx(i)} y2={callBoxY}
                    stroke="#bbb" strokeWidth={0.8} strokeDasharray="3,2"/>
                  {/* caja gris claro, sin sombra, estilo tabla (como la imagen) */}
                  <rect x={callBoxX} y={callBoxY} width={callBoxW} height={callBoxH}
                    fill="#f2f3f4" stroke="#d9dde0" strokeWidth={0.8} rx={2}/>
                  {calloutRows.map((s, si) => {
                    const sv = byId[s.id]?.dclb;
                    const sc = sv == null ? '#bbb' : sv < -0.01 ? GRN : sv > 0.01 ? RED : '#555';
                    return (
                      <g key={s.id}>
                        <text x={callBoxX+6} y={callBoxY + 11 + si*13}
                          fontSize={7.5} fill="#444">{s.lbl}</text>
                        <text x={callBoxX+callBoxW-5} y={callBoxY + 11 + si*13}
                          textAnchor="end" fontSize={7.5} fontWeight={700} fill={sc}>{fv(sv)}</text>
                      </g>
                    );
                  })}
                </g>
              );
            })()}
          </g>
        );
      })}
    </svg>
  );
}

/* Agrega totales de costos-ajustados para usarlos en el waterfall */
function aggregateCaForWaterfall(caResults) {
  if (!caResults || !caResults.length) return null;
  const ss = (a, b) => (a != null && b != null) ? a + b : (a ?? b);
  const addPeriod = (a, b) => {
    if (!a && !b) return null;
    return {
      real:        ss(a?.real,        b?.real),
      ppto:        ss(a?.ppto,        b?.ppto),
      ppto_aj_tot: ss(a?.ppto_aj_tot, b?.ppto_aj_tot),
      dif:         ss(a?.dif,         b?.dif),
    };
  };
  const merged = { totales: {}, summary: {} };
  for (const ca of caResults) {
    for (const tKey of ['costo_onsite','pre_credito','c1','c2','c3']) {
      const existing = merged.totales[tKey] || {};
      const incoming = ca.totales?.[tKey] || {};
      merged.totales[tKey] = {
        mes: addPeriod(existing.mes, incoming.mes),
        ytd: addPeriod(existing.ytd, incoming.ytd),
      };
    }
    for (const sr of (ca.summary || [])) {
      const existing = merged.summary[sr.key] || {key: sr.key, label: sr.label};
      merged.summary[sr.key] = {
        ...existing,
        mes: addPeriod(existing.mes, sr.mes),
        ytd: addPeriod(existing.ytd, sr.ytd),
      };
    }
  }
  merged.summary = Object.values(merged.summary);
  return merged;
}

/* Rellena campos faltantes del waterfall con datos de costos-ajustados */
function mergeCaIntoExp(expData, caAgg) {
  if (!expData || !caAgg) return expData;
  const smryMap = {};
  for (const s of (caAgg.summary || [])) smryMap[s.key] = s;
  for (const panel of ['mes', 'ytd']) {
    if (!expData.data?.[panel]) { if (!expData.data) expData.data = {}; expData.data[panel] = {waterfall: {}}; }
    if (!expData.data[panel].waterfall) expData.data[panel].waterfall = {};
    const wf  = expData.data[panel].waterfall;
    const tot = caAgg.totales || {};
    const pv  = obj => obj?.[panel];
    const ovr = (key, val) => { if (wf[key] == null && val != null) wf[key] = val; };
    const onsite = pv(tot.costo_onsite);
    ovr('c1_b',     onsite?.ppto);
    ovr('c1_r',     onsite?.real);
    wf['aj_total_ca'] = (onsite?.ppto_aj_tot != null && onsite?.ppto != null)
      ? onsite.ppto_aj_tot - onsite.ppto : null;
    const c1  = pv(tot.c1);
    const pre = pv(tot.pre_credito);
    // c1 nunca puede superar pre_credito (créditos subproductos solo reducen costo)
    const c1ppto = (c1?.ppto != null && pre?.ppto != null) ? Math.min(c1.ppto, pre.ppto) : c1?.ppto;
    const c1real = (c1?.real  != null && pre?.real  != null) ? Math.min(c1.real,  pre.real)  : c1?.real;
    ovr('c1_abs_b',   c1ppto);
    ovr('c1_r_costo', c1real);
    ovr('precredit_b_costo',  pre?.ppto);
    ovr('precredit_r_costo',  pre?.real);
    const c2 = pv(tot.c2);
    ovr('c2_b', c2?.ppto);
    ovr('c2_r', c2?.real);
    const c3 = pv(tot.c3);
    ovr('c3_b', c3?.ppto);
    ovr('c3_r', c3?.real);
    ovr('da_b',            pv(smryMap.da)?.ppto);
    ovr('da_r',            pv(smryMap.da)?.real);
    ovr('subprod_b',       pv(smryMap.credito_subp)?.ppto);
    ovr('subprod_r',       pv(smryMap.credito_subp)?.real);
    ovr('tcrc_b_total',    pv(smryMap.tcrc)?.ppto);
    ovr('tcrc_r_total',    pv(smryMap.tcrc)?.real);
    ovr('comer_b_total',   pv(smryMap.comer)?.ppto);
    ovr('comer_r_total',   pv(smryMap.comer)?.real);
    ovr('otros_fin_r',     pv(smryMap.otros_fin)?.real);
    ovr('dif_cambio_r',    pv(smryMap.dif_cambio)?.real);
    ovr('donaciones_r',    pv(smryMap.donaciones)?.real);
    ovr('gasto_expl_r',    pv(smryMap.gastos_expl)?.real ?? pv(smryMap.gasto_expl)?.real);
    ovr('ing_gasto_fin_r', pv(smryMap.ing_gasto_fin)?.real);
    ovr('ing_no_op_r',     pv(smryMap.ing_no_op)?.real);
    ovr('otros_egr_op_r',  pv(smryMap.otros_egr_op)?.real);
  }
  return expData;
}

function CostSummaryTable({wf, cu_r, cu_b, t2}) {
  const n2 = v => v == null ? null : Math.round(v);
  const clb = (kus, ktu) => (kus != null && ktu != null && ktu > 0)
    ? (kus * 100 / (ktu * B_CLB)) : null;
  const fK  = v => v == null ? <span style={{color:'#ccc'}}>—</span>
    : v.toLocaleString('es-CL', {minimumFractionDigits:0, maximumFractionDigits:0});
  const fC  = v => v == null ? <span style={{color:'#ccc'}}>—</span> : v.toFixed(2);
  const fT  = v => v == null ? <span style={{color:'#ccc'}}>—</span>
    : v.toLocaleString('es-CL', {minimumFractionDigits:2, maximumFractionDigits:2});
  const fVar = (r, b) => {
    if (r == null || b == null) return <span style={{color:'#ccc'}}>—</span>;
    const d = r - b; const col = d < -0.5 ? '#059669' : d > 0.5 ? 'var(--red)' : '#888';
    return <span style={{color:col}}>{d >= 0 ? '+' : ''}{d.toLocaleString('es-CL', {minimumFractionDigits:0, maximumFractionDigits:0})}</span>;
  };
  const fVarC = (r, b) => {
    if (r == null || b == null) return <span style={{color:'#ccc'}}>—</span>;
    const d = r - b; const col = d < -0.005 ? '#059669' : d > 0.005 ? 'var(--red)' : '#888';
    return <span style={{color:col}}>{d >= 0 ? '+' : ''}{d.toFixed(2)}</span>;
  };

  const c3Bridge_r = wf.c3_r != null && wf.c2_r != null ? wf.c3_r - wf.c2_r : null;
  const c3Bridge_b = wf.c3_b != null && wf.c2_b != null ? wf.c3_b - wf.c2_b : null;

  const rows = [
    { label:'C3 Total',          r:n2(wf.c3_r),    b:n2(wf.c3_b),    indent:0, bold:true,  bg:'#1A3A4A', fg:'white' },
    { label:'  Otros / Financ.', r:n2(c3Bridge_r), b:n2(c3Bridge_b), indent:1, bold:false, bg:'white',   fg:'#374151' },
    { label:'C2',                r:n2(wf.c2_r),    b:n2(wf.c2_b),    indent:0, bold:true,  bg:'#d4e8ee', fg:'#1A3A4A' },
    { label:'  D&A',             r:n2(wf.da_r),    b:n2(wf.da_b),    indent:1, bold:false, bg:'white',   fg:'#374151' },
    { label:'C1',                r:n2(wf.c1_r_costo), b:n2(wf.c1_abs_b), indent:0, bold:true, bg:'#d4e8ee', fg:'#1A3A4A' },
    { label:'  TC/RC',    r:n2(wf.tcrc_r_total),b:n2(wf.tcrc_b_total),indent:1, bold:false,bg:'white',  fg:'#374151' },
    { label:'  Comercialización',r:n2(wf.comer_r_total),b:n2(wf.comer_b_total),indent:1,bold:false,bg:'white',fg:'#374151'},
    { label:'Pre-credit', r: n2(wf.precredit_r_costo ?? (wf.c1_r_costo != null && wf.subprod_r != null ? wf.c1_r_costo - wf.subprod_r : null)),
                          b: n2(wf.precredit_b_costo ?? (wf.c1_abs_b != null && wf.subprod_b != null ? wf.c1_abs_b - wf.subprod_b : null)),
                          indent:1, bold:false, bg:'white', fg:'#374151' },
    { label:'  Subprod.', r:n2(wf.subprod_r),  b:n2(wf.subprod_b),  indent:2, bold:false, bg:'white',   fg:'#374151' },
    { label:'Costo Onsite',r:n2(wf.c1_r),      b:n2(wf.c1_b),       indent:0, bold:true,  bg:'#d4e8ee', fg:'#1A3A4A' },
  ];

  const thS = {background:'#1A3A4A',color:'white',padding:'5px 8px',fontSize:'.73rem',fontWeight:600,textAlign:'right',whiteSpace:'nowrap'};
  const thL = {...thS, textAlign:'left', minWidth:'160px'};
  const td  = (bg,fg,bold,indent) => ({
    padding:'4px 8px', fontSize:'.79rem', whiteSpace:'nowrap',
    background:bg, color:fg, fontWeight:bold?700:400,
    paddingLeft: indent > 0 ? `${8 + indent*14}px` : '8px',
  });
  const tdR = (bg,fg,bold) => ({padding:'4px 8px',textAlign:'right',fontSize:'.79rem',whiteSpace:'nowrap',background:bg,color:fg,fontWeight:bold?700:400});

  return (
    <div className="tbl-wrap" style={{marginBottom:'24px'}}>
      <table style={{width:'100%', borderCollapse:'collapse'}}>
        <thead>
          <tr>
            <th style={thL} rowSpan={2}>Concepto</th>
            <th colSpan={3} style={{...thS, borderLeft:'2px solid #3a6a7a', textAlign:'center'}}>US$k</th>
            <th colSpan={3} style={{...thS, borderLeft:'2px solid #F5A800', textAlign:'center'}}>c/lb Cu</th>
          </tr>

            <th style={thS}>{t2||'Ppto'}</th>
            <th style={thS}>Var.</th>
            <th style={{...thS, borderLeft:'2px solid #F5A800'}}>Real</th>
            <th style={thS}>{t2||'Ppto'}</th>

          </tr>
          {rows.map((row, i) => {
            const clbR = clb(row.r, cu_r);
            const clbB = clb(row.b, cu_b);
            return (
              <tr key={i} style={{borderTop: row.bold && row.bg !== 'white' ? '2px solid #1A3A4A' : '1px solid #eee'}}>
                <td style={td(row.bg, row.fg, row.bold, row.indent)}>{row.label}</td>

                <td style={{...tdR(row.bg, row.fg, row.bold), borderLeft:'2px solid #F5A800'}}>{fC(clbR)}</td>
                <td style={tdR(row.bg, row.fg, row.bold)}>{fC(clbB)}</td>
                <td style={tdR(row.bg, row.fg, row.bold)}>{fVarC(clbR, clbB)}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

function AnalisisCostoTab({period, company, setCompany, panel, setPanel}) {
  const {a1fin, m1fin, tipo2} = period;
  const [expData, expLoading, expError, runExp] = useAsyncState();

  function cargar(co) {
    const c = co ?? company;
    const urlExp = x => `/api/explicaciones/${x}?año=${a1fin}&mes=${m1fin}`;
    const urlCa  = x => `/api/costos-ajustados/${x}?año=${a1fin}&mes=${m1fin}`;
    if (c === 'Grupo Minero') {
      runExp(
        Promise.all([
          Promise.all(COMPANIES.map(x => apiGet(urlExp(x)))).then(aggregateExpResults),
          Promise.all(COMPANIES.map(x => apiGet(urlCa(x)))).then(aggregateCaForWaterfall),
        ]).then(([expAgg, caAgg]) => mergeCaIntoExp(expAgg, caAgg))
      );
    } else {
      runExp(
        Promise.all([apiGet(urlExp(c)), apiGet(urlCa(c))])
          .then(([ed, cd]) => mergeCaIntoExp(ed, aggregateCaForWaterfall([cd])))
      );
    }
  }

  React.useEffect(() => { cargar(); }, [a1fin, m1fin, company]);

  const d    = expData?.data?.[panel];
  const wf   = d?.waterfall || {};
  const cu_r = d?.cu_prod_real   ?? null;
  const cu_b = d?.cu_prod_budget ?? null;
  const rows = React.useMemo(() => buildWaterfall(expData, panel, tipo2), [expData, panel, tipo2]);
  const t2   = tipo2 ? tipo2.charAt(0).toUpperCase() + tipo2.slice(1) : 'Ppto';

  return (
    <div className="main">

        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'16px', flexWrap:'wrap', gap:'8px'}}>

    </div>
  );
}

/* ─── Backup Table ─── */
function BackupTable({d}) {
  if (!d) return null;

  const fv = v => {
    if (v == null) return <span style={{color:'#ccc'}}>—</span>;
    const n = Number(v);
    if (isNaN(n)) return '—';
    const dec = (n !== 0 && Math.abs(n) < 0.005) ? 3 : (Math.abs(n) < 1 ? 2 : 1);
    return n.toLocaleString('es-CL', {maximumFractionDigits: dec});
  };
  const fk = v => v != null ? Number(v).toLocaleString('es-CL', {maximumFractionDigits:0}) : <span style={{color:'#ccc'}}>—</span>;
  const fda = (v, unit) => v != null
    ? <span>{Number(v).toLocaleString('es-CL',{maximumFractionDigits:1})} <span style={{fontSize:'.7rem',color:'#999'}}>{unit}</span></span>
    : <span style={{color:'#ccc'}}>—</span>;

          <thead>

              <th style={{...thS, textAlign:'center', background:'#1A3A4A'}}>Unidad</th>
              <th style={thS}>Real</th>

          </thead>

  });

  const saveBarConfig = cfg => { setBarConfig(cfg); try { localStorage.setItem(WF_BARS_LS_KEY, JSON.stringify(cfg)); } catch {} };
  const toggleBarVisible = i => saveBarConfig(barConfig.map((b,idx) => idx===i ? {...b, visible:!b.visible} : b));
  const updateBarLabel   = (i, lbl) => saveBarConfig(barConfig.map((b,idx) => idx===i ? {...b, label:lbl} : b));
  const moveBar = (i, dir) => {
    const nc = [...barConfig], j = i + dir;
    if (j < 0 || j >= nc.length) return;
    [nc[i], nc[j]] = [nc[j], nc[i]];
    saveBarConfig(nc);
  };
  const resetBarConfig = () => saveBarConfig(DELTA_BARS_DEFAULT);

  function exportarPng() {
    const svgEl = document.querySelector('#grafico-export-area svg');
    if (!svgEl) return;
    setExporting(true);

    const PPT_W = 2560, PPT_H = 1440;
    const vbW = 880, vbH = 380;
    const escala = (PPT_W * 0.92) / vbW;
    const dW = vbW * escala, dH = vbH * escala;
    const ox = (PPT_W - dW) / 2, oy = (PPT_H - dH) / 2;

    const clone = svgEl.cloneNode(true);
    clone.setAttribute('width', String(vbW));
    clone.setAttribute('height', String(vbH));
    clone.removeAttribute('style');

    const svgStr = new XMLSerializer().serializeToString(clone);
    const blob = new Blob([svgStr], {type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(blob);

    const fallback = () => {
      html2canvas(document.getElementById('grafico-export-area'), {scale:2, backgroundColor:'#ffffff', useCORS:true}).then(c => {
        const a = document.createElement('a');
        a.download = `Bridge_${company}_${panel.toUpperCase()}_${a1fin}_${String(m1fin).padStart(2,'0')}.png`;
        a.href = c.toDataURL('image/png');
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setExporting(false);
      });
    };

    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = PPT_W; canvas.height = PPT_H;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, PPT_W, PPT_H);
        ctx.drawImage(img, ox, oy, dW, dH);
        const a = document.createElement('a');
        a.download = `Bridge_${company}_${panel.toUpperCase()}_${a1fin}_${String(m1fin).padStart(2,'0')}.png`;
        a.href = canvas.toDataURL('image/png');
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        setExporting(false);
      } catch(e) { URL.revokeObjectURL(url); fallback(); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); fallback(); };
    img.src = url;
  }

  const toggleCallout = key => setHiddenCallouts(prev => {
    const n = new Set(prev);
    n.has(key) ? n.delete(key) : n.add(key);
    return n;
  });

  function cargar(co) {
    const c = co ?? company;
    const urlExp = x => `/api/explicaciones/${x}?año=${a1fin}&mes=${m1fin}`;
    const urlCa  = x => `/api/costos-ajustados/${x}?año=${a1fin}&mes=${m1fin}`;
    if (c === 'Grupo Minero') {
      runExp(
        Promise.all([
          Promise.all(COMPANIES.map(x => apiGet(urlExp(x)))).then(aggregateExpResults),
          Promise.all(COMPANIES.map(x => apiGet(urlCa(x)))).then(aggregateCaForWaterfall),
        ]).then(([expAgg, caAgg]) => mergeCaIntoExp(expAgg, caAgg))
      );
    } else {
      runExp(
        Promise.all([apiGet(urlExp(c)), apiGet(urlCa(c))])
          .then(([ed, cd]) => mergeCaIntoExp(ed, aggregateCaForWaterfall([cd])))
      );
    }
  }

  React.useEffect(() => { cargar(); }, [a1fin, m1fin, company]);

  const rows = React.useMemo(
    () => expData ? buildWaterfall(expData, panel, tipo2) : [],
    [expData, panel, tipo2]
  );
  const t2 = tipo2 ? tipo2.charAt(0).toUpperCase() + tipo2.slice(1) : 'Ppto';
  const compLabel = company === 'Grupo Minero' ? 'Grupo Minero' : (EXP_CO_LABELS[company] || company);

  return (
    <div className="main">
      <div className="card">
        <div className="card-title">Gráficos — Bridge Costo {t2} → Real</div>
        <div style={{marginBottom:'16px'}}>
          <CtrlBar companies={['Grupo Minero',...COMPANIES]} company={company} setCompany={setCompany}
            panel={panel} setPanel={setPanel} onRecalcular={()=>cargar()} loading={expLoading}>
            <button className="btn" onClick={exportarPng} disabled={expLoading || exporting || !expData}
              style={{height:'34px', background:'#1A7080', color:'white', border:'none', borderRadius:'6px',
                      padding:'0 14px', fontWeight:700, fontSize:'.84rem', cursor:'pointer', opacity:(expLoading||exporting||!expData)?0.5:1}}>
              {exporting ? <><span className="spin"/>Exportando…</> : '↓ PNG'}
            </button>
            <button onClick={() => setShowBarConfig(v => !v)}
              style={{height:'34px', background: showBarConfig ? '#edf0f3' : 'white', border:'2px solid #dde',
                      borderRadius:'6px', padding:'0 12px', fontWeight:700, fontSize:'.84rem', cursor:'pointer', color:'#1A3A4A'}}>
              ⚙ Barras
            </button>
          </CtrlBar>
        </div>

        {/* Panel configuración barras */}
        {showBarConfig && (
          <div style={{background:'#f8fafc', border:'1px solid #dde', borderRadius:'8px', padding:'14px', marginBottom:'14px'}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'10px'}}>
              <span style={{fontWeight:700, fontSize:'.82rem', color:'#1A3A4A'}}>Configurar barras intermedias</span>
              <button onClick={resetBarConfig} style={{fontSize:'.75rem', color:'#888', background:'none', border:'1px solid #ddd', borderRadius:'4px', padding:'2px 8px', cursor:'pointer'}}>Restaurar</button>
            </div>
            <div style={{display:'grid', gap:'4px'}}>
              {barConfig.map((bar, i) => (
                <div key={bar.id} style={{display:'flex', gap:'6px', alignItems:'center', padding:'4px 6px', background:'white', border:'1px solid #eee', borderRadius:'5px'}}>
                  <input type="checkbox" checked={bar.visible} onChange={() => toggleBarVisible(i)}
                    style={{cursor:'pointer', accentColor:'var(--teal)'}}/>
                  <input type="text" value={bar.label} onChange={e => updateBarLabel(i, e.target.value)}
                    style={{flex:1, border:'1px solid #ddd', borderRadius:'4px', padding:'2px 7px', fontSize:'.8rem',
                            color: bar.visible ? '#1A3A4A' : '#aaa', fontFamily:'inherit'}}/>
                  <button onClick={() => moveBar(i, -1)} disabled={i===0}
                    style={{padding:'1px 7px', border:'1px solid #ddd', borderRadius:'4px', cursor:'pointer', background:'white',
                            opacity: i===0 ? 0.3 : 1, fontSize:'.8rem'}}>↑</button>
                  <button onClick={() => moveBar(i, 1)} disabled={i===barConfig.length-1}
                    style={{padding:'1px 7px', border:'1px solid #ddd', borderRadius:'4px', cursor:'pointer', background:'white',
                            opacity: i===barConfig.length-1 ? 0.3 : 1, fontSize:'.8rem'}}>↓</button>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Toggles de cajitas de desglose */}
        <div style={{display:'flex', gap:'6px', flexWrap:'wrap', alignItems:'center', marginBottom:'12px'}}>
          <span style={{fontSize:'.75rem', color:'#888', fontWeight:600}}>Detalles:</span>
          {Object.entries(CALLOUT_META).map(([key, meta]) => {
            const active = !hiddenCallouts.has(key);
            return (
              <button key={key} onClick={()=>toggleCallout(key)} style={{
                padding:'3px 12px', border:'2px solid', borderRadius:'12px',
                fontSize:'.78rem', fontWeight:700, cursor:'pointer', transition:'all .15s',
                borderColor: active ? 'var(--teal)' : '#ddd',
                background:  active ? 'var(--teal)' : 'white',
                color:       active ? 'white' : '#aaa',
              }}>
                {meta.label}
              </button>
            );
          })}
        </div>

        {expError && <p style={{color:'var(--red)', fontSize:'.85rem', marginBottom:'8px'}}>{expError}</p>}
        {expLoading && (
          <p style={{color:'#888', textAlign:'center', padding:'48px 0', fontSize:'.9rem'}}>
            <span className="spin"/>Calculando…
          </p>
        )}
        {!expLoading && rows.length > 0 && (
          <div id="grafico-export-area">
            <WaterfallSvgChart rows={rows}
              hiddenCallouts={hiddenCallouts}
              deltaBars={barConfig}
              title={`${compLabel} — Costo ${t2} vs Real · ${panel==='ytd'?'YTD':'Mes'} ${a1fin}/${String(m1fin).padStart(2,'0')}`}
            />
          </div>
        )}
      </div>
    </div>
  );
}

/* ─── Tab: Parámetros Financieros ─── */
const PARAM_ROWS = [
  { kpi:'Dólar', realField:'dolar_real', budgetField:'dolar_budget' },
  { kpi:'IPC',   realField:'ipc_real',   budgetField:'ipc_budget'   },
  { kpi:'CPI',   realField:'cpi_real',   budgetField:'cpi_budget'   },
];

function ParamsTab({period}) {
  const {tipo1, a1ini, m1ini, a1fin, m1fin, tipo2, a2ini, m2ini, a2fin, m2fin} = period;
  const [params,    setParams]    = useState(null);
  const [fp,        setFp]        = useState(null);
  const [saving,    setSaving]    = useState(false);
  const [saved,     setSaved]     = useState(false);
  const [fvCompany, setFvCompany] = useState('MLP');

  React.useEffect(() => {
    apiGet('/api/params').then(d => setParams(d)).catch(()=>{});
    apiGet('/api/calculos/formula-params').then(d => setFp(d)).catch(()=>{});
  }, []);

  /* Ctrl+S guarda desde teclado (ref para evitar stale closure) */
  const _saveRef = useRef(null);
  React.useEffect(() => {
    const h = e => { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); _saveRef.current?.(); } };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, []);

  const cols1 = useMemo(() => buildColumns(a1ini, m1ini, a1fin, m1fin), [a1ini, m1ini, a1fin, m1fin]);
  const cols2 = useMemo(() => buildColumns(a2ini, m2ini, a2fin, m2fin), [a2ini, m2ini, a2fin, m2fin]);

  if (!params) return <div style={{padding:'32px'}} className="hint">Cargando...</div>;

  const getVal = (field, year, month) => {
    const v = params.kpis?.[year]?.[month]?.[field];
    return v == null ? '' : v;
  };

  const setVal = (field, year, month, raw) => {
    const val = raw === '' ? null : parseFloat(raw);
    setParams(p => ({
      ...p,
      kpis: {
        ...p.kpis,
        [year]: {
          ...(p.kpis?.[year] || {}),
          [month]: {
            ...(p.kpis?.[year]?.[month] || {}),
            [field]: isNaN(val) ? null : val,
          }
        }
      }
    }));
    setSaved(false);
  };

  const setExpTc = (company, raw) => {
    const val = raw === '' ? null : parseFloat(raw);
    setParams(p => ({
      ...p,
      exp_tc: { ...p.exp_tc, [company]: isNaN(val) ? null : val }
    }));
    setSaved(false);
  };

  const setFijoVar = (idx, raw) => {
    const val = raw === '' ? null : Math.min(1, Math.max(0, parseFloat(raw) / 100));
    setParams(p => {
      const arr = [...(p.costos_fijo_var?.[fvCompany] || [])];
      arr[idx] = { ...arr[idx], fijo: isNaN(val) ? arr[idx].fijo : val };
      return { ...p, costos_fijo_var: { ...(p.costos_fijo_var || {}), [fvCompany]: arr } };
    });
    setSaved(false);
  };

  const setKpiKey = (key, val) => {
    setFp(f => ({...f, kpi_keys: {...(f?.kpi_keys || {}), [key]: val}}));
    setSaved(false);
  };

  // Paste from Excel: TSV data fills consecutive cells right → down
  function handlePaste(ri, isReal, startCi, e) {
    const text = e.clipboardData.getData('text');
    if (!text.includes('\t') && !text.split('\n').filter(Boolean).length > 1) return;
    e.preventDefault();
    const pasteRows = text.replace(/\r/g, '').trim().split('\n').map(r => r.split('\t'));
    pasteRows.forEach((pasteRow, pr) => {
      const absRow   = 2 * ri + (isReal ? 0 : 1) + pr;
      const targetRi = Math.floor(absRow / 2);
      const targetIsReal = absRow % 2 === 0;
      if (targetRi >= PARAM_ROWS.length) return;
      const { realField, budgetField } = PARAM_ROWS[targetRi];
      const field = targetIsReal ? realField : budgetField;
      const targetCols = targetIsReal ? cols1 : cols2;
      pasteRow.forEach((cell, pc) => {
        const ci = startCi + pc;
        if (ci >= targetCols.length) return;
        const { year, month } = targetCols[ci];
        // Normalize decimal separator from Excel locale variants
        // "1.881,96" → "1881.96" | "881,96" → "881.96" | "881.96" → "881.96"
        const raw = cell.trim();
        const hasDot   = raw.includes('.');
        const hasComma = raw.includes(',');
        const val = (hasDot && hasComma)
          ? raw.replace(/\./g, '').replace(',', '.')   // dot=thousands, comma=decimal
          : hasComma
            ? raw.replace(',', '.')                    // comma=decimal
            : raw;                                     // standard or integer
        setVal(field, year, month, val);
      });
    });
    setSaved(false);
  }

  const handleSave = () => {
    setSaving(true);
    const saves = [apiPost('/api/params', params)];
    if (fp) saves.push(apiPut('/api/calculos/formula-params', fp));
    Promise.all(saves)
      .then(() => { setSaved(true); showToast('Guardado correctamente', 'ok'); })
      .catch(e => showToast(e.message || 'Error al guardar'))
      .finally(() => setSaving(false));
  };
  _saveRef.current = handleSave;

  return (
    <div className="main">
      <div className="card">
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:'20px'}}>
        <div className="card-title" style={{margin:0}}>Parámetros Económicos</div>
        <button onClick={handleSave} disabled={saving} className="btn btn-primary" style={{fontSize:'.88rem'}}
          title="Guardar (Ctrl+S)">
          {saving ? 'Guardando...' : saved ? '✓ Guardado' : 'Guardar'}
          {!saving && !saved && <span style={{fontSize:'.72rem', opacity:.65, marginLeft:'6px', fontWeight:400}}>Ctrl+S</span>}
        </button>
      </div>

      <div className="tbl-wrap" style={{marginBottom:'28px'}}>
        <table>
          <thead>
            <tr>
              <th rowSpan={2} style={{verticalAlign:'middle', minWidth:'70px'}}>KPI</th>
              <th className="tbl-th-c1" style={{textAlign:'center', borderLeft:'2px solid #4EC3C3'}}>{tipo1||'Comp 1'}</th>
              {cols1.map((c,i)=><th key={i} className="tbl-th-c1" style={{textAlign:'center'}}>{c.label}</th>)}
            </tr>
            <tr>
              <th className="tbl-th-c2" style={{textAlign:'center', borderLeft:'2px solid #F5A800'}}>{tipo2||'Comp 2'}</th>
              {cols2.map((c,i)=><th key={i} className="tbl-th-c2" style={{textAlign:'center'}}>{c.label}</th>)}
            </tr>
          </thead>
          <tbody>
            {PARAM_ROWS.map(({kpi, realField, budgetField}, ri) => (
              <React.Fragment key={kpi}>
                <tr style={{background: ri%2===0?'white':'#f8fafb'}}>
                  <td rowSpan={2} className="params-td" style={{fontWeight:700, verticalAlign:'middle', borderRight:'2px solid #e0e0e0'}}>{kpi}</td>
                  <td className="viz-tag1" style={{fontWeight:600, fontSize:'.78rem'}}>{tipo1||'Comp 1'}</td>
                  {cols1.map((c,i)=>(
                    <td key={i} className="params-td">
                      <input type="number" className="params-inp" value={getVal(realField, c.year, c.month)}
                        onChange={e=>setVal(realField, c.year, c.month, e.target.value)}
                        onPaste={e=>handlePaste(ri, true, i, e)}/>
                    </td>
                  ))}
                </tr>
                <tr style={{background: ri%2===0?'white':'#f8fafb', borderBottom:'2px solid #e5e7eb'}}>
                  <td className="viz-tag2" style={{fontWeight:600, fontSize:'.78rem'}}>{tipo2||'Comp 2'}</td>
                  {cols2.map((c,i)=>(
                    <td key={i} className="params-td">
                      <input type="number" className="params-inp" value={getVal(budgetField, c.year, c.month)}
                        onChange={e=>setVal(budgetField, c.year, c.month, e.target.value)}
                        onPaste={e=>handlePaste(ri, false, i, e)}/>
                    </td>
                  ))}
                </tr>
              </React.Fragment>
            ))}
          </tbody>
        </table>
      </div>

      <h3 style={{color:'var(--navy)', fontSize:'.95rem', marginBottom:'12px'}}>Exposición a Tipo de Cambio</h3>
      <div style={{display:'flex', gap:'20px', flexWrap:'wrap', marginBottom:'28px'}}>
        {['GM', ...COMPANIES].map(co => (
          <div key={co} style={{display:'flex', flexDirection:'column', gap:'4px', alignItems:'center',
            background:'white', border:'1px solid #e0e0e0', borderRadius:'8px', padding:'12px 18px', minWidth:'90px',
            ...(co === 'GM' ? {borderColor:'var(--teal)', boxShadow:'0 0 0 1px var(--teal)'} : {})}}>
            <span style={{fontWeight:700, color: co === 'GM' ? 'var(--teal)' : 'var(--navy)', fontSize:'.9rem'}}>{co}</span>
            <div style={{display:'flex', alignItems:'center', gap:'3px'}}>
              <input type="number" min="0" max="100" step="0.1"
                className="params-inp" style={{width:'60px'}}
                value={params.exp_tc?.[co] == null ? '' : params.exp_tc[co]}
                onChange={e=>setExpTc(co, e.target.value)}/>
              <span style={{fontSize:'.85rem', color:'#666'}}>%</span>
            </div>
          </div>
        ))}
      </div>

      <h3 style={{color:'var(--navy)', fontSize:'.95rem', marginBottom:'4px'}}>Estructura Fijo / Variable por Área de Costo</h3>
      <p style={{fontSize:'.8rem', color:'#888', marginBottom:'10px'}}>
        Proporción fija del presupuesto (no escala con volumen). Variable = 100% − Fijo. Varía por compañía.
      </p>
      <div style={{marginBottom:'10px'}}>
        <CtrlBar companies={COMPANIES} company={fvCompany} setCompany={setFvCompany}/>
      </div>
      <table style={{width:'100%', borderCollapse:'collapse', fontSize:'.84rem', maxWidth:'480px'}}>
        <thead>
          <tr style={{background:'#f3f4f6'}}>
            <th style={{padding:'7px 14px', textAlign:'left', fontWeight:600, color:'#374151'}}>Área</th>
            <th style={{padding:'7px 14px', textAlign:'center', fontWeight:600, color:'#374151', width:'100px'}}>% Fijo</th>
            <th style={{padding:'7px 14px', textAlign:'center', fontWeight:600, color:'#374151', width:'100px'}}>% Variable</th>
          </tr>
        </thead>
        <tbody>
          {(params.costos_fijo_var?.[fvCompany] || []).map((row, idx) => {
            const fijoDisplay = row.fijo == null ? '' : Math.round(row.fijo * 1000) / 10;
            const varDisplay  = row.fijo == null ? '' : Math.round((1 - row.fijo) * 1000) / 10;
            return (
              <tr key={row.key} style={{borderTop:'1px solid #f0f0f0', background: idx%2===0?'white':'#fafafa'}}>
                <td style={{padding:'7px 14px', color:'#374151', fontWeight:500}}>{row.label}</td>
                <td style={{padding:'5px 14px', textAlign:'center'}}>
                  <div style={{display:'flex', alignItems:'center', justifyContent:'center', gap:'3px'}}>
                    <input type="number" min="0" max="100" step="1"
                      className="params-inp" style={{width:'58px', textAlign:'right'}}
                      value={fijoDisplay}
                      onChange={e => setFijoVar(idx, e.target.value)}/>
                    <span style={{fontSize:'.8rem', color:'#888'}}>%</span>
                  </div>
                </td>
                <td style={{padding:'7px 14px', textAlign:'center', color:'#666', fontStyle:'italic'}}>
                  {varDisplay !== '' ? `${varDisplay}%` : '—'}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>

      <h3 style={{color:'var(--navy)', fontSize:'.95rem', margin:'24px 0 4px'}}>% Fijo por Sub-área — Costos Ajustados</h3>
      <p style={{fontSize:'.8rem', color:'#888', marginBottom:'10px'}}>
        % Fijo aplicado al presupuesto antes de ajustar por FX/IPC. El componente variable no se ajusta.
      </p>
      <table style={{width:'100%', borderCollapse:'collapse', fontSize:'.84rem', maxWidth:'520px'}}>
        <thead>
          <tr style={{background:'#f3f4f6'}}>
            <th style={{padding:'7px 14px', textAlign:'left', fontWeight:600, color:'#374151'}}>Grupo / Sub-área</th>
            <th style={{padding:'7px 14px', textAlign:'center', fontWeight:600, color:'#374151', width:'100px'}}>% Fijo</th>
            <th style={{padding:'7px 14px', textAlign:'center', fontWeight:600, color:'#374151', width:'100px'}}>% Variable</th>
          </tr>
        </thead>
        <tbody>
          {(params.costos_aj_grupos?.[fvCompany] || []).flatMap((grp, gi) =>
            (grp.subareas || []).map((sa, si) => {
              const fd = sa.fijo == null ? '' : Math.round(sa.fijo * 1000) / 10;
              const vd = sa.fijo == null ? '' : Math.round((1 - sa.fijo) * 1000) / 10;
              return (
                <tr key={`${gi}-${si}`} style={{borderTop:'1px solid #f0f0f0', background: si%2===0?'white':'#fafafa'}}>
                  <td style={{padding:'7px 14px', color:'#374151', fontWeight:500}}>
                    <span style={{fontSize:'.72rem', color:'#aaa', marginRight:'6px'}}>{grp.label}</span>{sa.label}
                  </td>
                  <td style={{padding:'5px 14px', textAlign:'center'}}>
                    <div style={{display:'flex', alignItems:'center', justifyContent:'center', gap:'3px'}}>
                      <input type="number" min="0" max="100" step="1" className="params-inp" style={{width:'58px', textAlign:'right'}}
                        value={fd}
                        onChange={e => {
                          const val = e.target.value === '' ? null : Math.min(1, Math.max(0, parseFloat(e.target.value) / 100));
                          setParams(p => {
                            const gs = JSON.parse(JSON.stringify(p.costos_aj_grupos || {}));
                            if (!gs[fvCompany]) return p;
                            if (!gs[fvCompany][gi]?.subareas?.[si]) return p;
                            gs[fvCompany][gi].subareas[si].fijo = isNaN(val) ? sa.fijo : val;
                            return {...p, costos_aj_grupos: gs};
                          });
                          setSaved(false);
                        }}/>
                      <span style={{fontSize:'.8rem', color:'#888'}}>%</span>
                    </div>
                  </td>
                  <td style={{padding:'7px 14px', textAlign:'center', color:'#666', fontStyle:'italic'}}>
                    {vd !== '' ? `${vd}%` : '—'}
                  </td>
                </tr>
              );
            })
          )}
        </tbody>
      </table>
      </div>
    </div>
  );
}

/* ─── Explicaciones: module-level helpers (stable references across renders) ─── */
const EXP_TBL = {width:'100%', borderCollapse:'collapse', fontSize:'.8rem', tableLayout:'fixed'};
const EXP_CKpi  = {padding:'4px 8px', fontWeight:500, fontSize:'.8rem'};
const EXP_CUnit = {padding:'3px 6px', color:'#888', textAlign:'center', fontSize:'.73rem', whiteSpace:'nowrap'};
const EXP_CVal  = {padding:'3px 8px', textAlign:'right', fontSize:'.79rem', whiteSpace:'nowrap'};
const EXP_CEf   = {padding:'3px 8px', textAlign:'right', fontSize:'.79rem', whiteSpace:'nowrap', width:'90px'};

function expFmtN(v) {
  if (v == null) return <span style={{color:'#bbb'}}>—</span>;
  return Number(v).toLocaleString('es-CL', {maximumFractionDigits:3});
}

/* Control de decimales por columna: stepper flotante elegante al hover */
function ExpDecHeaderLight({ label, value, onChange }) {
  const [hover, setHover] = useState(false);
  const step = (e, dir) => { e.stopPropagation(); onChange(Math.min(4, Math.max(0, value + dir))); };
  const btn = dis => ({
    border:'none', background:'transparent', padding:'0 5px', margin:0,
    color: dis ? 'var(--border)' : 'var(--teal)', cursor: dis ? 'default' : 'pointer',
    fontSize:13, lineHeight:1, fontFamily:'inherit', fontWeight:700,
    display:'flex', alignItems:'center', height:'100%',
  });
  return (
    <div onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{position:'relative', display:'inline-flex', alignItems:'center',
        justifyContent:'flex-end', gap:5, minHeight:18, cursor:'default'}}>
      <span>{label}</span>
      {/* ícono sutil de decimales — solo señala que es ajustable, sin número */}
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        strokeWidth="2.5" strokeLinecap="round"
        style={{opacity: hover ? 0 : .35, transition:'opacity .12s'}}>
        <circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"/>
      </svg>
      {/* stepper flotante (aparece al hover, no empuja el texto) */}
      {hover && (
        <div onClick={e => e.stopPropagation()}
          style={{position:'absolute', top:'50%', right:0, transform:'translateY(-50%)',
            display:'flex', alignItems:'center', height:21,
            background:'var(--gray-soft)', border:'1px solid var(--border)',
            borderRadius:7, boxShadow:'var(--shadow-sm)', overflow:'hidden', zIndex:5}}>
          <button onClick={e => step(e,-1)} disabled={value<=0} style={btn(value<=0)}>−</button>
          <span style={{fontSize:10, fontWeight:700, color:'var(--navy)', minWidth:13,
            textAlign:'center', borderLeft:'1px solid var(--border)',
            borderRight:'1px solid var(--border)', padding:'0 2px'}}>{value}</span>
          <button onClick={e => step(e,1)} disabled={value>=4} style={btn(value>=4)}>+</button>
        </div>
      )}
    </div>
  );
}

const ExpTblHead = React.memo(function ExpTblHead({title, colDec, setColDec}) {
  // Mockup: cabecera clara — fondo blanco, texto gris en mayúsculas, borde inferior
  const thSt = {padding:'8px', fontSize:'.7rem', color:'var(--text-muted)', background:'transparent',
    fontWeight:700, whiteSpace:'nowrap', textTransform:'uppercase', letterSpacing:'.05em',
    borderBottom:'1px solid var(--border)'};
  return (
    <thead>
      <tr>
        <th style={{...thSt, textAlign:'left', minWidth:'140px', fontSize:'.86rem', color:'var(--navy)',
          padding:'9px 10px', letterSpacing:'0', textTransform:'none', fontWeight:800}}>{title}</th>
        <th style={{...thSt, textAlign:'center', width:'64px'}}>Ud.</th>
        <th style={{...thSt, textAlign:'right', width:'88px'}}>
          {colDec ? <ExpDecHeaderLight label="Real" value={colDec.real} onChange={v => setColDec(d=>({...d,real:v}))}/> : 'Real'}
        </th>
        <th style={{...thSt, textAlign:'right', width:'88px'}}>
          {colDec ? <ExpDecHeaderLight label="Ppto" value={colDec.ppto} onChange={v => setColDec(d=>({...d,ppto:v}))}/> : 'Ppto'}
        </th>

        </th>
      </tr>

});

/* V2-style group header: left color border, teal soft bg */
const ExpSecHd = React.memo(function ExpSecHd({label, total, cols=5, tone}) {
  // Mockup: solo borde izquierdo de color + título oscuro sobre fondo blanco (sin banda teal)
  const borderColor = tone==='pos' ? '#16a368' : tone==='neg' ? '#d4453a' : 'var(--teal-lt)';
  return (
    <tr>
      <td colSpan={cols} style={{
        background:'transparent', color:'var(--navy)', fontWeight:700,
        padding:'9px 10px 6px 12px', fontSize:'.7rem',
        letterSpacing:'.06em', textTransform:'uppercase',
        borderLeft:`3px solid ${borderColor}`,
      }}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
          <span>{label}</span>
          {total != null && (
            <span style={{fontWeight:700, fontSize:'.78rem', textTransform:'none', letterSpacing:0,
              color: tone==='pos'?'#16a368': tone==='neg'?'#d4453a':'inherit'}}>{total}</span>
          )}
        </div>
      </td>
    </tr>
  );
});

function expFmtNDec(v, dec) {
  if (v == null) return <span style={{color:'#bbb'}}>—</span>;
  return Number(v).toLocaleString('es-CL', {minimumFractionDigits:dec, maximumFractionDigits:dec});
}

const ExpRow = React.memo(function ExpRow({label, unit, real, ppto, efNode, alt, indent, colDec}) {
  const decR = colDec?.real ?? 3;
  const decP = colDec?.ppto ?? 3;
  return (
    <tr className={`exp-row${alt?' alt':''}`}>
      <td style={{...EXP_CKpi, background:'transparent', paddingLeft: indent ? '28px' : undefined}}>{label}</td>
      <td style={EXP_CUnit}>{unit}</td>
      <td style={EXP_CVal}>{expFmtNDec(real, decR)}</td>
      <td style={EXP_CVal}>{expFmtNDec(ppto, decP)}</td>
      <td style={EXP_CEf}>{efNode}</td>
    </tr>
  );
});

/* ─── EfPopover: detalle de un efecto al hacer click ─── */
function EfPopover({pop, onClose}) {
  if (!pop) return null;
  const {label, unit, real, ppto, kus, ktcuf, clb, clbDec, cprod, calc, x, y} = pop;
  const delta = (real != null && ppto != null) ? real - ppto : null;
  const deltaPct = (delta != null && ppto && ppto !== 0) ? (delta / ppto * 100) : null;
  const fmt = v => v == null ? '—' : Number(v).toLocaleString('es-CL', {maximumFractionDigits:3});
  const col = v => v == null ? '#888' : v > 0.001 ? '#dc2626' : v < -0.001 ? '#059669' : '#888';
  // Viewport clamping
  const W = 240;
  const left = Math.min(x, window.innerWidth - W - 12);
  const top  = y + 6;
  return (
    <div style={{
      position:'fixed', left, top, width:W,
      background:'white', border:'1px solid #d0d8e0', borderRadius:'8px',
      boxShadow:'0 6px 20px rgba(0,0,0,.14)', padding:'11px 13px',
      zIndex:9999, fontSize:'.77rem', lineHeight:1.5,
    }} onClick={e => e.stopPropagation()}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center',
                   fontWeight:700, marginBottom:'7px', borderBottom:'1px solid #eee', paddingBottom:'5px'}}>
        <span>{label}{unit ? <span style={{fontWeight:400, color:'#aaa', marginLeft:4}}>[{unit}]</span> : null}</span>
        <span style={{cursor:'pointer', color:'#aaa', fontSize:'.85rem', lineHeight:1}} onClick={onClose}>✕</span>
      </div>
      <table style={{width:'100%', borderCollapse:'collapse', marginBottom:'7px'}}>
        <tbody>
          <tr>
            <td style={{color:'#666', paddingRight:10, paddingBottom:2}}>Real</td>
            <td style={{textAlign:'right', paddingBottom:2}}>{fmt(real)}</td>
          </tr>
          <tr>
            <td style={{color:'#666', paddingBottom:2}}>Ppto</td>
            <td style={{textAlign:'right', paddingBottom:2}}>{fmt(ppto)}</td>
          </tr>
          {delta != null && (
            <tr>
              <td style={{color:'#666'}}>Δ real − ppto</td>
              <td style={{textAlign:'right', fontWeight:600, color:col(delta)}}>
                {delta >= 0 ? '+' : ''}{fmt(delta)}
                {deltaPct != null ? <span style={{fontWeight:400, color:'#888', marginLeft:4}}>
                  ({deltaPct >= 0 ? '+' : ''}{deltaPct.toFixed(1)}%)
                </span> : null}
              </td>
            </tr>
          )}
        </tbody>
      </table>
      {kus != null && (
        <div style={{borderTop:'1px solid #eee', paddingTop:'7px'}}>
          <div style={{color:'#666', marginBottom:3}}>Efecto en kUS$:</div>
          <div style={{fontWeight:600, color:col(-kus)}}>{kus >= 0 ? '+' : ''}{(kus/1000).toFixed(2)} MUS$</div>
          {calc && (
            <div style={{marginTop:6}}>
              <div style={{color:'#666', marginBottom:2}}>Cómo se calcula:</div>
              <div style={{fontFamily:'monospace', fontSize:'.71rem', color:'#555', lineHeight:1.7,
                           background:'#f8fafc', borderRadius:4, padding:'4px 6px'}}>
                {calc.metodo === 'precio_insumo' && (<>
                  (tarifa real − ppto) × consumo real{calc.escala !== 1 ? ' ÷ 1.000' : ''}<br/>
                  ({fmt(calc.tarifa_real)} − {fmt(calc.tarifa_ppto)}) × {fmt(calc.consumo_real)}{calc.escala !== 1 ? ' ÷ 1.000' : ''}<br/>
                  = {fmt(calc.delta_tarifa)} {calc.tarifa_unit} × {fmt(calc.consumo_real)} {calc.consumo_unit}
                </>)}
                {calc.metodo === 'rendimiento' && (<>
                  (rend. real − ppto) × {calc.base_lbl} × tarifa ppto{calc.escala !== 1 ? ' × escala' : ''}<br/>
                  ({fmt(calc.rend_real)} − {fmt(calc.rend_ppto)}) {calc.rend_unit} × {fmt(calc.base)} {calc.base_unit} × {fmt(calc.tarifa_ppto)} {calc.tarifa_unit}<br/>
                  = Δ {fmt(calc.delta_rend)} {calc.rend_unit} valorizado a precio ppto
                </>)}
                {calc.metodo === 'ajuste_monetario' && (<>
                  gasto base × {calc.fraccion_lbl} × ({calc.ratio_lbl} − 1)<br/>
                  {fmt(calc.gasto_base)} kUS$ × {(calc.fraccion*100).toFixed(0)}% × ({fmt(calc.ratio_num)}/{fmt(calc.ratio_den)} − 1)<br/>
                  = {fmt(calc.gasto_base)} × {fmt(calc.fraccion)} × ({fmt(calc.ratio)} − 1)
                </>)}
                <br/><span style={{fontWeight:700, color:col(-kus)}}>= {kus >= 0 ? '+' : ''}{(kus/1000).toFixed(3)} MUS$</span>
              </div>
            </div>
          )}
          {cprod != null && cprod > 0 && clb != null && (
            <div style={{marginTop:6}}>
              <div style={{color:'#666', marginBottom:2}}>Conversión a c/lb:</div>
              <div style={{fontFamily:'monospace', fontSize:'.71rem', color:'#555', lineHeight:1.7,
                           background:'#f8fafc', borderRadius:4, padding:'4px 6px'}}>
                {(kus/1000).toFixed(3)} MUS$ × 100<br/>
                ÷ ({cprod.toFixed(3)} ktCuf × 2,204.62)<br/>
                <span style={{fontWeight:700, color:col(-kus)}}>= {clb >= 0 ? '+' : ''}{clb.toFixed(clbDec)} c/lb</span>
              </div>
            </div>
          )}
        </div>
      )}
      {ktcuf != null && kus == null && (
        <div style={{borderTop:'1px solid #eee', paddingTop:'7px'}}>
          <div style={{color:'#666', marginBottom:3}}>Efecto en ktCuf:</div>
          <div style={{fontWeight:600, color:col(-ktcuf)}}>{ktcuf >= 0 ? '+' : ''}{ktcuf.toFixed(clbDec)} ktCuf</div>
        </div>
      )}
    </div>
  );
}

/* ─── Tab: Explicaciones ─── */
const EXP_CO_LABELS = {MLP:'Los Pelambres', CEN:'Centinela', ANT:'Antucoya', CMZ:'Zaldívar'};

function ExplicacionesTab({period, company, expAño, expMes, expPanel, expColDec, setExpColDec, expCargar}) {
  const expCompany = company; // 'Todas' or a company code — managed by App
  const colDec = expColDec;
  const setColDec = setExpColDec;
  const [efPop, setEfPop] = useState(null);
  useEffect(() => {
    if (!efPop) return;
    const h = () => setEfPop(null);
    document.addEventListener('click', h);
    return () => document.removeEventListener('click', h);
  }, [efPop]);
  const año = expAño;
  const mes = expMes;
  const panel = expPanel;
  const [data, loading, error, run] = useAsyncState();

  /* Carga cuando cambia año, mes, compañía o se pulsa Cargar */
  useEffect(() => { cargar(); }, [año, mes, expCompany, expCargar]);

  function cargar() {
    const url = x => `/api/explicaciones/${x}?año=${año}&mes=${mes}`;
    if (expCompany === 'Grupo Minero') {
      run(Promise.all(COMPANIES.map(x => apiGet(url(x)))).then(aggregateExpResults));
    } else if (expCompany === 'Todas') {
      run(Promise.all(COMPANIES.map(x => apiGet(url(x)))).then(results => ({
        _todas: true,
        byCompany: Object.fromEntries(COMPANIES.map((c, i) => [c, results[i]])),
      })));
    } else {
      run(apiGet(url(expCompany)));
    }
  }

  /* Renderiza un panel completo para un pd dado, con sus propias funciones de formato */
  function renderPanel(pd, compLabel) {
    if (!pd) return null;
    const cprod = pd.cu_prod_real;
    const toC = ef => (ef == null || cprod == null || cprod === 0) ? null : ef * 100 / (cprod * 2204.62);
    const smC = rows => { let t=null; for(const r of rows){const v=toC(r.efecto_kus); if(v!=null)t=(t||0)+v;} return t; };
    const smK = rows => { let t=null; for(const r of rows){if(r.efecto_ktcuf!=null)t=(t||0)+r.efecto_ktcuf;} return t; };
    const decEf = colDec.efecto ?? colDec.real; // columna Efecto con sus propios decimales
    const fC = v => { if(v==null)return <span style={{color:'#bbb'}}>—</span>; const col=v<0?'var(--red)':v>0?'#059669':'inherit'; return <span style={{color:col,fontWeight:700}}>{v>=0?'+':''}{v.toFixed(decEf)} c/lb</span>; };
    const fK = v => { if(v==null)return <span style={{color:'#bbb'}}>—</span>; const col=v<0?'var(--red)':v>0?'#059669':'inherit'; return <span style={{color:col,fontWeight:700}}>{v>=0?'+':''}{v.toFixed(decEf)} ktCuf</span>; };
    const toneOf = v => v == null ? null : v < 0 ? 'neg' : v > 0 ? 'pos' : null;
    const wrap = (node, detail) => {
      if (detail.kus == null && detail.ktcuf == null) return node;
      return (
        <span style={{cursor:'pointer', borderBottom:'1px dotted currentColor', display:'inline-block'}}
          onClick={e => {
            e.stopPropagation();
            const rc = e.currentTarget.getBoundingClientRect();
            setEfPop({...detail, cprod, clbDec:decEf, x:rc.left, y:rc.bottom});
          }}>
          {node}
        </span>
      );
    };
    const ajTot=smC(pd.ajuste_monetario), piTot=smC(pd.precio_insumos), rendTot=smC(pd.rendimiento), prodTot=smK(pd.produccion);
    return (
      <div className="card" key={compLabel}>
        {compLabel && (
          <div style={{fontWeight:700, fontSize:'1rem', color:'var(--teal)',
            borderBottom:'2px solid var(--teal)', paddingBottom:'6px', marginBottom:'10px'}}>
            {compLabel}
          </div>
        )}
        <div style={{overflowX:'auto'}}>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px', minWidth:'640px'}}>
            <table style={EXP_TBL}>
              <ExpTblHead title="Insumos" colDec={colDec} setColDec={setColDec}/>
              <tbody>
                <ExpSecHd label="Ajuste Monetario" total={fC(ajTot)} tone={toneOf(ajTot)}/>
