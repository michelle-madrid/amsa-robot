  );
}

function ExpRow({label, unit, real, ppto, efNode, alt, indent}) {
  const bg = alt ? '#f8fafb' : 'white';
  return (
    <tr style={{background:bg}}>
      <td style={{...EXP_CKpi, background:bg, paddingLeft: indent ? '28px' : undefined}}>{label}</td>
      <td style={EXP_CUnit}>{unit}</td>
      <td style={EXP_CVal}>{expFmtN(real)}</td>
      <td style={EXP_CVal}>{expFmtN(ppto)}</td>
      <td style={EXP_CEf}>{efNode}</td>
    </tr>
  );
}

/* ─── Tab: Explicaciones ─── */
const EXP_CO_LABELS = {MLP:'Los Pelambres', CEN:'Centinela', ANT:'Antucoya', CMZ:'Zaldívar'};

function ExplicacionesTab({period}) {
  const {a1fin, m1fin} = period;
  const [company, setCompany] = useState('Grupo Minero');
  const [año, setAño] = useState(a1fin);
  const [mes, setMes] = useState(m1fin);
  const [pnl, setPnl] = useState('ytd');
  const [decimals, setDecimals] = useState(1);
  const [data, loading, error, run] = useAsyncState();

  function cargar() {
    const url = x => `/api/explicaciones/${x}?año=${año}&mes=${mes}`;
    if (company === 'Grupo Minero') {
      run(Promise.all(COMPANIES.map(x => apiGet(url(x)))).then(aggregateExpResults));
    } else if (company === 'Todas') {
      run(Promise.all(COMPANIES.map(x => apiGet(url(x)))).then(results => ({
        _todas: true,
        byCompany: Object.fromEntries(COMPANIES.map((c, i) => [c, results[i]])),
      })));
    } else {
      run(apiGet(url(company)));
    }
  }

  /* Renderiza un panel completo para un pd dado, con sus propias funciones de formato */
  function renderPanel(pd, compLabel) {
    if (!pd) return null;
    const cprod = pd.cu_prod_real;
    const toC = ef => (ef == null || cprod == null || cprod === 0) ? null : ef * 100 / (cprod * 2204.62);
    const smC = rows => { let t=null; for(const r of rows){const v=toC(r.efecto_kus); if(v!=null)t=(t||0)+v;} return t; };
    const smK = rows => { let t=null; for(const r of rows){if(r.efecto_ktcuf!=null)t=(t||0)+r.efecto_ktcuf;} return t; };
    const fC = v => { if(v==null)return <span style={{color:'#bbb'}}>—</span>; const col=v<0?'var(--red)':v>0?'#059669':'inherit'; return <span style={{color:col,fontWeight:700}}>{v>=0?'+':''}{v.toFixed(decimals)} c/lb</span>; };
    const fK = v => { if(v==null)return <span style={{color:'#bbb'}}>—</span>; const col=v<0?'var(--red)':v>0?'#059669':'inherit'; return <span style={{color:col,fontWeight:700}}>{v>=0?'+':''}{v.toFixed(decimals)} ktCuf</span>; };
    const ajTot=smC(pd.ajuste_monetario), piTot=smC(pd.precio_insumos), rendTot=smC(pd.rendimiento), prodTot=smK(pd.produccion);
    return (
      <div className="card" key={compLabel}>
        {compLabel && (
          <div style={{fontWeight:700, fontSize:'1rem', color:'var(--teal)',
            borderBottom:'2px solid var(--teal)', paddingBottom:'6px', marginBottom:'10px'}}>
            {compLabel}
          </div>
        )}
        <div style={{overflowX:'auto'}}>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px', minWidth:'640px'}}>
            <table style={EXP_TBL}>
              <ExpTblHead title="Insumos"/>
              <tbody>
                <ExpSecHd label="Ajuste Monetario" total={fC(ajTot)}/>
                {pd.ajuste_monetario.map((r,i)=>(
                  <ExpRow key={i} alt={i%2!==0} label={r.label} unit={r.unit} real={r.real} ppto={r.ppto} efNode={fC(toC(r.efecto_kus))}/>
                ))}
                <ExpSecHd label="Precio Insumos" total={fC(piTot)}/>
                {pd.precio_insumos.map((r,i)=>(
                  <ExpRow key={i} alt={i%2!==0} label={r.label} unit={r.unit} real={r.real} ppto={r.ppto} efNode={fC(toC(r.efecto_kus))}/>
                ))}
                <ExpSecHd label="Rendimiento" total={fC(rendTot)}/>
                {pd.rendimiento.map((r,i)=>(
                  <ExpRow key={i} alt={i%2!==0} label={r.label} unit={r.unit} real={r.real} ppto={r.ppto} efNode={fC(toC(r.efecto_kus))}/>
                ))}
              </tbody>
            </table>
            <table style={EXP_TBL}>
              <ExpTblHead title="Actividad"/>
              <tbody>
                <ExpSecHd label="Producción" total={fK(prodTot)}/>
                {pd.produccion.map((r,i)=>(
                  <ExpRow key={i} alt={i%2!==0} label={r.label} unit={r.unit} real={r.real} ppto={r.ppto}
                    efNode={r.efecto_kus!=null ? fC(toC(r.efecto_kus)) : fK(r.efecto_ktcuf)}/>
                ))}
                <ExpSecHd label="Movimiento Mina" total={fC(toC(pd.mov_mina.efecto_kus))}/>
                <ExpRow label="Movimiento total Mina" unit="kt" real={pd.mov_mina.real} ppto={pd.mov_mina.ppto}
                  efNode={fC(toC(pd.mov_mina.efecto_kus))}/>
                <ExpSecHd label="Desarrollo Mina" total={fC(toC(pd.desarrollo_mina.efecto_kus))}/>
                <ExpRow label="Tonelaje" unit="kt" real={pd.desarrollo_mina.tonelaje_real} ppto={pd.desarrollo_mina.tonelaje_ppto}
                  efNode={fC(toC(pd.desarrollo_mina.tonelaje_efecto_kus))}/>
                <ExpRow label="Costo unitario" unit="US$/t" real={pd.desarrollo_mina.cu_real} ppto={pd.desarrollo_mina.cu_ppto}
                  efNode={fC(toC(pd.desarrollo_mina.cu_efecto_kus))}/>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    );
  }

  const pd = data?._todas ? null : data?.data?.[pnl];

  return (
    <div className="main">
      {/* Controls */}
      <div className="card">
        <div className="card-title">Explicaciones</div>
        <div className="company-tabs">
          {['Grupo Minero', ...COMPANIES, 'Todas'].map(c => (
            <button key={c} className={`company-tab ${company===c?'active':''}`} onClick={()=>setCompany(c)}>{c}</button>
          ))}
        </div>
        <div style={{display:'flex', gap:'12px', flexWrap:'wrap', alignItems:'flex-end', marginTop:'12px'}}>
          <div className="form-group">
            <label>Año</label>
            <select value={año} onChange={e=>setAño(Number(e.target.value))}>
              {RANGE_YEARS.map(a=><option key={a}>{a}</option>)}
            </select>
          </div>
          <div className="form-group">
            <label>Mes</label>
            <select value={mes} onChange={e=>setMes(Number(e.target.value))}>
              {MESES.slice(1).map((m,i)=><option key={i+1} value={i+1}>{m}</option>)}
            </select>
          </div>
          <button className="btn btn-primary" onClick={cargar} disabled={loading} style={{height:'38px'}}>
            {loading ? <><span className="spin"/>Cargando…</> : 'Cargar'}
          </button>
          {data && (
            <div style={{display:'flex', gap:'6px', alignSelf:'flex-end'}}>
              {[['ytd','YTD'],['mes','Mes']].map(([k,lbl]) => (
                <button key={k} onClick={()=>setPnl(k)} style={{
                  padding:'6px 18px', border:'2px solid', borderRadius:'6px',
                  cursor:'pointer', fontWeight:700, fontSize:'.86rem',
                  borderColor: pnl===k ? 'var(--teal)' : '#ddd',
                  background:  pnl===k ? 'var(--teal)' : 'white',
                  color:       pnl===k ? 'white' : '#666',
                }}>{lbl}</button>
              ))}
            </div>
          )}
          <div style={{display:'flex', gap:'4px', alignSelf:'flex-end', marginLeft:'8px', alignItems:'center'}}>
            <span style={{fontSize:'.75rem', color:'#aaa'}}>Dec.</span>
            <select value={decimals} onChange={e=>setDecimals(Number(e.target.value))}
              style={{padding:'3px 4px', border:'1px solid #ddd', borderRadius:'5px',
                fontSize:'.8rem', color:'#555', background:'white', cursor:'pointer'}}>
              {[0,1,2,3].map(d=><option key={d} value={d}>{d}</option>)}
            </select>
          </div>
        </div>
        {error && <p className="err" style={{marginTop:'12px'}}>{error}</p>}
      </div>

      {data?._todas
        ? COMPANIES.map(co => renderPanel(data.byCompany[co]?.data?.[pnl], EXP_CO_LABELS[co] || co))
        : pd && renderPanel(pd, null)
      }
    </div>
  );
}

/* ─── Tab: Costos Ajustados ─── */
function CostosAjustadosTab({period}) {
  const {a1fin, m1fin} = period;
  const [company, setCompany] = useState('MLP');
  const [data, setData]       = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError]           = useState('');
  const [expandedGroups, setExpandedGroups] = useState(null);

  function toggleGroup(key) {
    setExpandedGroups(p => { const n = new Set(p || []); n.has(key) ? n.delete(key) : n.add(key); return n; });
  }

  useEffect(() => {
    if (!a1fin || !m1fin) return;
    setLoading(true); setError(''); setData(null);
    apiGet(`/api/costos-ajustados/${company}?año=${a1fin}&mes=${m1fin}`)
      .then(d => setData(d))
      .catch(e => setError(e.message || 'Error'))
      .finally(() => setLoading(false));
  }, [company, a1fin, m1fin]);

  // Auto-expand groups that have at least one mapped subarea; collapse all-NA groups
  useEffect(() => {
    if (!data) return;
    setExpandedGroups(new Set(
      (data.grupos || [])
        .filter(grp => (grp.subareas || []).some(sa => sa.mapped))
        .map(grp => grp.key)
    ));
  }, [data]);

  const fmtV = v => {
    if (v == null) return <span style={{color:'#ccc'}}>—</span>;
    const n = Number(v) / 1000;
    if (isNaN(n)) return '—';
    return n.toLocaleString('es-CL', {minimumFractionDigits:1, maximumFractionDigits:1});
  };
  const fmtD = v => {
    if (v == null) return <span style={{color:'#ccc'}}>—</span>;
    const n = Number(v) / 1000;
    if (isNaN(n)) return '—';
    const color = n < 0 ? '#059669' : n > 0 ? '#dc2626' : '#555';
    return <span style={{color, fontWeight:'700'}}>{n.toLocaleString('es-CL', {minimumFractionDigits:1, maximumFractionDigits:1})}</span>;
  };

  const TH  = {background:'var(--navy)', color:'white', padding:'6px 8px', textAlign:'right', fontSize:'.75rem', whiteSpace:'nowrap', fontWeight:'600'};
  const TD  = {padding:'4px 8px', textAlign:'right', fontSize:'.8rem', whiteSpace:'nowrap', borderLeft:'1px solid #f0f0f0'};
  const SEP = {borderRight:'3px solid #9ca3af'};

  function sumCA(sas) {
    const mapped = (sas || []).filter(sa => sa.mapped);
    if (!mapped.length) return null;
    function ss(vals) { const v = vals.filter(x => x != null); return v.length ? v.reduce((a,b)=>a+b,0) : null; }
    const KEYS = ['real','ppto','ppto_aj_tot','dif'];
    const mes = {}; const ytd = {};
    for (const k of KEYS) {
      mes[k] = ss(mapped.map(sa => sa.mes?.[k]));
      ytd[k] = ss(mapped.map(sa => sa.ytd?.[k]));
    }
    return {mes, ytd};
  }

  function Cells({m, y, bold=false, bg, fg}) {
    const s = bold ? {...TD, fontWeight:'700'} : TD;
    const bs = bg ? {...s, background:bg, ...(fg ? {color:fg} : {})} : s;
    return <>
      <td style={bs}>{fmtV(m?.real)}</td>
      <td style={bs}>{fmtV(m?.ppto)}</td>
      <td style={{...bs, fontWeight: bold ? '800' : '600'}}>{fmtV(m?.ppto_aj_tot)}</td>
      <td style={{...bs, ...SEP}}>{fmtD(m?.dif)}</td>
      <td style={bs}>{fmtV(y?.real)}</td>
      <td style={bs}>{fmtV(y?.ppto)}</td>
      <td style={{...bs, fontWeight: bold ? '800' : '600'}}>{fmtV(y?.ppto_aj_tot)}</td>
      <td style={bs}>{fmtD(y?.dif)}</td>
    </>;
  }

  return (
    <div className="main">
      <div className="card">
        <div style={{display:'flex', alignItems:'center', gap:'16px', marginBottom:'12px', flexWrap:'wrap'}}>
          <div className="card-title" style={{margin:0}}>Costos Ajustados por FX / IPC</div>
          <div className="company-tabs" style={{margin:0}}>
            {COMPANIES.map(c=>(
              <button key={c} className={`company-tab ${company===c?'active':''}`} onClick={()=>setCompany(c)}>{c}</button>
            ))}
          </div>
        </div>
        <p style={{fontSize:'.78rem', color:'#888', marginBottom:'12px'}}>
          <strong>{MESES[data?.mes ?? m1fin]} {a1fin}</strong> · adj_factor = (FX_r/FX_b)×(IPC_r/IPC_b) · PptoAjTot = Ppto×%F×adj + Ppto×%V · Dif = PptoAjTot − Ppto · <em>US$m</em>
        </p>

        {loading && <p style={{color:'#aaa'}}><span className="spin"/>Calculando…</p>}
        {error   && <p className="err">{error}</p>}

        {!loading && !error && data && (
          <div className="tbl-wrap">
            <table style={{fontSize:'.8rem', borderCollapse:'collapse'}}>
              <thead>
                <tr>
                  <th style={{...TH, textAlign:'left', position:'sticky', left:0, zIndex:2, minWidth:'230px', background:'var(--navy)', borderRight:'1px solid #2a4a5a'}} rowSpan={2}>Sub-área</th>
                  <th style={{...TH, textAlign:'center', background:'#1A5F6E'}} colSpan={4}>Mes {MESES[data.mes ?? m1fin]} {a1fin}</th>
                  <th style={{...TH, textAlign:'center', background:'#1A4E5A'}} colSpan={4}>YTD {a1fin}</th>
                </tr>
                <tr>
                  {['Real','Ppto','Ppto Aj Tot','Dif.','Real','Ppto','Ppto Aj Tot','Dif.'].map((h,i)=>(
                    <th key={i} style={{...TH, background: i<4 ? '#1A5F6E' : '#1A4E5A', ...(i===3?SEP:{})}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {(data.grupos || []).map(grp => {
                  const sas = grp.subareas || [];
                  const isLeaf   = sas.length <= 1;
                  const isExp    = expandedGroups ? expandedGroups.has(grp.key) : sas.some(sa => sa.mapped);
                  // Usa el total pre-calculado por el backend (puede ser mapeo directo o suma de subareas)
                  const grpTotal = grp.total ?? (isLeaf && sas[0]?.mapped ? {mes: sas[0].mes, ytd: sas[0].ytd} : null);
                  return (
                  <React.Fragment key={grp.key}>
                    <tr>
                      <td style={{background:'#1A3A4A', color:'white', fontWeight:'700', padding:'6px 10px', position:'sticky', left:0, zIndex:1, borderRight:'1px solid #2a4a5a', fontSize:'.82rem'}}>
                        {!isLeaf && (
                          <button onClick={() => toggleGroup(grp.key)} style={{
                            marginRight:'6px', background:'none', border:'1px solid rgba(255,255,255,0.4)',
                            borderRadius:'3px', color:'white', cursor:'pointer', fontSize:'.7rem',
                            padding:'0 4px', lineHeight:'1.4', verticalAlign:'middle',
                          }}>{isExp ? '−' : '+'}</button>
                        )}
                        {grp.label}
                      </td>
                      <Cells m={grpTotal?.mes} y={grpTotal?.ytd} bold={true} bg='#1A3A4A' fg='white'/>
                    </tr>
                    {!isLeaf && isExp && sas.map(sa => {
                      const dim = !sa.mapped;
                      const lblSt = {padding:'4px 10px 4px 24px', fontSize:'.8rem', position:'sticky', left:0, zIndex:1,
                        background:'white', borderRight:'1px solid #eee',
                        color: dim ? '#bbb' : '#374151', fontStyle: dim ? 'italic' : 'normal', whiteSpace:'nowrap'};
                      const tdSt = dim ? {...TD, color:'#ccc'} : TD;
                      return (
                        <tr key={sa.key}>
                          <td style={lblSt}>{sa.label}</td>
                          <td style={tdSt}>{fmtV(sa.mes?.real)}</td>
                          <td style={tdSt}>{fmtV(sa.mes?.ppto)}</td>
                          <td style={{...tdSt, fontWeight:'600'}}>{fmtV(sa.mes?.ppto_aj_tot)}</td>
                          <td style={{...tdSt, ...SEP}}>{fmtD(sa.mes?.dif)}</td>
                          <td style={tdSt}>{fmtV(sa.ytd?.real)}</td>
                          <td style={tdSt}>{fmtV(sa.ytd?.ppto)}</td>
                          <td style={{...tdSt, fontWeight:'600'}}>{fmtV(sa.ytd?.ppto_aj_tot)}</td>
                          <td style={tdSt}>{fmtD(sa.ytd?.dif)}</td>
                        </tr>
                      );
                    })}
                  </React.Fragment>
                  );
                })}

                {/* Costo On Site */}
                <tr style={{borderTop:'2px solid #e5e7eb'}}>
                  <td style={{padding:'6px 10px', fontWeight:'700', position:'sticky', left:0, zIndex:1, background:'#dbeafe', borderRight:'1px solid #eee', fontSize:'.82rem'}}>
                    Costo On Site
                  </td>
                  <Cells m={data.totales?.costo_onsite?.mes} y={data.totales?.costo_onsite?.ytd} bold={true} bg='#dbeafe'/>
                </tr>

                {/* Summary rows + subtotales intercalados */}
                {(() => {
                  const sm = {};
                  (data.summary || []).forEach(sr => { sm[sr.key] = sr; });
                  const tot = data.totales || {};
                  const SUBrow = (key, label, bg) => {
                    const m = tot[key]?.mes, y = tot[key]?.ytd;
                    return (
                      <tr key={key} style={{borderTop:'1px solid #e5e7eb'}}>
                        <td style={{padding:'6px 10px', fontWeight:'700', position:'sticky', left:0, zIndex:1, background:bg, borderRight:'1px solid #eee', fontSize:'.82rem'}}>{label}</td>
                        <Cells m={m} y={y} bold={true} bg={bg}/>
                      </tr>
                    );
                  };
                  const SMrow = (key) => {
                    const sr = sm[key];
                    if (!sr) return null;
                    const dim = !sr.mapped;
                    const lblSt = {padding:'4px 10px', fontSize:'.8rem', position:'sticky', left:0, zIndex:1,
                      background:'#fffbf0', borderRight:'1px solid #eee',
                      color: dim ? '#bbb' : '#374151', fontStyle: dim ? 'italic' : 'normal', whiteSpace:'nowrap'};
                    const tdSt = {...TD, background:'#fffbf0', ...(dim ? {color:'#ccc'} : {})};
                    return (
                      <tr key={key}>
                        <td style={lblSt}>{sr.label}</td>
                        <td style={tdSt}>{fmtV(sr.mes?.real)}</td>
                        <td style={tdSt}>{fmtV(sr.mes?.ppto)}</td>
                        <td style={{...tdSt, fontWeight:'600'}}>{fmtV(sr.mes?.ppto_aj_tot)}</td>
                        <td style={{...tdSt, ...SEP}}>{fmtD(sr.mes?.dif)}</td>
                        <td style={tdSt}>{fmtV(sr.ytd?.real)}</td>
                        <td style={tdSt}>{fmtV(sr.ytd?.ppto)}</td>
                        <td style={{...tdSt, fontWeight:'600'}}>{fmtV(sr.ytd?.ppto_aj_tot)}</td>
                        <td style={tdSt}>{fmtD(sr.ytd?.dif)}</td>
                      </tr>
                    );
                  };
                  return [
                    <tr key="otros_hdr">
                      <td colSpan={9} style={{background:'#f3f4f6', padding:'4px 10px', fontWeight:'600', fontSize:'.72rem', color:'#6b7280', borderTop:'2px solid #e5e7eb', letterSpacing:'.04em', textTransform:'uppercase'}}>
                        Otros conceptos
                      </td>
                    </tr>,
                    SMrow('tcrc'),
                    SMrow('comer'),
                    SUBrow('pre_credito', 'Costo Pre-crédito', '#f8fafc'),
                    SMrow('credito_subp'),
                    SUBrow('c1', 'Costo C1', '#f0f9f9'),
                    SMrow('da'),
                    SUBrow('c2', 'Costo C2', '#ecfdf5'),
                    SMrow('otros_fin'),
                    SMrow('dif_cambio'),
                    SMrow('donaciones'),
                    SMrow('gasto_expl'),
                    SMrow('ing_gasto_fin'),
                    SMrow('ing_no_op'),
                    SMrow('otros_egr_op'),
                    SUBrow('c3', 'Costo C3', '#d1fae5'),
                  ].filter(Boolean);
                })()}
              </tbody>
            </table>
          </div>
        )}

        {!loading && !error && !data && (
          <p style={{color:'#aaa', fontSize:'.9rem'}}>Selecciona período para calcular.</p>
        )}
      </div>
    </div>
  );
}

/* ─── Tab: Costos Ajustados Mes (CM) ─── */
function CostosAjMesTab({period}) {
  const {a1fin, m1fin} = period;
  const [company,  setCompany]  = useState('MLP');
  const [data,     setData]     = useState(null);
  const [loading,  setLoading]  = useState(false);
  const [error,    setError]    = useState('');
  const [showSec,  setShowSec]  = useState({ppto:true, tc:true, ipc:false, cpi:false});
  const [showSub,  setShowSub]  = useState(true);
  const [expandedGroups, setExpandedGroups] = useState(null);
  const scrollRef = useRef(null);

  function toggleGroup(key) {
    setExpandedGroups(p => { const n = new Set(p || []); n.has(key) ? n.delete(key) : n.add(key); return n; });
  }

  useEffect(() => {
    if (!a1fin || !m1fin) return;
    setLoading(true); setError(''); setData(null);
    apiGet(`/api/costos-ajustados/${company}/monthly?año=${a1fin}&mes_cierre=${m1fin}`)
      .then(d => setData(d))
      .catch(e => setError(e.message || 'Error'))
      .finally(() => setLoading(false));
  }, [company, a1fin, m1fin]);

  useEffect(() => {
    if (!data) return;
    setExpandedGroups(new Set(
      (data.grupos || [])
        .filter(grp => (grp.subareas || []).some(sa => sa.mapped))
        .map(grp => grp.key)
    ));
  }, [data]);

  const MO_S = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const FS   = '.68rem';

  const fmtV = v => {
    if (v == null) return <span style={{color:'#ccc'}}>—</span>;
    const n = Number(v) / 1000;
    return isNaN(n) ? '—' : n.toLocaleString('es-CL', {minimumFractionDigits:2, maximumFractionDigits:2});
  };
  const fmtE = v => {
    if (v == null) return <span style={{color:'#ccc'}}>—</span>;
    const n = Number(v) / 1000;
    if (isNaN(n)) return '—';
    const c = n < 0 ? '#059669' : n > 0 ? '#dc2626' : '#555';
    return <span style={{color:c, fontWeight:'700'}}>{n.toLocaleString('es-CL', {minimumFractionDigits:2, maximumFractionDigits:2})}</span>;
  };
  const fmtPct = v => v == null ? '' : `${Math.round((v || 0) * 100)}%`;

  const TDB = {padding:'2px 4px', textAlign:'right', whiteSpace:'nowrap', fontSize:FS, borderLeft:'1px solid #f0f0f0'};
  const THB = {padding:'3px 5px', textAlign:'right', whiteSpace:'nowrap', fontWeight:'600', fontSize:FS, color:'white'};
  const BDR = {borderRight:'2px solid #9ca3af'};

  const C_PPTO = '#1A3A4A'; const C_TC = '#1A5F6E'; const C_IPC = '#3d5a80'; const C_CPI = '#6b4c99';

  // Dynamic column count: 2(%F/%V) + visible sections
  const dataCols = 2 + (showSec.ppto?14:0) + (showSec.tc?16:0) + (showSec.ipc?16:0) + (showSec.cpi?16:0);

  function toggleSec(k) { setShowSec(p => ({...p, [k]: !p[k]})); }

  // Scroll the table wrapper to a named section anchor
  function scrollToSec(id) {
    const el = document.getElementById(id);
    if (el && scrollRef.current) {
      scrollRef.current.scrollLeft = el.offsetLeft - 210;
    }
  }

  function RowData({row, fijo, bold=false, bg}) {
    const isDark = bg === '#1A3A4A';
    const darkTxt = isDark ? {color:'white'} : {};
    const lightTxt = isDark ? {color:'#1A3A4A'} : {};
    const bs = bold
      ? {...TDB, fontWeight:'700', background:bg, ...darkTxt}
      : (bg ? {...TDB, background:bg, ...darkTxt} : TDB);
    const mc1 = m1fin - 1;
    if (!row || !row.mapped) {
      const span = dataCols - 2;
      return <>
        <td style={{...TDB, background:'#f9fafb'}}></td>
        <td style={{...TDB, background:'#f9fafb', ...BDR}}></td>
        {span > 0 && <td colSpan={span} style={{...TDB, color:'#ccc', textAlign:'center', fontStyle:'italic'}}>—</td>}
      </>;
    }
    const p   = row.ppto   || Array(12).fill(null);
    const atc = row.aj_tc  || Array(12).fill(null);
    const ai  = row.aj_ipc || Array(12).fill(null);
    const ac  = row.aj_cpi || Array(12).fill(null);
    const lastVisible = showSec.cpi ? 'cpi' : showSec.ipc ? 'ipc' : showSec.tc ? 'tc' : 'ppto';

    return <>
      <td style={{...bs, textAlign:'center', background:(bg||'#f9fafb'), ...lightTxt}}>{fmtPct(fijo)}</td>
      <td style={{...bs, textAlign:'center', background:(bg||'#f9fafb'), ...lightTxt, ...(lastVisible==='ppto'&&!showSec.ppto?BDR:{borderRight:'1px solid #ddd'})}}>{fmtPct(fijo == null ? null : 1 - fijo)}</td>

      {showSec.ppto && <>
        {p.map((v,i) => <td key={`p${i}`} style={{...bs, ...(i===mc1?{background:'#d4e8ee',...lightTxt}:{})}}>{fmtV(v)}</td>)}
        <td style={{...bs, background:'#c8e0e8', fontWeight:'700', ...lightTxt}}>{fmtV(row.ppto_mes)}</td>
        <td style={{...bs, background:'#c8e0e8', fontWeight:'700', ...lightTxt, ...(lastVisible==='ppto'?BDR:{})}}>{fmtV(row.ppto_acum)}</td>
      </>}

      {showSec.tc && <>
        {atc.map((v,i) => <td key={`tc${i}`} style={{...bs, ...(i===mc1?{background:'#d4ede8',...lightTxt}:{})}}>{fmtV(v)}</td>)}
        <td style={{...bs, background:'#b8dfd8', fontWeight:'700', ...lightTxt}}>{fmtV(row.aj_tc_mes)}</td>
        <td style={{...bs, background:'#b8dfd8', fontWeight:'700', ...lightTxt}}>{fmtV(row.aj_tc_acum)}</td>
        <td style={bs}>{fmtE(row.ef_tc_mes)}</td>
        <td style={{...bs, ...(lastVisible==='tc'?BDR:{})}}>{fmtE(row.ef_tc_acum)}</td>
      </>}

      {showSec.ipc && <>
        {ai.map((v,i) => <td key={`ipc${i}`} style={{...bs, ...(i===mc1?{background:'#dce8f5',...lightTxt}:{})}}>{fmtV(v)}</td>)}
        <td style={{...bs, background:'#c8daf0', fontWeight:'700', ...lightTxt}}>{fmtV(row.aj_ipc_mes)}</td>
        <td style={{...bs, background:'#c8daf0', fontWeight:'700', ...lightTxt}}>{fmtV(row.aj_ipc_acum)}</td>
        <td style={bs}>{fmtE(row.ef_ipc_mes)}</td>
        <td style={{...bs, ...(lastVisible==='ipc'?BDR:{})}}>{fmtE(row.ef_ipc_acum)}</td>
      </>}

      {showSec.cpi && <>
        {ac.map((v,i) => <td key={`cpi${i}`} style={{...bs, ...(i===mc1?{background:'#ece5f8',...lightTxt}:{})}}>{fmtV(v)}</td>)}
        <td style={{...bs, background:'#ddd0f0', fontWeight:'700', ...lightTxt}}>{fmtV(row.aj_cpi_mes)}</td>
        <td style={{...bs, background:'#ddd0f0', fontWeight:'700', ...lightTxt}}>{fmtV(row.aj_cpi_acum)}</td>
        <td style={bs}>{fmtE(row.ef_cpi_mes)}</td>
        <td style={{...bs, ...BDR}}>{fmtE(row.ef_cpi_acum)}</td>
      </>}
    </>;
  }

  const SECS = [
    {k:'ppto', label:'PPTO',    color:C_PPTO},
    {k:'tc',   label:'Aj TC',   color:C_TC},
    {k:'ipc',  label:'Aj IPC',  color:C_IPC},
    {k:'cpi',  label:'Aj CPI',  color:C_CPI},
  ];

  return (
    <div className="main">
      <div className="card" style={{overflow:'hidden'}}>
        {/* Header row */}
        <div style={{display:'flex', alignItems:'center', gap:'12px', marginBottom:'10px', flexWrap:'wrap'}}>
          <div className="card-title" style={{margin:0}}>Costos Ajustados Mes (CM)</div>
          <div className="company-tabs" style={{margin:0}}>
            {COMPANIES.map(c=>(
              <button key={c} className={`company-tab ${company===c?'active':''}`} onClick={()=>setCompany(c)}>{c}</button>
            ))}
          </div>
          {/* Section toggles */}
          <div style={{display:'flex', gap:'5px', marginLeft:'auto', flexWrap:'wrap', alignItems:'center'}}>
            <button onClick={()=>setShowSub(p=>!p)} style={{
              padding:'4px 11px', border:'2px solid', borderRadius:'5px', cursor:'pointer',
              fontSize:'.78rem', fontWeight:'600', transition:'all .15s',
              background: showSub ? '#f0fdf4' : '#f3f4f6',
              borderColor: showSub ? '#059669' : '#d1d5db',
              color: showSub ? '#059669' : '#9ca3af',
            }}>{showSub ? '▾ Sub-áreas' : '▸ Sub-áreas'}</button>
            <span style={{width:'1px', height:'20px', background:'#e5e7eb', margin:'0 2px'}}></span>
            <span style={{fontSize:'.72rem', color:'#888', alignSelf:'center', marginRight:'2px'}}>Secciones:</span>
            {SECS.map(({k, label, color}) => (
              <button key={k} onClick={()=>toggleSec(k)} style={{
                padding:'4px 11px', border:'none', borderRadius:'5px', cursor:'pointer',
                fontSize:'.78rem', fontWeight:'600',
                background: showSec[k] ? color : '#e5e7eb',
                color: showSec[k] ? 'white' : '#6b7280',
                transition:'all .15s',
              }}>{label}</button>
            ))}
          </div>
        </div>

        <p style={{fontSize:'.72rem', color:'#888', marginBottom:'8px'}}>
          PPTO {a1fin} ajustado · mes cierre: <strong>{MESES[m1fin]}</strong> · <em>US$m</em> ·
          <span style={{marginLeft:'8px', color:'#d4e8ee', background:'#1A3A4A', padding:'1px 6px', borderRadius:'3px', fontSize:'.68rem'}}>
            col {MO_S[m1fin-1]} resaltada
          </span>
        </p>

        {loading && <p style={{color:'#aaa'}}><span className="spin"/>Calculando…</p>}
        {error   && <p className="err">{error}</p>}

        {!loading && !error && data && (() => {
          const LBL = {padding:'3px 8px', fontWeight:'600', position:'sticky', left:0, zIndex:1,
                       background:'white', borderRight:'1px solid #eee', whiteSpace:'nowrap', fontSize:FS};
          const GRP = {padding:'4px 8px', fontWeight:'700', position:'sticky', left:0, zIndex:1,
                       color:'white', background:C_PPTO, borderRight:'1px solid #2a4a5a', whiteSpace:'nowrap', fontSize:FS};
          const TOT = {padding:'4px 8px', fontWeight:'700', position:'sticky', left:0, zIndex:1,
                       borderRight:'1px solid #eee', whiteSpace:'nowrap', fontSize:FS};
          const TH_STICKY = {position:'sticky', top:0, zIndex:2};

          // Frontend sum: adds monthly arrays element-wise from mapped rows
          function sumMR(rows) {
            const mapped = (rows||[]).filter(r => r && r.mapped);
            if (!mapped.length) return null;
            const ARR = ['ppto','aj_tc','aj_ipc','aj_cpi','ef_tc','ef_ipc','ef_cpi'];
            const SC  = ['ppto_mes','ppto_acum','aj_tc_mes','aj_tc_acum','aj_ipc_mes','aj_ipc_acum',
                         'aj_cpi_mes','aj_cpi_acum','ef_tc_mes','ef_tc_acum','ef_ipc_mes','ef_ipc_acum',
                         'ef_cpi_mes','ef_cpi_acum'];
            const res = {mapped: true};
            for (const k of ARR) {
              res[k] = Array.from({length:12}, (_, i) => {
                const vals = mapped.map(r => (r[k]||[])[i]).filter(v => v != null);
                return vals.length ? vals.reduce((a,b) => a+b, 0) : null;
              });
            }
            for (const k of SC) {
              const vals = mapped.map(r => r[k]).filter(v => v != null);
              res[k] = vals.length ? vals.reduce((a,b) => a+b, 0) : null;
            }
            return res;
          }

          // Pre-compute all group totals and section totals client-side
          // Usa total del backend si existe (puede ser mapeo directo); fallback a suma cliente
          const grpTotals = (data.grupos||[]).map(grp =>
            grp.total?.mapped ? grp.total : sumMR(grp.subareas||[]));
          const onsiteTotal = sumMR(grpTotals);
          const sumMap = {};
          (data.summary||[]).forEach(sr => { if (sr.mapped) sumMap[sr.key] = sr; });
          const preCredito = sumMR([onsiteTotal, sumMap['tcrc'], sumMap['comer']].filter(Boolean));
          const c1Total    = sumMR([preCredito,  sumMap['credito_subp']].filter(Boolean));
          const c2Total    = sumMR([c1Total,      sumMap['da']].filter(Boolean));
          const c3Total    = sumMR([c2Total, sumMap['otros_fin'], sumMap['dif_cambio'],
            sumMap['donaciones'], sumMap['gasto_expl'], sumMap['ing_gasto_fin'],
            sumMap['ing_no_op'], sumMap['otros_egr_op']].filter(Boolean));

          return (
            <div ref={scrollRef} style={{overflowX:'auto', maxHeight:'70vh', overflowY:'auto'}}>
              <table style={{fontSize:FS, borderCollapse:'collapse'}}>
                <thead style={{position:'sticky', top:0, zIndex:4}}>
                  <tr>
                    <th rowSpan={2} style={{...THB, ...TH_STICKY, textAlign:'left', left:0, zIndex:5,
                      background:C_PPTO, minWidth:'200px', padding:'4px 8px', borderRight:'1px solid #2a4a5a'}}>
                      Sub-área
                    </th>
                    <th colSpan={2} style={{...THB, ...TH_STICKY, background:'#374151', textAlign:'center', borderRight:'1px solid #555'}}>%</th>
                    {showSec.ppto && <th colSpan={14} style={{...THB, ...TH_STICKY, background:C_PPTO, textAlign:'center', ...(showSec.tc||showSec.ipc||showSec.cpi?BDR:{})}}>
                      <span id="sec-ppto">PPTO {a1fin}</span>
                    </th>}
                    {showSec.tc  && <th colSpan={16} style={{...THB, ...TH_STICKY, background:C_TC,  textAlign:'center', ...(showSec.ipc||showSec.cpi?BDR:{})}}>
                      <span id="sec-tc">Ajustado TC + Efecto TC</span>
                    </th>}
                    {showSec.ipc && <th colSpan={16} style={{...THB, ...TH_STICKY, background:C_IPC, textAlign:'center', ...(showSec.cpi?BDR:{})}}>
                      <span id="sec-ipc">Ajustado IPC + Efecto IPC</span>
                    </th>}
                    {showSec.cpi && <th colSpan={16} style={{...THB, ...TH_STICKY, background:C_CPI, textAlign:'center', ...BDR}}>
                      <span id="sec-cpi">Ajustado CPI + Efecto CPI</span>
                    </th>}
                  </tr>
                  <tr>
                    <th style={{...THB, ...TH_STICKY, background:'#374151', textAlign:'center'}}>Fijo</th>
                    <th style={{...THB, ...TH_STICKY, background:'#374151', textAlign:'center', borderRight:'1px solid #555'}}>Var</th>
                    {showSec.ppto && <>
                      {MO_S.map((m,i)=><th key={`hp${i}`} style={{...THB,...TH_STICKY, background:i===m1fin-1?'#27687a':C_PPTO}}>{m}</th>)}
                      <th style={{...THB,...TH_STICKY, background:'#1A5080'}}>Mes</th>
                      <th style={{...THB,...TH_STICKY, background:'#1A5080', ...(showSec.tc||showSec.ipc||showSec.cpi?BDR:{})}}>Acum</th>
                    </>}
                    {showSec.tc && <>
                      {MO_S.map((m,i)=><th key={`htc${i}`} style={{...THB,...TH_STICKY, background:i===m1fin-1?'#2e8090':C_TC}}>{m}</th>)}
                      <th style={{...THB,...TH_STICKY, background:'#0d5060'}}>Mes</th>
                      <th style={{...THB,...TH_STICKY, background:'#0d5060'}}>Acum</th>
                      <th style={{...THB,...TH_STICKY, background:'#0a4050'}}>Ef Mes</th>
                      <th style={{...THB,...TH_STICKY, background:'#0a4050', ...(showSec.ipc||showSec.cpi?BDR:{})}}>Ef Acum</th>
                    </>}
                    {showSec.ipc && <>
                      {MO_S.map((m,i)=><th key={`hipc${i}`} style={{...THB,...TH_STICKY, background:i===m1fin-1?'#4a6a90':C_IPC}}>{m}</th>)}
                      <th style={{...THB,...TH_STICKY, background:'#2d4a70'}}>Mes</th>
                      <th style={{...THB,...TH_STICKY, background:'#2d4a70'}}>Acum</th>
                      <th style={{...THB,...TH_STICKY, background:'#1d3a60'}}>Ef Mes</th>
                      <th style={{...THB,...TH_STICKY, background:'#1d3a60', ...(showSec.cpi?BDR:{})}}>Ef Acum</th>
                    </>}
                    {showSec.cpi && <>
                      {MO_S.map((m,i)=><th key={`hcpi${i}`} style={{...THB,...TH_STICKY, background:i===m1fin-1?'#7a5ca9':C_CPI}}>{m}</th>)}
                      <th style={{...THB,...TH_STICKY, background:'#5a3c80'}}>Mes</th>
                      <th style={{...THB,...TH_STICKY, background:'#5a3c80'}}>Acum</th>
                      <th style={{...THB,...TH_STICKY, background:'#4a2c70'}}>Ef Mes</th>
                      <th style={{...THB,...TH_STICKY, background:'#4a2c70', ...BDR}}>Ef Acum</th>
                    </>}
                  </tr>
                </thead>
                <tbody>
                  {(data.grupos || []).map((grp, gi) => {
                    const sas    = grp.subareas || [];
                    const isLeaf = sas.length <= 1;
                    const isExp  = expandedGroups ? expandedGroups.has(grp.key) : sas.some(sa => sa.mapped);
                    return (
                      <React.Fragment key={grp.key}>
                        <tr>
                          <td style={GRP}>
                            {!isLeaf && (
                              <button onClick={() => toggleGroup(grp.key)} style={{
                                marginRight:'6px', background:'none', border:'1px solid rgba(255,255,255,0.4)',
                                borderRadius:'3px', color:'white', cursor:'pointer', fontSize:'.65rem',
                                padding:'0 3px', lineHeight:'1.4', verticalAlign:'middle',
                              }}>{isExp ? '−' : '+'}</button>
                            )}
                            {grp.label}
                          </td>
                          <RowData row={grpTotals[gi]} fijo={null} bold={true} bg='#1A3A4A'/>
                        </tr>
                        {showSub && !isLeaf && isExp && sas.map(sa => {
                          const dim = !sa.mapped;
                          return (
                            <tr key={sa.key}>
                              <td style={{...LBL, paddingLeft:'18px', color:dim?'#bbb':'#374151', fontStyle:dim?'italic':'normal'}}>
                                {sa.label}
                              </td>
                              <RowData row={sa} fijo={sa.fijo}/>
                            </tr>
                          );
                        })}
                      </React.Fragment>
                    );
                  })}

                  <tr style={{borderTop:'2px solid #e5e7eb'}}>
                    <td style={{...TOT, background:'#dbeafe'}}>Costo On Site</td>
                    <RowData row={onsiteTotal} fijo={null} bold={true} bg='#dbeafe'/>
                  </tr>

                  <tr>
                    <td colSpan={dataCols+1} style={{background:'#f3f4f6', padding:'2px 8px', fontSize:'.65rem',
                      fontWeight:'600', color:'#6b7280', borderTop:'2px solid #e5e7eb',
                      letterSpacing:'.04em', textTransform:'uppercase'}}>Otros conceptos</td>
                  </tr>

                  {(() => {
                    const SUBrow = (row, label, bg) => row ? (
                      <tr key={label} style={{borderTop:'1px solid #e5e7eb'}}>
                        <td style={{...TOT, background:bg}}>{label}</td>
                        <RowData row={row} fijo={null} bold={true} bg={bg}/>
                      </tr>
                    ) : null;
                    const SMrow = (key) => {
                      const sr = sumMap[key] || (data.summary||[]).find(s => s.key === key);
                      if (!sr) return null;
                      const dim = !sr.mapped;
                      return (
                        <tr key={key}>
                          <td style={{...LBL, background:'#fffbf0', color:dim?'#bbb':'#374151', fontStyle:dim?'italic':'normal'}}>
                            {sr.label}
                          </td>
                          <RowData row={sr} fijo={sr.fijo} bg='#fffbf0'/>
                        </tr>
                      );
                    };
                    return [
                      SMrow('tcrc'),
                      SMrow('comer'),
                      SUBrow(preCredito, 'Costo Pre-crédito', '#f8fafc'),
                      SMrow('credito_subp'),
                      SUBrow(c1Total, 'Costo C1', '#f0f9f9'),
                      SMrow('da'),
                      SUBrow(c2Total, 'Costo C2', '#ecfdf5'),
                      SMrow('otros_fin'),
                      SMrow('dif_cambio'),
                      SMrow('donaciones'),
                      SMrow('gasto_expl'),
                      SMrow('ing_gasto_fin'),
                      SMrow('ing_no_op'),
                      SMrow('otros_egr_op'),
                      SUBrow(c3Total, 'Costo C3', '#d1fae5'),
                    ].filter(Boolean);
                  })()}
                </tbody>
              </table>
            </div>
          );
        })()}

        {!loading && !error && !data && (
          <p style={{color:'#aaa', fontSize:'.9rem'}}>Selecciona período para calcular.</p>
        )}
      </div>
    </div>
  );
}

/* ─── Tab: Flash Producciones ─── */
function FlashProduccionesTab({period}) {
  const {a1fin, m1fin, tipo1, tipo2} = period;
  const [data,    setData]    = useState(null);
  const [loading, setLoading] = useState(false);
  const [error,   setError]   = useState('');

  useEffect(() => {
    if (!a1fin || !m1fin) return;
    setLoading(true); setError(''); setData(null);
    apiGet(`/api/flash-producciones?año=${a1fin}&mes=${m1fin}&tipo_r=${encodeURIComponent(tipo1)}&tipo_b=${encodeURIComponent(tipo2)}`)
      .then(setData).catch(e => setError(e.message || 'Error')).finally(() => setLoading(false));
  }, [a1fin, m1fin, tipo1, tipo2]);

  const COMPANIES = ['MLP','CEN','ANT','CMZ','GM'];
  const LABELS    = {MLP:'Los Pelambres', CEN:'Centinela', ANT:'Antucoya', CMZ:'Zaldívar (50%)', GM:'Grupo Minero'};
  const MES_NAMES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  function fmtV(v, unit) {
    if (v == null) return '—';
    if (unit === '%') return v.toFixed(2) + '%';
    if (unit === 'Mt') return v.toFixed(1);
    if (unit === 'koz' && Math.abs(v) >= 100) return Math.round(v).toString();
    return v.toFixed(1);
  }
  function fmtEf(r, b, unit) {
    if (r == null || b == null) return '—';
    const ef = r - b;
    const abs = fmtV(Math.abs(ef), unit);
    return ef < 0 ? `(${abs})` : abs;
  }
  function efColor(r, b) {
    if (r == null || b == null) return undefined;
    return r < b ? '#c0392b' : '#000';
  }

  async function downloadExcel() {
    const url = `/api/flash-producciones/excel?año=${a1fin}&mes=${m1fin}&tipo_r=${encodeURIComponent(tipo1)}&tipo_b=${encodeURIComponent(tipo2)}`;
    const resp = await fetch(url);
    if (!resp.ok) return;
    const blob = await resp.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = `Flash_Producciones_${a1fin}_${String(m1fin).padStart(2,'0')}.xlsx`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(blobUrl);
  }
  function downloadJpg() {
    const el = document.getElementById('flash-print-area');
    if (!el) return;
    html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true }).then(canvas => {
      const a = document.createElement('a');
      a.download = `Flash_Producciones_${a1fin}_${String(m1fin).padStart(2,'0')}.jpg`;
      a.href = canvas.toDataURL('image/jpeg', 0.95);
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    });
  }

  const TH = {background:'#1A3A4A', color:'white', padding:'5px 8px', fontWeight:'700', fontSize:'.72rem', whiteSpace:'nowrap', textAlign:'center'};
  const TH2 = {background:'#1E6F7E', color:'white', padding:'4px 7px', fontWeight:'600', fontSize:'.68rem', textAlign:'center'};
  const TD  = {padding:'3px 8px', fontSize:'.78rem', textAlign:'right', borderBottom:'1px solid #eee', whiteSpace:'nowrap'};
  const TDLBL = {padding:'3px 8px', fontSize:'.78rem', fontWeight:'400', position:'sticky', left:0, background:'white', zIndex:1, borderRight:'1px solid #ddd', whiteSpace:'nowrap'};

  function Section({label, rk, bk}) {
    if (!data) return null;
    return (
      <div style={{marginBottom:'24px'}}>
        <div style={{background:'#1A3A4A', color:'white', fontWeight:'700', fontSize:'.8rem', padding:'6px 10px', borderRadius:'4px 4px 0 0'}}>{label}</div>
        <div style={{overflowX:'auto'}}>
          <table style={{borderCollapse:'collapse', fontSize:'.78rem', width:'100%'}}>
            <thead>
              <tr>
                <th style={{...TH, textAlign:'left', position:'sticky', left:0, zIndex:2, minWidth:'160px'}}>KPI</th>
                <th style={{...TH, minWidth:'40px'}}>Und.</th>
                {COMPANIES.map(co => (
                  <th key={co} style={{...TH2, borderLeft:'2px solid #0f3040'}} colSpan={3}>{LABELS[co]}</th>
                ))}
              </tr>
              <tr>
                <th style={{...TH, position:'sticky', left:0, zIndex:2}}></th>
                <th style={{...TH}}></th>
                {COMPANIES.map(co => ['Real','Ppto','Efecto'].map(s => (
                  <th key={co+s} style={{...TH, background: s==='Efecto'?'#2a5a6a':'#1A4E5A', fontSize:'.65rem', borderLeft: s==='Real'?'2px solid #0f3040':'none'}}>
                    {s}
                  </th>
                )))}
              </tr>
            </thead>
            <tbody>
              {data.rows.map((row, ri) => {
                const bold = row.bold;
                const bg = bold ? '#d1fae5' : undefined;
                return (
                  <React.Fragment key={row.key}>
                    {row.sep && <tr><td colSpan={2 + COMPANIES.length * 3} style={{padding:'4px', background:'#f9fafb'}}></td></tr>}
                    <tr style={{background: bg, borderTop: bold ? '2px solid #6ee7b7' : undefined}}>
                      <td style={{...TDLBL, fontWeight: bold ? '700' : '400', background: bg || 'white'}}>{row.label}</td>
                      <td style={{...TD, textAlign:'center', color:'#888', background: bg || undefined}}>{row.unit}</td>
                      {COMPANIES.map(co => {
                        const cv = row.companies[co] || {};
                        const rv = cv[rk]; const bv = cv[bk];
                        return [
                          <td key={co+'r'} style={{...TD, borderLeft:'2px solid #ddd', background: bg}}>{fmtV(rv, row.unit)}</td>,
                          <td key={co+'b'} style={{...TD, background: bg}}>{fmtV(bv, row.unit)}</td>,
                          <td key={co+'e'} style={{...TD, background: bg, color: efColor(rv, bv), fontWeight:'600'}}>{fmtEf(rv, bv, row.unit)}</td>,
                        ];
                      })}
                    </tr>
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    );
  }

  const mesNombre = data ? MES_NAMES[data.mes - 1] : (MES_NAMES[m1fin - 1] || '');

  return (
    <div style={{padding:'16px', maxWidth:'1400px', margin:'0 auto'}}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'12px'}}>
        <h2 style={{margin:0, fontSize:'1rem', fontWeight:'700', color:'var(--navy)'}}>Flash Producciones — {mesNombre} {a1fin}</h2>
        <div style={{display:'flex', gap:'8px'}}>
          <button onClick={downloadJpg} style={{padding:'6px 14px', background:'#6b7280', color:'white', border:'none', borderRadius:'6px', cursor:'pointer', fontSize:'.8rem'}}>
            ↓ JPG
          </button>
          <button onClick={downloadExcel} style={{padding:'6px 14px', background:'#059669', color:'white', border:'none', borderRadius:'6px', cursor:'pointer', fontSize:'.8rem'}}>
            ↓ Excel
          </button>
        </div>
      </div>

      {loading && <p style={{color:'#aaa'}}><span className="spin"/>Calculando…</p>}
      {error   && <p className="err">{error}</p>}

      {!loading && !error && data && (
        <div id="flash-print-area">
          <Section label={`MES ${mesNombre} ${a1fin}`}       rk="r_mes" bk="b_mes"/>
          <Section label={`Acumulado Ene–${mesNombre} ${a1fin}`} rk="r_ytd" bk="b_ytd"/>
        </div>
      )}
    </div>
  );
}

/* ─── Root App ─── */
function App() {
  const [tab,   setTab]   = useState('viz');
  const [tipos] = useState(['Real', 'Ppto']);
  const [tipo1, setTipo1] = useState('Real');
  const [a1ini, setA1ini] = useState(DEFAULT_YR);
  const [m1ini, setM1ini] = useState(1);
  const [a1fin, setA1fin] = useState(DEFAULT_YR);
  const [m1fin, setM1fin] = useState(DEFAULT_MO);
  const [tipo2, setTipo2] = useState('Ppto');
  const [a2ini, setA2ini] = useState(DEFAULT_YR);
  const [m2ini, setM2ini] = useState(1);

  const dur       = (a1fin - a1ini) * 12 + (m1fin - m1ini);
  const m2fin_raw = m2ini + dur;
  const a2fin     = a2ini + Math.floor((m2fin_raw - 1) / 12);
  const m2fin     = ((m2fin_raw - 1) % 12) + 1;

  const period  = { tipo1, a1ini, m1ini, a1fin, m1fin, tipo2, a2ini, m2ini, a2fin, m2fin };
  const setters = { setTipo1, setA1ini, setM1ini, setA1fin, setM1fin, setTipo2, setA2ini, setM2ini };

  return (
    <>
      <Header tab={tab} setTab={setTab} period={period}/>
      {(tab==='viz' || tab==='analisis' || tab==='params' || tab==='costos_aj' || tab==='cm' || tab==='flash' || tab==='graficos') && <PeriodBar period={period} setters={setters} tipos={tipos}/>}
      {tab==='mapeos'        && <MapeosTab/>}
      {tab==='viz'           && <VisualizarTab period={period} tipos={tipos}/>}
      {tab==='analisis'      && <AnalisisCostoTab period={period}/>}
      {tab==='costos_aj'     && <CostosAjustadosTab period={period}/>}
      {tab==='cm'            && <CostosAjMesTab period={period}/>}
      {tab==='params'        && <ParamsTab period={period}/>}
      {tab==='flash'         && <FlashProduccionesTab period={period}/>}
      {tab==='explicaciones' && <ExplicacionesTab period={period}/>}
      {tab==='graficos'      && <GraficosTab period={period}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
